/* ============================================================
   PEDIDOS PROGRAMADOS (mayorista)
   El mayorista programa un pedido para que se repita cada semana, cada dos
   semanas o cada mes. Como el sistema no tiene un servidor propio, el pedido
   se genera solo la primera vez que el mayorista abre CitrusCode a partir de
   la fecha que toca, con el precio vigente del producto.
   ============================================================ */
const FRECUENCIAS = { 7: 'Cada semana', 14: 'Cada 2 semanas', 30: 'Cada mes' };
let programadosDisponible = true;   // false si Firestore todavía no tiene las reglas de pedidos programados
let programarAbierto = null;        // pedido con el formulario de programación abierto
let generandoProgramados = false;
function inicioDelDia(ms){ const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); }
function fechaInput(ms){ const d = new Date(ms); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fechaLarga(ms){ return new Date(ms).toLocaleDateString('es-AR', { weekday: 'short', day: '2-digit', month: '2-digit' }); }
/* Próxima fecha que toca después de hoy, salteando las que ya pasaron. */
function siguienteFecha(desde, dias){
  const hoy = inicioDelDia(Date.now());
  let t = desde;
  do { t += dias * 86400e3; } while(t <= hoy);
  return t;
}
function programadosMios(){
  return S.programados.slice().sort(function(a, b){ return (b.activo ? 1 : 0) - (a.activo ? 1 : 0) || a.proxima - b.proxima; });
}

function seccionProgramados(){
  if(!programadosDisponible){
    return '<div class="prog-box"><div class="prog-head"><h4>'+icono('cosecha')+'Pedidos programados</h4></div>'+
      '<p class="prog-hint">Se habilitan cuando se publiquen las reglas nuevas de Firestore.</p></div>';
  }
  const lista = programadosMios();
  const items = lista.length ? lista.map(function(pr){
    const p = lotById(pr.lotId);
    return '<div class="prog-item'+(pr.activo ? '' : ' pausado')+'">'+
      '<div class="prog-info">'+
        '<b>'+esc(pr.producto)+' · '+Number(pr.qty).toLocaleString('es-AR')+' '+esc(pr.unit || 'kg')+'</b>'+
        '<span>'+(FRECUENCIAS[pr.frecuencia] || 'Cada ' + pr.frecuencia + ' días')+' · '+esc(pr.productorNombre || (p ? p.productorNombre : ''))+'</span>'+
        '<span class="prog-prox">'+(pr.activo ? 'Próximo pedido: <b>'+fechaLarga(pr.proxima)+'</b>' : 'Pausado')+
          (pr.generados ? ' · '+pr.generados+(pr.generados === 1 ? ' pedido generado' : ' pedidos generados') : '')+'</span>'+
        (pr.ultimoResultado ? '<span class="prog-ult">Último: '+esc(pr.ultimoResultado)+'</span>' : '')+
      '</div>'+
      '<div class="prog-acc">'+
        (pr.activo
          ? '<button class="btn btn-ghost btn-sm" data-prog-pausar="'+pr.id+'">⏸ Pausar</button>'
          : '<button class="btn btn-ghost btn-sm" data-prog-reanudar="'+pr.id+'">▶ Reanudar</button>')+
        '<button class="btn btn-ghost btn-sm cancel-btn" data-prog-borrar="'+pr.id+'">🗑 Eliminar</button>'+
      '</div>'+
    '</div>';
  }).join('') : '<p class="prog-hint">Todavía no programaste ninguno. Tocá <b>🗓 Programar</b> en un pedido para que se repita solo cada semana, cada 2 semanas o cada mes.</p>';
  return '<div class="prog-box">'+
    '<div class="prog-head"><h4>'+icono('cosecha')+'Pedidos programados</h4>'+
      (lista.length ? '<span class="prog-n">'+lista.filter(function(x){ return x.activo; }).length+' activos</span>' : '')+'</div>'+
    items+
    (lista.length ? '<p class="prog-hint">El pedido se genera solo la primera vez que abrís CitrusCode a partir de la fecha indicada, con el precio vigente. Si no hay stock suficiente, se saltea y queda anotado.</p>' : '')+
  '</div>';
}

function formProgramar(o){
  if(programarAbierto !== o.id) return '';
  const p = lotById(o.lotId);
  if(!p) return '';
  const manana = inicioDelDia(Date.now()) + 7 * 86400e3;
  return '<div class="prog-form" data-keep>'+
    '<h5>Programar '+esc(p.name)+' de '+esc(p.productorNombre)+'</h5>'+
    '<div class="form-grid">'+
      '<div class="form-row"><label for="progFrec-'+o.id+'">Frecuencia</label><select id="progFrec-'+o.id+'">'+
        Object.keys(FRECUENCIAS).map(function(k){ return '<option value="'+k+'"'+(k === '7' ? ' selected' : '')+'>'+FRECUENCIAS[k]+'</option>'; }).join('')+
      '</select></div>'+
      '<div class="form-row"><label for="progQty-'+o.id+'">Cantidad ('+esc(p.unit)+')</label><input type="number" id="progQty-'+o.id+'" min="'+p.min+'" step="'+QTY_STEP+'" value="'+Math.max(o.qty, p.min)+'"></div>'+
      '<div class="form-row"><label for="progDesde-'+o.id+'">Primer pedido</label><input type="date" id="progDesde-'+o.id+'" min="'+fechaInput(Date.now())+'" value="'+fechaInput(manana)+'"></div>'+
    '</div>'+
    '<p class="prog-hint">Se usa el precio vigente del producto en cada fecha (hoy '+money(p.price)+' / '+esc(p.unit)+'). Mínimo '+p.min.toLocaleString('es-AR')+' '+esc(p.unit)+'.</p>'+
    '<div class="order-actions"><button class="btn btn-primary btn-sm" data-prog-crear="'+o.id+'">🗓 Programar</button><button class="btn btn-ghost btn-sm" data-prog-cerrar>Cancelar</button></div>'+
  '</div>';
}

function bindProgramados(main){
  main.querySelectorAll('[data-programar]').forEach(function(b){
    b.addEventListener('click', function(){ programarAbierto = programarAbierto === b.dataset.programar ? null : b.dataset.programar; renderMain(); });
  });
  main.querySelectorAll('[data-prog-cerrar]').forEach(function(b){
    b.addEventListener('click', function(){ programarAbierto = null; renderMain(); });
  });
  main.querySelectorAll('[data-prog-crear]').forEach(function(b){
    b.addEventListener('click', function(){
      const o = S.orders.find(function(x){ return x.id === b.dataset.progCrear; });
      const p = o ? lotById(o.lotId) : null;
      if(!p || p.archivado){ showToast('Ese producto ya no está publicado en el catálogo'); return; }
      const frec = parseInt(document.getElementById('progFrec-' + o.id).value, 10);
      const qty = parseFloat(document.getElementById('progQty-' + o.id).value);
      const desdeTxt = document.getElementById('progDesde-' + o.id).value;
      if(!(qty >= p.min)){ showToast('La cantidad mínima de ' + p.name + ' es ' + p.min.toLocaleString('es-AR') + ' ' + p.unit); return; }
      if(!desdeTxt){ showToast('Elegí la fecha del primer pedido'); return; }
      const partes = desdeTxt.split('-').map(Number);
      const desde = new Date(partes[0], partes[1] - 1, partes[2]).getTime();
      if(desde < inicioDelDia(Date.now())){ showToast('El primer pedido no puede ser en una fecha que ya pasó'); return; }
      b.disabled = true;
      guardar(db.collection('programados').add({
        mayoristaUid: currentUser.uid, mayoristaNombre: currentUser.entidad || currentUser.nombre,
        lotId: p.id, productorUid: p.productorUid, productorNombre: p.productorNombre,
        producto: p.name, unit: p.unit || 'kg', qty: qty, frecuencia: frec,
        proxima: desde, activo: true, generados: 0, creado: FieldValue.serverTimestamp()
      })).then(function(){
        registrar('Pedido programado', p.name + ' · ' + qty.toLocaleString('es-AR') + ' ' + p.unit + ' · ' + FRECUENCIAS[frec].toLowerCase() + ' desde el ' + fechaLarga(desde));
        programarAbierto = null;
        showToast('Listo: ' + p.name + ' se va a pedir solo ' + FRECUENCIAS[frec].toLowerCase() + ', desde el ' + fechaLarga(desde));
        renderMain();
        generarProgramados();
      }).catch(function(err){ showToast(errorFirestore(err, 'programar el pedido')); b.disabled = false; });
    });
  });
  main.querySelectorAll('[data-prog-pausar]').forEach(function(b){
    b.addEventListener('click', function(){
      guardar(db.collection('programados').doc(b.dataset.progPausar).update({ activo: false }))
        .then(function(){ showToast('Pedido programado en pausa'); })
        .catch(function(err){ showToast(errorFirestore(err, 'pausar el pedido programado')); });
    });
  });
  main.querySelectorAll('[data-prog-reanudar]').forEach(function(b){
    b.addEventListener('click', function(){
      const pr = S.programados.find(function(x){ return x.id === b.dataset.progReanudar; });
      if(!pr) return;
      // Si la fecha que tocaba ya pasó mientras estaba en pausa, se pasa a la siguiente.
      const proxima = pr.proxima >= inicioDelDia(Date.now()) ? pr.proxima : siguienteFecha(pr.proxima, pr.frecuencia);
      guardar(db.collection('programados').doc(pr.id).update({ activo: true, proxima: proxima }))
        .then(function(){ showToast('Pedido programado reanudado: el próximo es el ' + fechaLarga(proxima)); })
        .catch(function(err){ showToast(errorFirestore(err, 'reanudar el pedido programado')); });
    });
  });
  main.querySelectorAll('[data-prog-borrar]').forEach(function(b){
    b.addEventListener('click', function(){
      const pr = S.programados.find(function(x){ return x.id === b.dataset.progBorrar; });
      if(!pr || !window.confirm('¿Dejar de pedir ' + pr.producto + ' automáticamente? Los pedidos que ya se generaron no cambian.')) return;
      guardar(db.collection('programados').doc(pr.id).delete())
        .then(function(){ registrar('Pedido programado eliminado', pr.producto); showToast('Pedido programado eliminado'); })
        .catch(function(err){ showToast(errorFirestore(err, 'eliminar el pedido programado')); });
    });
  });
}

/* Genera los pedidos programados que ya vencieron. Corre al entrar y cada vez que cambian los datos. */
function generarProgramados(){
  if(!currentUser || currentUser.rol !== 'mayorista' || generandoProgramados || !navigator.onLine || !S.lots.length) return;
  const hoy = Date.now();
  const vencidos = S.programados.filter(function(pr){ return pr.activo && pr.proxima <= hoy; });
  if(!vencidos.length) return;
  generandoProgramados = true;
  const hechos = [], salteados = [];
  let cadena = Promise.resolve();
  vencidos.forEach(function(pr){
    cadena = cadena.then(function(){ return generarProgramado(pr); }).then(function(r){
      if(r && r.ok) hechos.push(r); else if(r) salteados.push(r);
    }).catch(function(err){ console.warn('[CitrusCode] No se pudo generar un pedido programado:', err.message); });
  });
  cadena.then(function(){
    generandoProgramados = false;
    if(hechos.length){
      showToast('🗓 Se generaron tus pedidos programados: ' + hechos.map(function(h){ return 'CC-' + h.numero + ' (' + h.producto + ')'; }).join(', '));
    } else if(salteados.length){
      showToast('🗓 No se pudo generar ' + salteados.map(function(h){ return h.producto + ': ' + h.motivo; }).join('; '));
    }
  });
}
function generarProgramado(pr){
  const ref = db.collection('programados').doc(pr.id);
  const p = lotById(pr.lotId);
  const motivo = (!p || p.archivado) ? 'el producto ya no está publicado' : (p.stock < pr.qty ? 'no había stock suficiente' : null);
  // La fecha se "toma" en una transacción: si CitrusCode está abierto en dos pestañas, el pedido se genera una sola vez.
  return db.runTransaction(function(tx){
    return tx.get(ref).then(function(s){
      if(!s.exists || !s.data().activo || s.data().proxima !== pr.proxima) return false;
      const cambios = { proxima: siguienteFecha(pr.proxima, pr.frecuencia) };
      if(motivo){ cambios.ultimoResultado = 'el ' + fechaLarga(pr.proxima) + ' no se generó: ' + motivo; }
      tx.update(ref, cambios);
      return true;
    });
  }).then(function(tomado){
    if(!tomado) return null;
    if(motivo) return { ok: false, producto: pr.producto, motivo: motivo };
    return nextOrderNumber().then(function(numero){
      return db.collection('pedidos').add({
        numero: numero, lotId: p.id, productorUid: p.productorUid,
        mayoristaUid: currentUser.uid, mayoristaNombre: currentUser.entidad || currentUser.nombre,
        qty: pr.qty, price: precioDe(p), unit: p.unit || 'kg', statusIdx: 0, traceIdx: -1, invoice: null,
        programadoId: pr.id,
        entrega: datosEntrega(),
        createdAt: FieldValue.serverTimestamp()
      }).then(function(){
        registrar('Pedido creado', 'CC-' + numero + ' · ' + pr.qty.toLocaleString('es-AR') + ' ' + (p.unit || 'kg') + ' de ' + p.name + ' a ' + p.productorNombre + ' · programado');
        return ref.update({ generados: (pr.generados || 0) + 1, ultimoResultado: 'pedido CC-' + numero + ' generado el ' + fechaLarga(Date.now()) });
      }).then(function(){ return { ok: true, numero: numero, producto: p.name }; });
    });
  });
}

    '<div class="rate-input" data-rate-order="'+o.id+'">'+botones+'</div>'+

      '<input type="text" class="rate-cmt" id="cmt-'+o.id+'" maxlength="300" placeholder="Comentario opcional (calidad de la fruta, puntualidad…)" value="'+esc(previa && previa.comentario ? previa.comentario : '')+'">'+
      (previa ? '<button class="btn btn-ghost btn-sm" data-save-cmt="'+o.id+'">Guardar comentario</button>' : '')+

}

function horaCorta(ts){
  const ms = msDe(ts);
  if(!ms) return '';
  const d = new Date(ms), hoy = new Date();
  return d.toDateString() === hoy.toDateString()
    ? d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' })
    : d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit' });
}
function inicialesDe(nombre){
  return String(nombre || '?').trim().split(/\s+/).slice(0, 2).map(function(w){ return w.charAt(0); }).join('').toUpperCase() || '?';
}
/* Avatar: la foto o logo de la cuenta si la subió; si no, sus iniciales. */
function avatarDe(u, nombre, clase){
  if(u && u.foto) return '<span class="'+clase+' av-foto"><img src="'+esc(u.foto)+'" alt=""></span>';
  return '<span class="'+clase+'">'+esc(inicialesDe(nombre))+'</span>';
}
/* Insignia azul de productor verificado por la administración. */
function insigniaVerif(u, grande){ return u && u.verificado ? '<span class="verif'+(grande ? ' verif-lg' : '')+'" title="Productor verificado por CitrusCode">✓</span>' : ''; }
function verifDeUid(uid){ return insigniaVerif(perfilDe(uid)); }
/* Coordenadas de un usuario: las exactas o, si no, la capital de su provincia. */
function coordsDe(u){
  if(u && typeof u.lat === 'number' && typeof u.lng === 'number') return [u.lat, u.lng];
  return u && COORDS_PROV[u.provincia] ? COORDS_PROV[u.provincia] : null;
}
function kmEntre(a, b){
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
  const h = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(a[0]*rad) * Math.cos(b[0]*rad) * Math.sin(dLng/2) * Math.sin(dLng/2);
  return 2 * R * Math.asin(Math.sqrt(h));
}

/* ---------- Ofertas por tiempo limitado ---------- */
function ofertaVigente(l){ return l && l.oferta && l.oferta.pct > 0 && l.oferta.hasta > Date.now() ? l.oferta : null; }
function precioDe(l){ const o = ofertaVigente(l); return o ? Math.round(l.price * (1 - o.pct / 100)) : l.price; }
function restanteTxt(ms){
  const m = Math.max(0, Math.round(ms / 60000));
  const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  return d ? d + 'd ' + h + 'h' : (h ? h + 'h ' + mm + 'm' : mm + 'm');
}
// Cuenta regresiva de las ofertas: se actualiza sola y, al vencer una, se redibuja la vista.
setInterval(function(){
  let vencio = false;
  document.querySelectorAll('[data-cuenta]').forEach(function(el){
    const falta = Number(el.dataset.cuenta) - Date.now();
    if(falta <= 0) vencio = true;
    else el.textContent = restanteTxt(falta);
  });
  if(vencio && currentUser) renderMain();
}, 30000);

/* ---------- Clima en la finca (Open-Meteo, gratis y sin clave) ---------- */
const climaCache = {};
const CLIMA_COD = [[0,'☀️','Despejado'],[2,'🌤️','Algo nublado'],[3,'☁️','Nublado'],[48,'🌫️','Niebla'],[57,'🌦️','Llovizna'],[67,'🌧️','Lluvia'],[77,'❄️','Nieve'],[82,'🌧️','Chaparrones'],[99,'⛈️','Tormenta']];
function climaDeCodigo(c){ for(let i = 0; i < CLIMA_COD.length; i++) if(c <= CLIMA_COD[i][0]) return CLIMA_COD[i]; return CLIMA_COD[CLIMA_COD.length - 1]; }
function climaHtml(d){
  if(!d) return '<p class="clima-aviso" style="color:var(--texto-suave);">No se pudo cargar el pronóstico.</p>';
  const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const avisos = [];
  const html = '<div class="clima">'+d.time.map(function(t, i){
    const f = new Date(t + 'T12:00:00');
    const c = climaDeCodigo(d.weathercode[i]);
    const min = Math.round(d.temperature_2m_min[i]), max = Math.round(d.temperature_2m_max[i]);
    const lluvia = d.precipitation_probability_max ? d.precipitation_probability_max[i] : null;
    const nombre = i === 0 ? 'Hoy' : dias[f.getDay()];
    if(min <= 2) avisos.push('🥶 Riesgo de helada ' + (i === 0 ? 'hoy' : 'el ' + nombre.toLowerCase()) + ' (' + min + ' °C).');
    if(lluvia >= 70) avisos.push('🌧️ Lluvia probable ' + (i === 0 ? 'hoy' : 'el ' + nombre.toLowerCase()) + ' (' + lluvia + ' %): conviene no cosechar.');
    return '<div class="clima-dia" title="'+c[2]+'">'+nombre+'<b>'+c[1]+'</b>'+max+'° / '+min+'°'+(lluvia != null ? '<small>💧 '+lluvia+'%</small>' : '')+'</div>';
  }).join('')+'</div>';
  return html + avisos.slice(0, 3).map(function(a){ return '<p class="clima-aviso">'+a+'</p>'; }).join('');
}
/* Completa los recuadros [data-clima="lat,lng"] que haya en la pantalla. */
function llenarClima(raiz){
  (raiz || document).querySelectorAll('[data-clima]').forEach(function(el){
    const clave = el.dataset.clima;
    const c = climaCache[clave];
    if(c && Date.now() - c.t < 30 * 60000){ el.innerHTML = climaHtml(c.d); return; }
    if(el.dataset.pidiendo) return;
    el.dataset.pidiendo = '1';
    const ll = clave.split(',');
    fetch('https://api.open-meteo.com/v1/forecast?latitude=' + ll[0] + '&longitude=' + ll[1] +
      '&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7')
      .then(function(r){ return r.json(); })
      .then(function(j){ climaCache[clave] = { t: Date.now(), d: j.daily || null }; })
      .catch(function(){ climaCache[clave] = { t: Date.now() - 25 * 60000, d: null }; })
      .then(function(){ document.querySelectorAll('[data-clima="'+clave+'"]').forEach(function(x){ x.innerHTML = climaHtml(climaCache[clave].d); }); });
  });
}
function cajaClima(coords){
  if(!coords) return '';
  const clave = coords[0].toFixed(2) + ',' + coords[1].toFixed(2);
  const c = climaCache[clave];
  return '<div data-clima="'+clave+'">'+(c ? climaHtml(c.d) : '<p class="clima-aviso" style="color:var(--texto-suave);">Cargando pronóstico…</p>')+'</div>';
}

/* ---------- Campanita de notificaciones ---------- */
function ofertasVistas(){ try { return JSON.parse(localStorage.getItem('cc-ofertas-vistas') || '{}'); } catch(_){ return {}; } }
function ofertasNuevas(){
  const vistas = ofertasVistas();
  return S.lots.filter(function(l){ const o = ofertaVigente(l); return o && !l.archivado && vistas[l.id] !== o.hasta; });
}
function itemsCampana(){
  if(!currentUser) return [];
  const r = currentUser.rol, it = [];
  const add = function(n, txt, vista){ if(n) it.push({ n: n, txt: txt, vista: vista }); };
  if(r !== 'admin'){
    add(chatsNoLeidos(), 'chat(s) con mensajes sin leer', 'chats');
    add(cotizacionesPorAtender().length, 'cotización(es) esperando respuesta', 'chats');
  }
  if(r === 'mayorista'){
    add(novedades().length, 'novedad(es) de productores que seguís', 'alertas');
    add(ofertasNuevas().length, 'oferta(s) por tiempo limitado en el catálogo', 'catalogo');
  } else if(r === 'productor'){
    add(S.orders.filter(function(o){ return o.statusIdx === 0 && !o.cancelado && !o.ocultoProductor && o.productorUid === currentUser.uid; }).length, 'pedido(s) esperando tu confirmación', 'recibidos');
    add(lotesStockBajo().length, 'publicación(es) con stock bajo', 'publicaciones');
  } else {
    add(S.denuncias.filter(function(d){ return d.estado === 'abierta'; }).length, 'denuncia(s) para revisar', 'moderacion');

   VISTA COMÚN — EVOLUCIÓN DE PRECIOS
   ============================================================ */
function graficoPrecios(pts, unidad){
  const W = 760, H = 270, pl = 70, pr = 20, pt = 20, pb = 40;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  let min = Math.min.apply(null, pts.map(function(p){ return p.precio; }));
  let max = Math.max.apply(null, pts.map(function(p){ return p.precio; }));
  if(min === max){ min = min * 0.9; max = max * 1.1; }
  const pad = (max - min) * 0.12; min = Math.max(0, min - pad); max = max + pad;
  const x = function(t){ return t1 === t0 ? pl + (W - pl - pr) / 2 : pl + (t - t0) / (t1 - t0) * (W - pl - pr); };
  const y = function(v){ return pt + (1 - (v - min) / (max - min)) * (H - pt - pb); };
  // Línea en escalera: el precio se mantiene hasta que cambia.
  let d = '';
  pts.forEach(function(p, i){
    if(i === 0){ d += 'M' + x(p.t).toFixed(1) + ' ' + y(p.precio).toFixed(1); return; }
    d += ' H' + x(p.t).toFixed(1) + ' V' + y(p.precio).toFixed(1);
  });
  const area = d + ' V' + (H - pb) + ' H' + x(pts[0].t).toFixed(1) + ' Z';
  let grid = '';
  for(let i = 0; i <= 4; i++){
    const v = min + (max - min) * i / 4;
    grid += '<line class="grid-l" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/>'+
      '<text class="eje" x="'+(pl-10)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end">'+money(v)+'</text>';
  }
  const fmt = function(t){ return new Date(t).toLocaleDateString('es-AR', { day:'2-digit', month:'short' }); };
  const ejeX = '<text class="eje" x="'+pl+'" y="'+(H-12)+'">'+fmt(t0)+'</text>'+
    '<text class="eje" x="'+(W-pr)+'" y="'+(H-12)+'" text-anchor="end">Hoy</text>';
  const puntos = pts.map(function(p){
    if(p.tipo === 'hoy') return '';
    const etiqueta = (p.tipo === 'pedido' ? 'Pedido #CC-' + p.numero : 'Precio publicado') + ' · ' + fmt(p.t) + ' · ' + money(p.precio) + ' / ' + unidad;
    return '<circle class="punto'+(p.tipo === 'pedido' ? ' pedido' : '')+'" cx="'+x(p.t).toFixed(1)+'" cy="'+y(p.precio).toFixed(1)+'" r="5"><title>'+esc(etiqueta)+'</title></circle>';
  }).join('');
  return '<svg class="precio-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de evolución del precio">'+
    '<defs><linearGradient id="gradPrecio" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#67B75A" stop-opacity=".35"/><stop offset="100%" stop-color="#67B75A" stop-opacity="0"/></linearGradient></defs>'+
    grid + '<path class="area" d="'+area+'" fill="url(#gradPrecio)"/>' + '<path class="linea" d="'+d+'"/>' + puntos + ejeX +
  '</svg>';
}
function sparkline(pts){
  if(pts.length < 2) return '';
  const W = 96, H = 28;
  const vals = pts.map(function(p){ return p.precio; });
  let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if(min === max){ min -= 1; max += 1; }
  const d = pts.map(function(p, i){
    return (i ? 'L' : 'M') + (i / (pts.length - 1) * (W - 4) + 2).toFixed(1) + ' ' + (H - 3 - (p.precio - min) / (max - min) * (H - 6)).toFixed(1);
  }).join(' ');
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><path d="'+d+'"/></svg>';
}

  const tabla = '<h3 style="font-size:1.05rem; margin:6px 0 14px;">Todos los productos</h3>'+

/* ============================================================
   CÓDIGO QR DE CADA LOTE Y ESCÁNER CON LA CÁMARA
   Cada pedido en camino tiene un QR real que apunta a
   https://citruscode.netlify.app/#qr=<id del pedido>. El productor lo
   imprime como etiqueta y, al escanearlo en el empaque o en el despacho,
   la trazabilidad avanza sola al paso siguiente. Si alguien lo escanea con
   la cámara común del celular, se abre el sistema en ese lote.
   ============================================================ */
const URL_SISTEMA = 'https://citruscode.netlify.app/';
// Cada librería tiene un CDN de respaldo por si el primero no responde.
const LIBS = {
  qr: ['https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js', 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'],
  jsqr: ['https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js', 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'],
  xlsx: ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js']
};
const scriptsCargando = {};
function cargarScript(urls){
  const clave = urls.join(' ');
  if(scriptsCargando[clave]) return scriptsCargando[clave];
  function probar(i){
    return new Promise(function(ok, mal){
      const el = document.createElement('script');
      el.src = urls[i];
      el.onload = function(){ ok(); };
      el.onerror = function(){ el.remove(); mal(); };
      document.head.appendChild(el);
    }).catch(function(){
      if(i + 1 < urls.length) return probar(i + 1);
      throw new Error('No se pudo cargar una librería (¿sin conexión?)');
    });
  }
  scriptsCargando[clave] = probar(0).catch(function(err){ delete scriptsCargando[clave]; throw err; });
  return scriptsCargando[clave];
}
function textoQR(o){ return URL_SISTEMA + '#qr=' + o.id; }
function svgQR(texto){
  const q = window.qrcode(0, 'M');
  q.addData(texto);
  q.make();
  return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
}
/* QR del lote. Si la librería todavía no cargó, se muestra el dibujo animado
   de siempre y se redibuja cuando llega. */
function qrHtml(o){
  if(window.qrcode){
    return '<div class="qr-real" title="QR del lote CC-'+o.numero+'">'+svgQR(textoQR(o))+'</div>';
  }
  cargarScript(LIBS.qr).then(function(){ renderMain(); }).catch(function(){});
  const celdas = Array.from({length:49}, function(_, i){
    const on = ((i*97+o.numero) % 100) < 45;
    return '<div style="opacity:'+(on?1:0)+'"></div>';
  }).join('');
  return '<div class="qr-mini">'+celdas+'</div>';
}
/* Saca el id del pedido de lo que leyó la cámara: la URL del QR, o un número CC-1234. */
function pedidoDeTextoQR(texto){
  const t = String(texto || '').trim();
  const m = t.match(/#qr=([A-Za-z0-9_-]+)/);
  if(m) return S.orders.find(function(o){ return o.id === m[1]; }) || { idDesconocido: m[1] };
  const n = t.match(/CC-?(\d+)/i);
  if(n) return S.orders.find(function(o){ return String(o.numero) === n[1]; }) || null;
  return null;
}
/* Avanza un paso la trazabilidad del pedido (lo usan el botón y el escáner). */
function avanzarTrazabilidad(o, via){
  const traceIdx = o.traceIdx + 1;
  const statusIdx = traceStatusIdx(traceIdx);
  const update = { traceIdx: traceIdx, statusIdx: statusIdx };
  if(statusIdx === 4 && !o.invoice){ update.invoice = genInvoice(o); }
  return guardar(db.collection('pedidos').doc(o.id).update(update)).then(function(){
    registrar(statusIdx === 4 ? 'Pedido entregado' : 'Trazabilidad avanzada',
      'CC-' + o.numero + ' · ' + TRACE_LABELS[traceIdx] + (via ? ' · ' + via : '') + (statusIdx === 4 ? ' · factura CAE ' + update.invoice.cae : ''));
    return { traceIdx: traceIdx, statusIdx: statusIdx };
  });
}
/* Qué pasa al leer un QR, según quién lo lee. Devuelve un mensaje para mostrar. */
function procesarQR(texto){
  const o = pedidoDeTextoQR(texto);
  if(!o) return Promise.resolve({ ok: false, msg: 'Este QR no es de un lote de CitrusCode.' });
  if(o.idDesconocido) return Promise.resolve({ ok: false, msg: 'No encontramos ese lote. Puede ser de otro productor o haberse borrado.' });
  const p = lotById(o.lotId);
  const nombre = 'Lote CC-' + o.numero + (p ? ' · ' + p.name : '');
  if(currentUser.rol !== 'productor' || o.productorUid !== currentUser.uid){
    return Promise.resolve({ ok: true, msg: nombre + ': ' + (o.cancelado ? 'pedido cancelado.' : (o.traceIdx >= 0 ? TRACE_LABELS[o.traceIdx] : STATUSES[o.statusIdx]) + '.'), ver: o });
  }
  if(o.cancelado) return Promise.resolve({ ok: false, msg: nombre + ': el pedido está cancelado.' });
  if(o.statusIdx === 0) return Promise.resolve({ ok: false, msg: nombre + ': primero confirmá el pedido en Pedidos recibidos.' });
  if(o.statusIdx >= 4) return Promise.resolve({ ok: true, msg: nombre + ': ya fue entregado. La trazabilidad está cerrada.' });
  return avanzarTrazabilidad(o, 'escaneo QR').then(function(r){
    return { ok: true, avanzo: true, msg: nombre + ' → ' + TRACE_LABELS[r.traceIdx] + (r.statusIdx === 4 ? '. Entregado y facturado.' : '.') };
  }).catch(function(err){ return { ok: false, msg: 'No se pudo actualizar: ' + err.message }; });
}

let escaner = null;   // { stream, timer, ultimo, ultimoMs }
function abrirEscaner(){
  cerrarEscaner();
  const caja = document.createElement('div');
  caja.className = 'qr-modal';
  caja.id = 'qrModal';
  caja.innerHTML =
    '<div class="qr-modal-card" role="dialog" aria-modal="true" aria-label="Escanear QR del lote">'+
      '<div class="qr-modal-head"><b>'+icono('qr')+' Escanear QR del lote</b><button type="button" class="qr-cerrar" id="qrCerrar" aria-label="Cerrar">✕</button></div>'+
      '<div class="qr-visor"><video id="qrVideo" playsinline muted></video><div class="qr-marco"></div></div>'+
      '<p class="qr-estado" id="qrEstado">Apuntá la cámara a la etiqueta del lote.</p>'+
      '<div class="qr-res" id="qrRes" hidden></div>'+
      '<label class="btn btn-ghost btn-sm qr-foto">📷 Sacar o elegir una foto del QR<input type="file" accept="image/*" capture="environment" id="qrFoto" hidden></label>'+
    '</div>';
  document.body.appendChild(caja);
  document.body.classList.add('modal-abierto');
  caja.addEventListener('click', function(e){ if(e.target === caja) cerrarEscaner(); });
  document.getElementById('qrCerrar').addEventListener('click', cerrarEscaner);
  document.getElementById('qrFoto').addEventListener('change', function(e){
    const f = e.target.files && e.target.files[0];
    if(f) leerFotoQR(f);
    e.target.value = '';
  });
  escaner = { stream: null, timer: null, ultimo: '', ultimoMs: 0 };
  const estado = document.getElementById('qrEstado');
  const lector = ('BarcodeDetector' in window)
    ? Promise.resolve(window.BarcodeDetector.getSupportedFormats ? window.BarcodeDetector.getSupportedFormats() : ['qr_code']).then(function(f){
        return f.indexOf('qr_code') >= 0 ? new window.BarcodeDetector({ formats: ['qr_code'] }) : null;
      }).catch(function(){ return null; })
    : Promise.resolve(null);
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    estado.textContent = 'Este navegador no deja usar la cámara en vivo. Sacale una foto al QR con el botón de abajo.';
    return;
  }
  Promise.all([
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }),
    lector,
    cargarScript(LIBS.jsqr).catch(function(){ return null; })
  ]).then(function(r){
    if(!escaner){ r[0].getTracks().forEach(function(t){ t.stop(); }); return; }
    escaner.stream = r[0];
    const detector = r[1];
    const video = document.getElementById('qrVideo');
    video.srcObject = r[0];
    video.play().catch(function(){});
    const lienzo = document.createElement('canvas');
    const ctx = lienzo.getContext('2d', { willReadFrequently: true });
    let ocupado = false;
    escaner.timer = setInterval(function(){
      if(ocupado || !escaner || video.readyState < 2) return;
      ocupado = true;
      leerCuadro(video, detector, lienzo, ctx).then(function(texto){
        ocupado = false;
        if(texto) alLeerQR(texto);
      }, function(){ ocupado = false; });
    }, 280);
  }).catch(function(err){
    estado.textContent = (err && err.name === 'NotAllowedError')
      ? 'No diste permiso para usar la cámara. Podés habilitarlo en los ajustes, o sacarle una foto al QR con el botón de abajo.'
      : 'No se pudo abrir la cámara. Sacale una foto al QR con el botón de abajo.';
  });
}
function leerCuadro(fuente, detector, lienzo, ctx){
  if(detector){
    return detector.detect(fuente).then(function(cod){ return cod && cod.length ? cod[0].rawValue : null; });
  }
  if(!window.jsQR) return Promise.resolve(null);
  const w = fuente.videoWidth || fuente.naturalWidth || fuente.width;
  const h = fuente.videoHeight || fuente.naturalHeight || fuente.height;
  if(!w || !h) return Promise.resolve(null);
  const escala = Math.min(1, 900 / Math.max(w, h));
  lienzo.width = Math.round(w * escala); lienzo.height = Math.round(h * escala);
  ctx.drawImage(fuente, 0, 0, lienzo.width, lienzo.height);
  const datos = ctx.getImageData(0, 0, lienzo.width, lienzo.height);
  const cod = window.jsQR(datos.data, datos.width, datos.height, { inversionAttempts: 'dontInvert' });
  return Promise.resolve(cod ? cod.data : null);
}
function leerFotoQR(archivo){
  const estado = document.getElementById('qrEstado');
  if(estado) estado.textContent = 'Leyendo la foto…';
  const url = URL.createObjectURL(archivo);
  const img = new Image();
  img.onload = function(){
    const lienzo = document.createElement('canvas');
    const ctx = lienzo.getContext('2d', { willReadFrequently: true });
    const detector = ('BarcodeDetector' in window) ? new window.BarcodeDetector({ formats: ['qr_code'] }) : null;
    cargarScript(LIBS.jsqr).catch(function(){}).then(function(){
      return leerCuadro(img, detector, lienzo, ctx).catch(function(){ return detector ? leerCuadro(img, null, lienzo, ctx) : null; });
    }).then(function(texto){
      URL.revokeObjectURL(url);
      if(texto) alLeerQR(texto);
      else if(estado) estado.textContent = 'No encontramos un QR en la foto. Probá más cerca y con buena luz.';
    });
  };
  img.onerror = function(){ URL.revokeObjectURL(url); if(estado) estado.textContent = 'No se pudo abrir la foto.'; };
  img.src = url;
}
function alLeerQR(texto){
  if(!escaner) return;
  const ahora = Date.now();
  // La cámara lee el mismo QR muchas veces por segundo: se procesa una vez cada 4 s.
  if(texto === escaner.ultimo && ahora - escaner.ultimoMs < 4000) return;
  escaner.ultimo = texto; escaner.ultimoMs = ahora;
  if(navigator.vibrate) navigator.vibrate(60);
  const res = document.getElementById('qrRes');
  const estado = document.getElementById('qrEstado');
  procesarQR(texto).then(function(r){
    if(!res) return;
    res.hidden = false;
    res.className = 'qr-res ' + (r.ok ? 'ok' : 'error');
    res.innerHTML = (r.ok ? '✓ ' : '⚠ ') + esc(r.msg) +
      (r.ver ? '<button type="button" class="btn btn-ghost btn-sm" id="qrVer">Ver trazabilidad</button>' : '');
    const ver = document.getElementById('qrVer');
    if(ver) ver.addEventListener('click', function(){ cerrarEscaner(); irATrazabilidad(r.ver); });
    if(estado) estado.textContent = r.avanzo ? 'Podés escanear el próximo lote.' : 'Apuntá la cámara a la etiqueta del lote.';
    if(r.avanzo) showToast(r.msg);
  });
}
function cerrarEscaner(){
  if(escaner){
    clearInterval(escaner.timer);
    if(escaner.stream) escaner.stream.getTracks().forEach(function(t){ t.stop(); });
    escaner = null;
  }
  const m = document.getElementById('qrModal');
  if(m) m.remove();
  document.body.classList.remove('modal-abierto');
}

/* Etiqueta en PDF para imprimir y pegar en los cajones o el pallet. Se arma
   como PDF (y no como ventana para imprimir) porque así funciona igual en el
   navegador, en la app de escritorio y en la de Android. */
function imprimirEtiqueta(o){
  if(typeof window.jspdf === 'undefined'){ showToast('No se pudo cargar el generador de PDF'); return; }
  cargarScript(LIBS.qr).then(function(){
    const p = lotById(o.lotId);
    const e = o.entrega || {};
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: [100, 150] });
    doc.setFillColor(18, 53, 36);
    doc.rect(0, 0, 100, 18, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
    doc.text('CitrusCode', 8, 11.5);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
    doc.text('Etiqueta de trazabilidad', 92, 11.5, { align: 'right' });
    doc.setTextColor(21, 32, 24);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(18);
    doc.text('Lote CC-' + o.numero, 50, 29, { align: 'center' });
    // El QR se dibuja módulo por módulo: queda nítido a cualquier tamaño de impresión.
    const q = window.qrcode(0, 'M');
    q.addData(textoQR(o)); q.make();
    const n = q.getModuleCount(), lado = 64, celda = lado / n, x0 = (100 - lado) / 2, y0 = 34;
    doc.setFillColor(0, 0, 0);
    for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(q.isDark(r, c)) doc.rect(x0 + c * celda, y0 + r * celda, celda + 0.02, celda + 0.02, 'F');
    let y = y0 + lado + 9;
    doc.setFontSize(11); doc.setFont('helvetica', 'bold');
    doc.text(doc.splitTextToSize((p ? p.name : 'Producto') + ' · ' + o.qty.toLocaleString('es-AR') + ' ' + unitOf(o), 84), 50, y, { align: 'center' });
    y += 7;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    const lineas = doc.splitTextToSize('Productor: ' + (p ? p.productorNombre : (currentUser.entidad || currentUser.nombre)), 84)
      .concat(doc.splitTextToSize('Destino: ' + (o.mayoristaNombre || '—') + (e.direccion ? ' · ' + e.direccion : ''), 84));
    doc.text(lineas, 50, y, { align: 'center' });
    doc.setTextColor(90, 110, 98); doc.setFontSize(7.5);
    doc.text('Escaneá este código en cada etapa para actualizar el envío.', 50, 143, { align: 'center' });
    doc.save('Etiqueta_CC-' + o.numero + '.pdf');
    registrar('Etiqueta QR generada', 'CC-' + o.numero);
  }).catch(function(err){ showToast(err.message); });
}

/* Flete estimado del carrito: distancia en ruta aproximada (línea recta × 1,3) por toneladas. */
function tarifaFlete(){ try { const t = Number(localStorage.getItem('cc-tarifa-flete')); return t > 0 ? t : 150; } catch(_){ return 150; } }
function cajaFlete(cartIds){
  const destino = coordsDe(currentUser);
  if(!destino) return '<div class="flete-box"><h5>🚚 Flete estimado</h5>Cargá tu dirección en Mi perfil para calcularlo.</div>';
  const tarifa = tarifaFlete();
  const porProd = {};
  cartIds.forEach(function(id){
    const p = lotById(id);
    const g = porProd[p.productorUid] || (porProd[p.productorUid] = { nombre: p.productorNombre, t: 0 });
    g.t += S.cart[id] / 1000;
  });
  let total = 0;
  const lineas = Object.keys(porProd).map(function(uid){
    const g = porProd[uid];
    const origen = coordsDe(perfilDe(uid));
    if(!origen) return '<div class="flete-linea"><span>'+esc(g.nombre)+'</span><span>sin ubicación</span></div>';
    const km = Math.max(5, Math.round(kmEntre(origen, destino) * 1.3));
    const costo = Math.round(km * Math.max(g.t, 1) * tarifa);
    total += costo;
    return '<div class="flete-linea"><span>'+esc(g.nombre)+' · '+km.toLocaleString('es-AR')+' km · '+g.t.toLocaleString('es-AR', { maximumFractionDigits: 1 })+' t</span><span>'+money(costo)+'</span></div>';
  }).join('');
  return '<div class="flete-box"><h5>🚚 Flete estimado</h5>'+lineas+
    '<div class="flete-total"><span>Total aproximado</span><span>'+money(total)+'</span></div>'+
    '<label class="flete-tarifa">Tarifa $ por tonelada y km <input type="number" min="1" step="1" id="fleteTarifa" value="'+tarifa+'"></label>'+
    '<small style="color:var(--texto-suave);">Es una referencia: se cobra mínimo 1 t por productor. Coordiná el precio final con el transportista.</small></div>';
}

  const hoy = new Date();
  const inicio = new Date(hoy.getFullYear(), hoy.getMonth(), 1).getTime();
  const diasMes = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0).getDate();
  const ventas = mios.filter(function(o){ return o.statusIdx >= 1 && msDe(o.createdAt) >= inicio; })
    .reduce(function(a, o){ return a + o.qty * o.price; }, 0);
  const meta = Number(currentUser.metaMensual) || 0;
  const pct = meta ? Math.round(ventas / meta * 100) : 0;
  const proyeccion = Math.round(ventas / hoy.getDate() * diasMes);
  const mes = hoy.toLocaleDateString('es-AR', { month: 'long' });
  return '<div class="meta-box" data-keep><h4>🎯 Meta de ventas de '+mes+'</h4>'+
    (meta
      ? '<div class="meta-fila"><b>'+money(ventas)+'</b> de '+money(meta)+' · '+pct+' %</div>'+
        '<div class="meta-barra"><span style="width:'+Math.min(100, pct)+'%;"></span></div>'+
        '<div class="meta-fila" style="color:var(--texto-suave);">'+(pct >= 100 ? '🎉 ¡Cumpliste la meta del mes!' : 'Al ritmo actual cerrás el mes en '+money(proyeccion)+' ('+Math.round(proyeccion / meta * 100)+' % de la meta).')+'</div>'
      : '<div class="meta-fila" style="color:var(--texto-suave);">Llevás '+money(ventas)+' vendidos este mes. Poné una meta para seguir tu avance.</div>')+
    '<div class="meta-fila" style="margin-top:10px;"><input type="number" min="0" step="1000" id="metaMonto" placeholder="Meta en $" value="'+(meta || '')+'"><button class="btn btn-ghost btn-sm" id="metaGuardar" type="button">Guardar meta</button></div>'+
    '<small style="color:var(--texto-suave);">Cuenta los pedidos confirmados del mes, sin los cancelados.</small>'+
  '</div>';
}

/* ============================================================
   FICHA PÚBLICA DEL PRODUCTOR
   ============================================================ */
function abrirFicha(uid){
  cerrarFicha();
  const u = perfilDe(uid);
  const rep = reputacion().porUid[uid];
  const nombre = u ? nombreContacto(u) : ((rep && rep.nombre) || 'Productor');
  const lugar = u ? [u.ciudad, u.provincia].filter(Boolean).join(', ') : '';
  const lotes = S.lots.filter(function(l){ return l.productorUid === uid && !l.archivado && l.stock > 0; });
  const certs = u && Array.isArray(u.certificaciones) ? u.certificaciones : [];
  const datos = [];
  if(u && u.hectareas) datos.push(Number(u.hectareas).toLocaleString('es-AR') + ' ha cultivadas');
  if(u && u.aniosRubro) datos.push(u.aniosRubro + ' años en el rubro');
  if(u && u.variedades) datos.push(u.variedades);
  const redes = [];
  if(u && u.instagram) redes.push('<a class="btn btn-ghost btn-sm" href="'+esc(linkInstagram(u.instagram))+'" target="_blank" rel="noopener">📸 @'+esc(u.instagram)+'</a>');
  if(u && u.whatsapp) redes.push('<a class="btn btn-ghost btn-sm" href="'+esc(linkWhatsapp(u.whatsapp))+'" target="_blank" rel="noopener">🟢 WhatsApp</a>');
  if(u && u.web && /^https?:\/\//i.test(u.web)) redes.push('<a class="btn btn-ghost btn-sm" href="'+esc(u.web)+'" target="_blank" rel="noopener">🌐 Sitio web</a>');
  const esYo = currentUser && uid === currentUser.uid;
  const tieneMapa = u && typeof u.lat === 'number' && typeof u.lng === 'number';

  const caja = document.createElement('div');
  caja.className = 'qr-modal';
  caja.id = 'fichaModal';
  caja.innerHTML =
    '<div class="qr-modal-card ficha-card" role="dialog" aria-modal="true" aria-label="Ficha de '+esc(nombre)+'">'+
      '<div class="qr-modal-head">'+
        '<div class="ficha-top">'+avatarDe(u, nombre, 'pf-avatar')+
          '<div><h3>'+esc(nombre)+' '+insigniaVerif(u, true)+'</h3>'+
            '<small>'+(u && u.entidad && u.nombre && u.entidad !== u.nombre ? esc(u.nombre)+' · ' : '')+(lugar ? '📍 '+esc(lugar) : 'Productor')+'</small>'+
            (rep && rep.n ? '<small>'+estrellas(rep.prom, 'sm')+' '+fmtProm(rep.prom)+' ('+rep.n+' opiniones)'+(rep.puesto ? ' · #'+rep.puesto+' del ranking' : '')+'</small>' : '<small>Todavía sin calificaciones</small>')+
          '</div>'+
        '</div>'+
        '<button type="button" class="qr-cerrar" id="fichaCerrar" aria-label="Cerrar">✕</button>'+
      '</div>'+
      (u && u.descripcion ? '<p class="ficha-desc">'+esc(u.descripcion)+'</p>' : (esYo ? '<p class="ficha-desc" style="color:var(--texto-suave);">Todavía no cargaste una descripción. Hacelo desde Mi perfil.</p>' : ''))+
      (datos.length || certs.length ? '<div class="ficha-chips">'+
        certs.map(function(c){ return '<span class="sello">✔ '+esc(c)+'</span>'; }).join('')+
        datos.map(function(d){ return '<span>'+esc(d)+'</span>'; }).join('')+
      '</div>' : '')+
      (redes.length ? '<div class="ficha-redes">'+redes.join('')+'</div>' : '')+
      '<div id="fichaGaleria"></div>'+
      (tieneMapa ? '<h4>Ubicación</h4><iframe class="ficha-mapa" loading="lazy" title="Ubicación de '+esc(nombre)+'" src="https://www.openstreetmap.org/export/embed.html?bbox='+(u.lng-0.06)+','+(u.lat-0.035)+','+(u.lng+0.06)+','+(u.lat+0.035)+'&layer=mapnik&marker='+u.lat+','+u.lng+'"></iframe>' : '')+
      (coordsDe(u) ? '<h4>Clima en la zona</h4>'+cajaClima(coordsDe(u)) : '')+
      '<h4>Publicaciones activas ('+lotes.length+')</h4>'+
      (lotes.length ? '<div class="ficha-lotes">'+lotes.slice(0, 8).map(function(l){
        return '<div><span>'+esc(l.name)+' <small>· '+esc(l.cat || '')+'</small></span><span>'+(ofertaVigente(l) ? '<span class="precio-lista">'+money(l.price)+'</span>' : '')+'<b>'+money(precioDe(l))+'</b> / '+esc(l.unit)+' <small>· stock '+l.stock.toLocaleString('es-AR')+'</small></span></div>';
      }).join('')+'</div>' : '<p style="font-size:.82rem; color:var(--texto-suave); margin:0;">No tiene productos publicados en este momento.</p>')+
      (currentUser && currentUser.rol === 'mayorista' ? '<div class="order-actions"><button type="button" class="btn btn-primary btn-sm" id="fichaContactar">💬 Contactar</button></div>' : '')+
    '</div>';
  document.body.appendChild(caja);
  document.body.classList.add('modal-abierto');
  caja.addEventListener('click', function(e){ if(e.target === caja) cerrarFicha(); });
  document.getElementById('fichaCerrar').addEventListener('click', cerrarFicha);
  llenarClima(caja);
  const contactar = document.getElementById('fichaContactar');
  if(contactar) contactar.addEventListener('click', function(){
    cerrarFicha();
    view[currentUser.rol] = 'chats';
    renderSubnav(); renderMain();
    abrirConversacion(uid);
  });
  cargarGaleria(uid).then(function(fotos){
    const g = document.getElementById('fichaGaleria');
    if(!g || !fotos.length) return;
    g.innerHTML = '<h4 style="margin-bottom:8px;">La finca</h4><div class="pf-galeria">'+fotos.map(function(f, i){
      return '<a class="gal-item" href="'+esc(f)+'" target="_blank" rel="noopener"><img src="'+esc(f)+'" alt="Foto '+(i+1)+' de '+esc(nombre)+'"></a>';
    }).join('')+'</div>';
  });
}
function cerrarFicha(){
  const m = document.getElementById('fichaModal');
  if(!m) return;
  m.remove();
  document.body.classList.remove('modal-abierto');
}
document.addEventListener('click', function(e){
  const b = e.target.closest && e.target.closest('[data-ficha]');
  if(!b || !currentUser) return;
  e.preventDefault(); e.stopPropagation();
  abrirFicha(b.dataset.ficha);
});
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') cerrarFicha(); });

      : '<span class="status-badge st-4">Activa</span>';

      ? (u.verificado

        : '<button class="btn btn-ghost btn-sm" data-verificar="'+u.uid+'" data-valor="1">✓ Verificar</button> ')

      ? '<button class="btn btn-ghost btn-sm" data-reactivar="'+u.uid+'">Reactivar</button>'
      : '<button class="btn btn-ghost btn-sm cancel-btn" data-suspender="'+u.uid+'">Suspender</button>'));
    return '<tr'+(u.suspendido ? ' class="fila-suspendida"' : '')+'>'+
      '<td>'+esc(u.nombre||'—')+insigniaVerif(u)+(u.suspendido && u.motivoSuspension ? '<div class="motivo-susp">'+esc(u.motivoSuspension)+'</div>' : '')+'</td>'+
      '<td><span class="status-badge '+(u.rol==='admin'?'st-2':(u.rol==='productor'?'st-4':'st-1'))+'">'+esc(u.rol)+'</span></td>'+
      '<td>'+esc(u.entidad||'—')+'</td>'+
      '<td>'+esc(u.email||'—')+'</td>'+
      '<td>'+esc(u.telefono||'—')+'</td>'+

  const suspendidas = usuarios.filter(function(u){ return u.suspendido; }).length;

    '<div class="tabla-scroll"><table class="simple"><tr><th>Nombre</th><th>Rol</th><th>Empresa / finca</th><th>Correo</th><th>Teléfono</th><th>Dirección</th><th>Cuenta</th><th></th></tr>'+rows+'</table></div>'+

        '<div class="order-meta" style="margin-bottom:8px;">'+o.qty.toLocaleString('es-AR')+' '+unitOf(o)+' · Productor: '+esc(p ? p.productorNombre : '—')+'</div>'+

          ? '<div class="order-meta" style="color:var(--acento); font-weight:600; margin-top:8px;">✓ Recibido — trazabilidad cerrada.</div>'

/* ============================================================
   VISTA PRODUCTOR — DASHBOARD DE GANANCIAS
   ============================================================ */
function viewProductorDashboard(){
  const mios = S.orders.filter(function(o){ return o.productorUid === currentUser.uid && !o.cancelado; });
  const entregados = mios.filter(function(o){ return o.statusIdx === 4; });
  const enCurso = mios.filter(function(o){ return o.statusIdx > 0 && o.statusIdx < 4; });
  const pendientes = mios.filter(function(o){ return o.statusIdx === 0; });
  const monto = function(list){ return list.reduce(function(a,o){ return a + o.qty*o.price; }, 0); };

  const cobrado = monto(entregados);
  const porCobrar = monto(enCurso);
  const potencial = monto(pendientes);
  const ticket = mios.length ? Math.round(monto(mios) / mios.length) : 0;

  const kpis = '<div class="kpi-grid">'+
    '<div class="kpi-card"><div class="kpi-label">Facturado (entregado)</div><div class="kpi-value">'+money(cobrado)+'</div><div class="kpi-sub">'+entregados.length+' pedido(s) completado(s)</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">Por cobrar (en curso)</div><div class="kpi-value">'+money(porCobrar)+'</div><div class="kpi-sub">'+enCurso.length+' en preparación o tránsito</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">A confirmar</div><div class="kpi-value">'+money(potencial)+'</div><div class="kpi-sub">'+pendientes.length+' esperando tu confirmación</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">Ticket promedio</div><div class="kpi-value">'+money(ticket)+'</div><div class="kpi-sub">sobre '+mios.length+' pedido(s)</div></div>'+
  '</div>' + bloqueMeta(mios);

  // Ingresos por producto
  const porProducto = {};
  mios.forEach(function(o){
    const p = lotById(o.lotId);
    const nombre = p ? p.name : '(producto eliminado)';
    if(!porProducto[nombre]) porProducto[nombre] = { total:0, qty:0, unit: unitOf(o) };
    porProducto[nombre].total += o.qty*o.price;
    porProducto[nombre].qty += o.qty;
  });
  const nombres = Object.keys(porProducto);
  const maxTotal = nombres.reduce(function(m,n){ return Math.max(m, porProducto[n].total); }, 0);

  let grafico;
  if(!nombres.length){
    grafico = '<div class="empty-state"><div class="ee-icon">📊</div>Todavía no recibiste pedidos.<br>Cuando lleguen, vas a ver acá cuánto genera cada producto.</div>';
  } else {
    const filas = nombres.map(function(n){
      const d = porProducto[n];
      const pct = maxTotal ? Math.round(d.total/maxTotal*100) : 0;
      return '<div class="rank-row">'+
        '<div class="rank-top"><span class="rank-name">'+esc(n)+'</span><span class="rank-val">'+money(d.total)+'</span></div>'+
        '<div class="rank-bar"><span style="width:'+pct+'%;"></span></div>'+
        '<div class="rank-sub">'+d.qty.toLocaleString('es-AR')+' '+d.unit+' vendidos</div>'+
      '</div>';
    }).join('');
    grafico = '<div class="chart-card"><h4>Ingresos por producto</h4>'+filas+'</div>';
  }

  return '<div class="panel">'+
    '<div class="panel-head"><h2>Mis ganancias</h2><p>Resumen económico de los pedidos que recibiste. Los montos excluyen los pedidos cancelados.</p></div>'+
    kpis + grafico +
  '</div>';
}

}

      '<div class="kpi-card"><div class="kpi-label">Pedidos activos</div><div class="kpi-value">'+(totalOrders-entregados)+'</div><div class="kpi-sub">'+(canceladosCount ? canceladosCount + ' cancelado(s) no incluido(s)' : 'en curso ahora mismo')+'</div></div>'+

      '<div class="kpi-card"><div class="kpi-label">Productores activos</div><div class="kpi-value">'+productores+'</div><div class="kpi-sub">publicando en el marketplace</div></div>'+

/* ============================================================
   VISTA ADMIN — REPORTES DE VENTAS
   Ventas por mes, por producto y por productor, con gráficos y
   descarga en Excel o PDF. Se calculan con los pedidos que ya están
   cargados en vivo, así que no hacen falta consultas aparte.
   ============================================================ */
let repPeriodo = '12m';      // '12m' | 'anio' | 'todo'
let repAlcance = 'activos';  // 'activos' (no cancelados) | 'entregados'
const MESES_CORTOS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function datosReporte(){
  const ahora = new Date();
  let desde = null;
  if(repPeriodo === '12m') desde = new Date(ahora.getFullYear(), ahora.getMonth() - 11, 1);
  else if(repPeriodo === 'anio') desde = new Date(ahora.getFullYear(), 0, 1);
  const pedidos = S.orders.filter(function(o){
    if(o.cancelado) return false;
    if(repAlcance === 'entregados' && o.statusIdx !== 4) return false;
    const ms = msDe(o.createdAt) || Date.now();   // recién creado: todavía sin hora del servidor
    return !desde || ms >= desde.getTime();
  });
  const filas = pedidos.map(function(o){
    const p = lotById(o.lotId);
    const u = S.users.find(function(x){ return x.uid === o.productorUid; });
    const ms = msDe(o.createdAt) || Date.now();
    return {
      numero: 'CC-' + o.numero, fecha: new Date(ms), ms: ms,
      producto: p ? p.name : 'Producto eliminado',
      productor: (p && p.productorNombre) || (u && (u.entidad || u.nombre)) || '—',
      mayorista: o.mayoristaNombre || '—',
      cantidad: o.qty, unidad: unitOf(o), precio: o.price, monto: o.qty * o.price,
      estado: STATUSES[o.statusIdx]
    };
  }).sort(function(a, b){ return a.ms - b.ms; });

  // Meses del período, incluidos los que no tuvieron ventas.
  const inicio = desde || (filas.length ? new Date(filas[0].fecha.getFullYear(), filas[0].fecha.getMonth(), 1) : new Date(ahora.getFullYear(), ahora.getMonth(), 1));
  const porMes = [];
  for(let d = new Date(inicio.getFullYear(), inicio.getMonth(), 1); d <= ahora; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)){
    porMes.push({ clave: d.getFullYear() + '-' + d.getMonth(), nombre: MESES_CORTOS[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2), monto: 0, pedidos: 0 });
  }
  const indiceMes = {};
  porMes.forEach(function(m, i){ indiceMes[m.clave] = i; });
  function agrupar(campo){
    const mapa = {};
    filas.forEach(function(f){
      const k = f[campo];
      if(!mapa[k]) mapa[k] = { nombre: k, monto: 0, pedidos: 0, cantidades: {} };
      mapa[k].monto += f.monto; mapa[k].pedidos++;
      mapa[k].cantidades[f.unidad] = (mapa[k].cantidades[f.unidad] || 0) + f.cantidad;
    });
    return Object.keys(mapa).map(function(k){ return mapa[k]; }).sort(function(a, b){ return b.monto - a.monto; });
  }
  filas.forEach(function(f){
    const i = indiceMes[f.fecha.getFullYear() + '-' + f.fecha.getMonth()];
    if(i !== undefined){ porMes[i].monto += f.monto; porMes[i].pedidos++; }
  });
  const total = filas.reduce(function(a, f){ return a + f.monto; }, 0);
  return {
    filas: filas, porMes: porMes, porProducto: agrupar('producto'), porProductor: agrupar('productor'),
    total: total, ticket: filas.length ? total / filas.length : 0,
    textoPeriodo: { '12m': 'Últimos 12 meses', anio: 'Año ' + ahora.getFullYear(), todo: 'Todo el historial' }[repPeriodo],
    textoAlcance: repAlcance === 'entregados' ? 'solo pedidos entregados' : 'pedidos no cancelados'
  };
}
function cantidadesTexto(c){
  return Object.keys(c).map(function(u){ return c[u].toLocaleString('es-AR') + ' ' + u; }).join(' + ');
}
/* Columnas verticales (ventas por mes). Una sola serie: el título la nombra. */
function graficoMeses(meses){
  const W = 760, H = 250, pl = 76, pr = 12, pt = 16, pb = 34;
  const max = Math.max.apply(null, meses.map(function(m){ return m.monto; }).concat([1]));
  const paso = (W - pl - pr) / Math.max(meses.length, 1);
  const ancho = Math.max(6, Math.min(40, paso - 8));
  const y = function(v){ return pt + (1 - v / max) * (H - pt - pb); };
  let grid = '';
  for(let i = 0; i <= 4; i++){
    const v = max * i / 4;
    grid += '<line class="grid-l" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/>'+
      '<text class="eje" x="'+(pl-10)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end">'+money(v)+'</text>';
  }
  const cada = Math.ceil(meses.length / 12);
  const barras = meses.map(function(m, i){
    const cx = pl + paso * i + paso / 2;
    const alto = Math.max(m.monto ? 3 : 0, (H - pt - pb) - (y(m.monto) - pt));
    const tip = m.nombre + ': ' + money(m.monto) + ' · ' + m.pedidos + (m.pedidos === 1 ? ' pedido' : ' pedidos');
    return '<g class="rep-barra"><title>'+esc(tip)+'</title>'+
      '<rect class="hit" x="'+(pl + paso * i).toFixed(1)+'" y="'+pt+'" width="'+paso.toFixed(1)+'" height="'+(H-pt-pb)+'"/>'+
      (alto ? '<rect class="col" x="'+(cx - ancho/2).toFixed(1)+'" y="'+(H - pb - alto).toFixed(1)+'" width="'+ancho.toFixed(1)+'" height="'+alto.toFixed(1)+'" rx="4"/>' : '')+
      (i % cada === 0 ? '<text class="eje" x="'+cx.toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle">'+m.nombre+'</text>' : '')+
    '</g>';
  }).join('');
  return '<svg class="rep-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ventas por mes">'+grid+
    '<line class="base-l" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/>'+barras+'</svg>';
}
/* Barras horizontales con el nombre arriba y el monto al final (ranking). */
function barrasRanking(lista){
  if(!lista.length) return '<div class="empty-state">Sin ventas en el período.</div>';
  const max = lista[0].monto || 1;
  const visibles = lista.slice(0, 8);
  const resto = lista.slice(8);
  const filas = visibles.slice();
  if(resto.length){
    const otros = { nombre: 'Otros (' + resto.length + ')', monto: 0, pedidos: 0, cantidades: {} };
    resto.forEach(function(r){ otros.monto += r.monto; otros.pedidos += r.pedidos; Object.keys(r.cantidades).forEach(function(u){ otros.cantidades[u] = (otros.cantidades[u] || 0) + r.cantidades[u]; }); });
    filas.push(otros);
  }
  return '<div class="rep-ranking">'+filas.map(function(f){
    const pct = Math.max(1.5, f.monto / max * 100);
    return '<div class="rep-fila" title="'+esc(f.nombre+': '+money(f.monto)+' · '+f.pedidos+' pedido(s) · '+cantidadesTexto(f.cantidades))+'">'+
      '<div class="rep-fila-top"><span>'+esc(f.nombre)+'</span><b>'+money(f.monto)+'</b></div>'+
      '<div class="rep-pista"><div class="rep-valor" style="width:'+pct.toFixed(1)+'%"></div></div>'+
      '<div class="rep-sub">'+f.pedidos+(f.pedidos === 1 ? ' pedido' : ' pedidos')+' · '+cantidadesTexto(f.cantidades)+'</div>'+
    '</div>';
  }).join('')+'</div>';
}
function viewAdminReportes(){
  const r = datosReporte();
  const opc = function(v, actual, txt){ return '<option value="'+v+'"'+(v === actual ? ' selected' : '')+'>'+txt+'</option>'; };
  const mejorMes = r.porMes.reduce(function(a, m){ return m.monto > (a ? a.monto : 0) ? m : a; }, null);
  const tablaMeses = r.porMes.slice().reverse().map(function(m){
    return '<tr><td>'+m.nombre+'</td><td>'+m.pedidos+'</td><td>'+money(m.monto)+'</td></tr>';
  }).join('');
  return '<div class="panel">'+
    '<div class="panel-head split"><div><h2>Reportes de ventas</h2><p>Ventas del marketplace por mes, por producto y por productor. Descargalos en Excel o PDF para presentarlos.</p></div>'+
      '<div class="rep-acciones"><button class="btn btn-ghost btn-sm" id="repExcel">'+icono('descargar')+'Excel</button><button class="btn btn-primary btn-sm" id="repPdf">'+icono('descargar')+'PDF</button></div></div>'+
    '<div class="rep-filtros">'+
      '<label>Período<select id="repPeriodo">'+opc('12m', repPeriodo, 'Últimos 12 meses')+opc('anio', repPeriodo, 'Este año')+opc('todo', repPeriodo, 'Todo el historial')+'</select></label>'+
      '<label>Pedidos<select id="repAlcance">'+opc('activos', repAlcance, 'Todos los no cancelados')+opc('entregados', repAlcance, 'Solo entregados')+'</select></label>'+
    '</div>'+
    '<div class="kpi-grid">'+
      '<div class="kpi-card"><div class="kpi-label">Ventas del período</div><div class="kpi-value">'+money(r.total)+'</div><div class="kpi-sub">'+r.filas.length+' pedidos</div></div>'+
      '<div class="kpi-card"><div class="kpi-label">Ticket promedio</div><div class="kpi-value">'+money(r.ticket)+'</div><div class="kpi-sub">por pedido</div></div>'+
      '<div class="kpi-card"><div class="kpi-label">Mejor mes</div><div class="kpi-value">'+(mejorMes ? mejorMes.nombre : '—')+'</div><div class="kpi-sub">'+(mejorMes ? money(mejorMes.monto) : 'sin ventas')+'</div></div>'+
      '<div class="kpi-card"><div class="kpi-label">Productor líder</div><div class="kpi-value rep-kpi-texto">'+esc(r.porProductor.length ? r.porProductor[0].nombre : '—')+'</div><div class="kpi-sub">'+(r.porProductor.length ? money(r.porProductor[0].monto) : 'sin ventas')+'</div></div>'+
    '</div>'+
    '<div class="chart-card"><h4>Ventas por mes</h4>'+(r.filas.length ? graficoMeses(r.porMes) : '<div class="empty-state">No hay ventas en el período elegido.</div>')+
      '<details class="rep-tabla"><summary>Ver tabla</summary><table class="simple"><tr><th>Mes</th><th>Pedidos</th><th>Ventas</th></tr>'+tablaMeses+'</table></details></div>'+
    '<div class="rep-dos">'+
      '<div class="chart-card"><h4>Ventas por producto</h4>'+barrasRanking(r.porProducto)+'</div>'+
      '<div class="chart-card"><h4>Ventas por productor</h4>'+barrasRanking(r.porProductor)+'</div>'+
    '</div>'+
  '</div>';
}
function bindReportes(main){
  const per = main.querySelector('#repPeriodo');
  if(!per) return;
  per.addEventListener('change', function(){ repPeriodo = per.value; renderMain(); });
  const alc = main.querySelector('#repAlcance');
  alc.addEventListener('change', function(){ repAlcance = alc.value; renderMain(); });
  main.querySelector('#repExcel').addEventListener('click', function(e){ reporteExcel(e.currentTarget); });
  main.querySelector('#repPdf').addEventListener('click', reportePdf);
}
function nombreReporte(ext){ return 'CitrusCode_Reporte_ventas_' + new Date().toISOString().slice(0, 10) + '.' + ext; }
function reporteExcel(boton){
  boton.disabled = true;
  cargarScript(LIBS.xlsx).then(function(){
    const r = datosReporte();
    const X = window.XLSX;
    const libro = X.utils.book_new();
    const hoja = function(nombre, filas, anchos){
      const h = X.utils.aoa_to_sheet(filas);
      h['!cols'] = anchos.map(function(w){ return { wch: w }; });
      X.utils.book_append_sheet(libro, h, nombre);
    };
    hoja('Resumen', [
      ['CitrusCode — Reporte de ventas'], [],
      ['Período', r.textoPeriodo], ['Incluye', r.textoAlcance], ['Generado', new Date().toLocaleString('es-AR')], [],
      ['Ventas totales ($)', r.total], ['Pedidos', r.filas.length], ['Ticket promedio ($)', Math.round(r.ticket)]
    ], [24, 30]);
    hoja('Por mes', [['Mes', 'Pedidos', 'Ventas ($)']].concat(r.porMes.map(function(m){ return [m.nombre, m.pedidos, m.monto]; })), [12, 10, 16]);
    hoja('Por producto', [['Producto', 'Pedidos', 'Cantidad', 'Ventas ($)']].concat(r.porProducto.map(function(f){ return [f.nombre, f.pedidos, cantidadesTexto(f.cantidades), f.monto]; })), [30, 10, 20, 16]);
    hoja('Por productor', [['Productor', 'Pedidos', 'Cantidad', 'Ventas ($)']].concat(r.porProductor.map(function(f){ return [f.nombre, f.pedidos, cantidadesTexto(f.cantidades), f.monto]; })), [30, 10, 20, 16]);
    hoja('Detalle', [['Pedido', 'Fecha', 'Producto', 'Productor', 'Mayorista', 'Cantidad', 'Unidad', 'Precio unitario ($)', 'Monto ($)', 'Estado']].concat(r.filas.map(function(f){
      return [f.numero, f.fecha, f.producto, f.productor, f.mayorista, f.cantidad, f.unidad, f.precio, f.monto, f.estado];
    })), [10, 12, 26, 26, 26, 10, 8, 16, 14, 14]);
    // Se arma en memoria y se descarga como enlace, igual que los PDF (así anda también en las apps).
    const datos = X.write(libro, { bookType: 'xlsx', type: 'array', cellDates: true });
    const blob = new Blob([datos], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nombreReporte('xlsx');
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    registrar('Reporte descargado', 'Excel · ' + r.textoPeriodo);
    showToast('Reporte en Excel descargado');
  }).catch(function(err){ showToast(err.message); }).finally(function(){ boton.disabled = false; });
}
function reportePdf(){
  if(typeof window.jspdf === 'undefined'){ showToast('No se pudo cargar el generador de PDF'); return; }
  const r = datosReporte();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const pesos = function(v){ return '$ ' + Math.round(v).toLocaleString('es-AR'); };
  doc.setFillColor(18, 53, 36); doc.rect(0, 0, 210, 30, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.text('CitrusCode', 15, 17);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.text('Reporte de ventas · ' + r.textoPeriodo + ' · ' + r.textoAlcance, 15, 24);
  doc.setTextColor(21, 32, 24);
  let y = 42;
  // Resumen en tres recuadros.
  [['Ventas', pesos(r.total)], ['Pedidos', String(r.filas.length)], ['Ticket promedio', pesos(r.ticket)]].forEach(function(k, i){
    const x = 15 + i * 61;
    doc.setDrawColor(228, 225, 213); doc.setFillColor(250, 248, 238); doc.roundedRect(x, y, 57, 20, 3, 3, 'FD');
    doc.setFontSize(8); doc.setFont('helvetica', 'normal'); doc.setTextColor(90, 110, 98); doc.text(k[0].toUpperCase(), x + 4, y + 7);
    doc.setFontSize(13); doc.setFont('helvetica', 'bold'); doc.setTextColor(21, 32, 24); doc.text(k[1], x + 4, y + 15);
  });
  y += 30;
  function titulo(t){
    if(y > 260){ doc.addPage(); y = 20; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(21, 32, 24); doc.text(t, 15, y); y += 7;
  }
  // Ventas por mes: columnas.
  titulo('Ventas por mes');
  const maxMes = Math.max.apply(null, r.porMes.map(function(m){ return m.monto; }).concat([1]));
  const altoG = 46, anchoG = 180, paso = anchoG / Math.max(r.porMes.length, 1), cada = Math.ceil(r.porMes.length / 12);
  doc.setDrawColor(228, 225, 213); doc.line(15, y + altoG, 15 + anchoG, y + altoG);
  r.porMes.forEach(function(m, i){
    const h = m.monto / maxMes * (altoG - 6);
    const x = 15 + paso * i + paso * 0.18;
    if(h > 0){ doc.setFillColor(46, 125, 62); doc.rect(x, y + altoG - h, paso * 0.64, h, 'F'); }
    if(i % cada === 0){ doc.setFontSize(6.5); doc.setFont('helvetica', 'normal'); doc.setTextColor(90, 110, 98); doc.text(m.nombre, x + paso * 0.32, y + altoG + 4, { align: 'center' }); }
  });
  doc.setFontSize(7); doc.setTextColor(90, 110, 98); doc.text('Máximo: ' + pesos(maxMes), 15 + anchoG, y - 1, { align: 'right' });
  y += altoG + 12;
  function tabla(encabezado, filas, anchos){
    const fila = function(celdas, negrita){
      if(y > 280){ doc.addPage(); y = 20; }
      doc.setFont('helvetica', negrita ? 'bold' : 'normal'); doc.setFontSize(8.5); doc.setTextColor(21, 32, 24);
      let x = 15;
      celdas.forEach(function(c, i){
        const txt = doc.splitTextToSize(String(c), anchos[i] - 2)[0];
        if(i === celdas.length - 1) doc.text(txt, x + anchos[i] - 2, y, { align: 'right' });
        else doc.text(txt, x, y);
        x += anchos[i];
      });
      y += 5.5;
      doc.setDrawColor(236, 233, 222); doc.line(15, y - 3.6, 195, y - 3.6);
    };
    fila(encabezado, true);
    filas.forEach(function(f){ fila(f, false); });
    y += 6;
  }
  titulo('Por producto');
  tabla(['Producto', 'Pedidos', 'Cantidad', 'Ventas'], r.porProducto.map(function(f){ return [f.nombre, f.pedidos, cantidadesTexto(f.cantidades), pesos(f.monto)]; }), [70, 20, 50, 40]);
  titulo('Por productor');
  tabla(['Productor', 'Pedidos', 'Cantidad', 'Ventas'], r.porProductor.map(function(f){ return [f.nombre, f.pedidos, cantidadesTexto(f.cantidades), pesos(f.monto)]; }), [70, 20, 50, 40]);
  titulo('Por mes');
  tabla(['Mes', 'Pedidos', '', 'Ventas'], r.porMes.map(function(m){ return [m.nombre, m.pedidos, '', pesos(m.monto)]; }), [70, 20, 50, 40]);
  const paginas = doc.getNumberOfPages();
  for(let i = 1; i <= paginas; i++){
    doc.setPage(i); doc.setFontSize(7.5); doc.setTextColor(120, 130, 120);

/* ============================================================
   BITÁCORA DE ACTIVIDAD (auditoría para la administración)
   Cada acción importante deja un registro con quién, qué y cuándo. La fecha
   la pone el servidor y las reglas impiden editar o borrar registros.
   ============================================================ */
function registrar(accion, detalle, quien){
  const u = quien || currentUser;
  if(!u || !u.uid) return;
  db.collection('bitacora').add({
    uid: u.uid,
    nombre: u.entidad || u.nombre || '',
    rol: u.rol,
    accion: String(accion).slice(0, 60),
    detalle: String(detalle || '').slice(0, 300),
    fecha: FieldValue.serverTimestamp()
  }).catch(function(err){ console.warn('[CitrusCode] Bitácora no disponible:', err.message); });
}
let bitFiltro = { rol: 'todos', accion: 'todas', q: '' };
let bitacoraDisponible = true;
function fechaHora(ts){
  const ms = msDe(ts);
  if(!ms) return '—';
  return new Date(ms).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

  if(bitFiltro.accion !== 'todas' && acciones.indexOf(bitFiltro.accion) === -1) bitFiltro.accion = 'todas';
  const q = sinAcentos(bitFiltro.q.trim());

    if(bitFiltro.rol !== 'todos' && b.rol !== bitFiltro.rol) return false;

  const activosHoy = new Set(deHoy.map(function(b){ return b.uid; })).size;
  const porAccion = {};

  let html = '<div class="panel"><div class="panel-head split"><div><h2>Bitácora de actividad</h2>'+
    '<p>Registro de auditoría de las acciones del marketplace: quién hizo qué y cuándo. La fecha la asigna el servidor y los registros no se pueden editar ni borrar.</p></div>'+
