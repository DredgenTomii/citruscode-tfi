/* ============================================================
   EVENTOS DE LA APP (delegados en #main)
   ============================================================ */
function bindMainEvents(){
  const main = document.getElementById('main');

  main.querySelectorAll('.filter-btn').forEach(function(b){
    b.addEventListener('click', function(){ catFilter = b.dataset.cat; renderMain(); });
  });

  // Filtros del catálogo: al cambiar de productor se reinicia el producto, porque la lista depende de él.
  const fltProductor = document.getElementById('fltProductor');
  if(fltProductor) fltProductor.addEventListener('change', function(){ prodFilter = fltProductor.value; itemFilter = 'todos'; renderMain(); });
  const fltProducto = document.getElementById('fltProducto');
  if(fltProducto) fltProducto.addEventListener('change', function(){ itemFilter = fltProducto.value; renderMain(); });
  const fltLimpiar = document.getElementById('fltLimpiar');
  if(fltLimpiar) fltLimpiar.addEventListener('click', function(){ prodFilter = 'todos'; itemFilter = 'todos'; catBusqueda = ''; renderMain(); });
  const catBuscar = document.getElementById('catBuscar');
  if(catBuscar){
    catBuscar.addEventListener('input', function(){ catBusqueda = catBuscar.value; renderMain(); });
    catBuscar.addEventListener('keydown', function(e){ if(e.key === 'Escape' && catBuscar.value){ catBusqueda = ''; renderMain(); } });
  }
  const catOrdenSel = document.getElementById('catOrden');
  if(catOrdenSel) catOrdenSel.addEventListener('change', function(){ catOrden = catOrdenSel.value; renderMain(); });
  const cartFab = document.getElementById('cartFab');
  if(cartFab) cartFab.addEventListener('click', function(){
    const box = document.getElementById('cartBox');
    if(box) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  // Repetir un pedido anterior: se carga al carrito con la misma cantidad (si hay stock).
  main.querySelectorAll('[data-repeat-order]').forEach(function(b){
    b.addEventListener('click', function(){
      const o = S.orders.find(function(x){ return x.id === b.dataset.repeatOrder; });
      const p = o ? lotById(o.lotId) : null;
      if(!p || p.archivado){ showToast('Ese producto ya no está publicado en el catálogo'); return; }
      if(p.stock < p.min){ showToast('Ahora no hay stock suficiente de ' + p.name + ' (mínimo ' + p.min.toLocaleString('es-AR') + ' ' + p.unit + ')'); return; }
      const cant = Math.max(p.min, Math.min(o.qty, p.stock));
      S.cart[p.id] = cant;
      view.mayorista = 'catalogo';
      renderSubnav(); renderMain();
      showToast(cant < o.qty
        ? 'Agregado al pedido: ' + cant.toLocaleString('es-AR') + ' ' + p.unit + ' de ' + p.name + ' (todo el stock disponible)'
        : 'Agregado al pedido: ' + cant.toLocaleString('es-AR') + ' ' + p.unit + ' de ' + p.name);
      setTimeout(function(){ const box = document.getElementById('cartBox'); if(box) box.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 450);
    });
  });
  main.querySelectorAll('[data-chat]').forEach(function(b){
    b.addEventListener('click', function(){ abrirChat(b.dataset.chat); });
  });
  main.querySelectorAll('[data-chat-form]').forEach(function(f){
    f.addEventListener('submit', function(e){
      e.preventDefault();
      enviarMensaje(f.dataset.chatForm, f.querySelector('input'));
    });
  });
  main.querySelectorAll('[data-map]').forEach(function(b){
    b.addEventListener('click', function(){
      const otro = mapaAbierto !== b.dataset.map;
      liberarMapa();
      if(otro) mapaAbierto = b.dataset.map;
      renderMain();
      if(mapaAbierto){ const m = document.getElementById('mapa-' + mapaAbierto); if(m) m.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    });
  });
  // Foto propia al publicar: se muestra la vista previa sin redibujar el formulario
  // (así no se pierde lo que el productor ya escribió).
  const fotoInputNuevo = document.getElementById('fotoInputNuevo');
  if(fotoInputNuevo){
    fotoInputNuevo.addEventListener('change', function(){
      const file = fotoInputNuevo.files && fotoInputNuevo.files[0];
      if(!file) return;
      procesarFoto(file).then(function(data){
        fotoNueva = data;
        document.getElementById('fotoNuevaPrev').innerHTML = '<img src="'+data+'" alt="Foto elegida">';
        document.getElementById('fotoNuevaTxt').textContent = 'Se va a publicar con esta foto (' + Math.round(data.length * 0.75 / 1024) + ' KB).';
      }).catch(function(err){ showToast(err.message); });
    });
  }
  const quitarFotoNueva = document.getElementById('quitarFotoNueva');
  if(quitarFotoNueva) quitarFotoNueva.addEventListener('click', function(){
    fotoNueva = null;
    document.getElementById('fotoNuevaPrev').innerHTML = '<span style="font-size:1.8rem;">✨</span>';
    document.getElementById('fotoNuevaTxt').textContent = 'Si no subís una foto, se genera una automáticamente con inteligencia artificial.';
    quitarFotoNueva.remove();
  });
  // Foto propia en una publicación existente: se guarda directamente.
  main.querySelectorAll('[data-subir-foto]').forEach(function(inp){
    inp.addEventListener('change', function(){
      const file = inp.files && inp.files[0];
      if(!file) return;
      showToast('Subiendo la foto…');
      procesarFoto(file).then(function(data){
        return db.collection('lotes').doc(inp.dataset.subirFoto).update({ fotoPropia: data });
      }).then(function(){
        showToast('Foto actualizada: los mayoristas ya la ven en el catálogo');
      }).catch(function(err){
        showToast(err.code === 'permission-denied' ? 'Firestore rechazó el cambio por permisos.' : err.message);
      });
    });
  });
  main.querySelectorAll('[data-usar-ia]').forEach(function(b){
    b.addEventListener('click', function(){
      b.disabled = true;
      db.collection('lotes').doc(b.dataset.usarIa).update({ fotoPropia: FieldValue.delete() })
        .then(function(){ showToast('Volviste a la foto generada con IA'); })
        .catch(function(err){ showToast('No se pudo cambiar la foto: ' + err.message); b.disabled = false; });
    });
  });

  main.querySelectorAll('[data-regen-foto]').forEach(function(b){
    b.addEventListener('click', function(){
      const l = lotById(b.dataset.regenFoto);
      if(!l) return;
      b.disabled = true;
      const nueva = urlFotoIA(l.name, l.cat, Math.floor(Math.random() * 1000000));
      db.collection('lotes').doc(l.id).update({ imagenUrl: nueva }).then(function(){
        new Image().src = nueva;
        showToast('Generando una foto nueva… puede tardar unos segundos');
      }).catch(function(err){ showToast('No se pudo cambiar la foto: ' + err.message); b.disabled = false; });
    });
  });
  const precioLote = document.getElementById('precioLote');
  if(precioLote) precioLote.addEventListener('change', function(){ precioSel = precioLote.value; renderMain(); });
  main.querySelectorAll('[data-precio-ver]').forEach(function(tr){
    tr.addEventListener('click', function(){ precioSel = tr.dataset.precioVer; renderMain(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  });

  main.querySelectorAll('.rate-input button').forEach(function(b){
    b.addEventListener('click', function(){
      const caja = b.closest('.rate-input');
      guardarCalificacion(caja.dataset.rateOrder, parseInt(b.dataset.val, 10), caja);
    });
  });
  main.querySelectorAll('[data-save-cmt]').forEach(function(b){
    b.addEventListener('click', function(){
      const previa = S.ratings.find(function(r){ return r.id === b.dataset.saveCmt; });
      if(previa) guardarCalificacion(b.dataset.saveCmt, parseInt(previa.estrellas, 10), null);
    });
  });
  main.querySelectorAll('[data-export]').forEach(function(b){
    b.addEventListener('click', function(){ exportarTablaCSV(b, b.dataset.export); });
  });

  main.querySelectorAll('.qty-plus, .qty-minus, .add-btn').forEach(function(b){
    b.addEventListener('click', function(){
      const id = b.dataset.id;
      const p = lotById(id);
      const input = main.querySelector('.qty-input[data-id="'+id+'"]');
      if(b.classList.contains('qty-plus')){
        const nuevo = parseInt(input.value) + QTY_STEP;
        input.value = Math.min(nuevo, p.stock);
        if(nuevo > p.stock) showToast('No hay más stock disponible de ' + p.name);
        previsualizarStock(id);
      } else if(b.classList.contains('qty-minus')){
        const v = parseInt(input.value) - QTY_STEP;
        input.value = v >= p.min ? v : p.min;
        previsualizarStock(id);
      } else {
        S.cart[id] = parseInt(input.value);
        b.textContent = 'Agregado ✓';
        b.classList.add('added');
        volarAlCarrito(b);
        showToast(p.name + ' agregado al pedido');
        setTimeout(function(){ renderMain(); }, 500);
      }
    });
  });

  main.querySelectorAll('[data-remove]').forEach(function(b){
    b.addEventListener('click', function(){ delete S.cart[b.dataset.remove]; renderMain(); });
  });

  const placeBtn = document.getElementById('placeOrderBtn');
  if(placeBtn){
    placeBtn.addEventListener('click', function(){
      placeBtn.disabled = true;
      placeBtn.textContent = 'Enviando pedido…';
      const ids = Object.keys(S.cart).filter(function(id){ return lotById(id); });
      let chain = Promise.resolve();
      ids.forEach(function(id){
        chain = chain.then(function(){
          const p = lotById(id);
          return nextOrderNumber().then(function(numero){
            return db.collection('pedidos').add({
              numero: numero, lotId: p.id,
              productorUid: p.productorUid,
              mayoristaUid: currentUser.uid, mayoristaNombre: currentUser.entidad || currentUser.nombre,
              qty: S.cart[id], price: p.price, unit: p.unit || 'kg', statusIdx:0, traceIdx:-1, invoice:null,
              entrega: {
                contacto: currentUser.nombre || '',
                telefono: currentUser.telefono || '',
                dni: currentUser.dni || '',
                direccion: direccionDe(currentUser) || ''
              },
              createdAt: FieldValue.serverTimestamp()
            });
          });
        });
      });
      chain.then(function(){
        S.cart = {};
        view.mayorista = 'pedidos';
        showToast('Pedido mayorista enviado a los productores');
        renderSubnav(); renderMain();
      }).catch(function(err){
        showToast('No se pudo enviar el pedido: ' + err.message);
        placeBtn.disabled = false; placeBtn.textContent = 'Solicitar pedido mayorista';
      });
    });
  }

  const addLotBtn = document.getElementById('addLotBtn');
  if(addLotBtn){
    addLotBtn.addEventListener('click', function(){
      const name = document.getElementById('newLotName').value.trim();
      const cat = document.getElementById('newLotCat').value;
      const unit = document.getElementById('newLotUnit').value;
      const price = parseFloat(document.getElementById('newLotPrice').value);
      const stock = parseFloat(document.getElementById('newLotStock').value);
      const minInput = parseFloat(document.getElementById('newLotMin').value);
      if(!name || !price || !stock){ showToast('Completá todos los campos para publicar'); return; }
      const min = (minInput && minInput > 0) ? Math.min(minInput, stock) : Math.min(300, stock);
      const palette = {limon:'#E8C547', naranja:'#F0A03C', mandarina:'#F5B25C', pomelo:'#E88C86', subproductos:'#B7C93C'};
      addLotBtn.disabled = true;
      db.collection('lotes').add({
        name: name, productorUid: currentUser.uid, productorNombre: currentUser.entidad || currentUser.nombre,
        cat: cat, price: price, unit: unit, stock: stock, stockInicial: stock, min: min,
        color: palette[cat] || '#8A5FB0',
        imagenUrl: urlFotoIA(name, cat),
        fotoPropia: fotoNueva || null,
        historialPrecios: [{ precio: price, fecha: Date.now() }],
        archivado: false, createdAt: FieldValue.serverTimestamp()
      }).then(function(){
        const conFoto = !!fotoNueva;
        fotoNueva = null;
        if(!conFoto) new Image().src = urlFotoIA(name, cat);   // empieza a generar la foto ya mismo
        showToast(conFoto ? 'Producto publicado en el marketplace con tu foto' : 'Producto publicado en el marketplace — generando la foto con IA');
      }).catch(function(err){
        showToast('No se pudo publicar: ' + err.message);
      }).finally(function(){ addLotBtn.disabled = false; });
    });
  }

  const volverPerfilBtn = document.getElementById('volverPerfilBtn');
  if(volverPerfilBtn){
    volverPerfilBtn.addEventListener('click', function(){
      const inicio = { mayorista:'catalogo', productor:'publicaciones', admin:'dashboard' };
      view[currentUser.rol] = inicio[currentUser.rol];
      renderSubnav(); renderMain();
    });
  }

  const savePerfilBtn = document.getElementById('savePerfilBtn');
  if(savePerfilBtn){
    savePerfilBtn.addEventListener('click', function(){
      const val = function(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; };
      const datos = {
        nombre: val('pfNombre'), entidad: val('pfEntidad'), dni: val('pfDni'),
        telefono: val('pfTelefono'), calle: val('pfCalle'), numero: val('pfNumero'),
        ciudad: val('pfCiudad'), provincia: val('pfProvincia'),
      };
      const error = validarRegistro(datos);
      if(error){ showToast(error); return; }

      savePerfilBtn.disabled = true;
      savePerfilBtn.textContent = 'Guardando…';
      db.collection('usuarios').doc(currentUser.uid).update({
        nombre: datos.nombre, entidad: datos.entidad,
        dni: datos.dni.replace(/[.\s-]/g,''), telefono: datos.telefono,
        calle: datos.calle, numero: datos.numero,
        ciudad: datos.ciudad, provincia: datos.provincia
      }).then(function(){
        // Mantenemos la copia local en memoria al día, sin recargar la sesión.
        Object.keys(datos).forEach(function(k){ currentUser[k] = datos[k]; });
        currentUser.dni = datos.dni.replace(/[.\s-]/g,'');
        showToast('Perfil actualizado');
        renderHeaderRight();
        renderSideUser();
        renderMain();
      }).catch(function(err){
        console.error('[CitrusCode] No se pudo guardar el perfil:', err);
        showToast(err.code === 'permission-denied'
          ? 'Firestore rechazó el cambio por permisos.'
          : 'No se pudo guardar: ' + err.message);
        savePerfilBtn.disabled = false;
        savePerfilBtn.textContent = 'Guardar cambios';
      });
    });
  }

  main.querySelectorAll('[data-edit-lot]').forEach(function(b){
    b.addEventListener('click', function(){
      editandoLote = b.dataset.editLot;
      renderMain();
      const campo = document.getElementById('newLotName');
      if(campo){
        try {
          campo.focus();
          if(typeof campo.scrollIntoView === 'function') campo.scrollIntoView({block:'center', behavior:'smooth'});
        } catch(_){ /* si el navegador no lo soporta, no pasa nada */ }
      }
    });
  });

  const cancelEditBtn = document.getElementById('cancelEditBtn');
  if(cancelEditBtn){
    cancelEditBtn.addEventListener('click', function(){ editandoLote = null; renderMain(); });
  }

  const saveLotBtn = document.getElementById('saveLotBtn');
  if(saveLotBtn){
    saveLotBtn.addEventListener('click', function(){
      const lote = lotById(editandoLote);
      if(!lote){ editandoLote = null; renderMain(); return; }
      const name = document.getElementById('newLotName').value.trim();
      const cat = document.getElementById('newLotCat').value;
      const unit = document.getElementById('newLotUnit').value;
      const price = parseFloat(document.getElementById('newLotPrice').value);
      const stock = parseFloat(document.getElementById('newLotStock').value);
      const min = parseFloat(document.getElementById('newLotMin').value);

      if(!name || name.length < 3){ showToast('El nombre del producto es muy corto'); return; }
      if(!(price > 0)){ showToast('El precio tiene que ser mayor a cero'); return; }
      if(!(stock >= 0)){ showToast('El stock no puede ser negativo'); return; }
      if(!(min > 0)){ showToast('El pedido mínimo tiene que ser mayor a cero'); return; }
      if(min > stock && stock > 0){ showToast('El pedido mínimo no puede superar al stock disponible'); return; }

      const antes = lote.stock;
      saveLotBtn.disabled = true;
      saveLotBtn.textContent = 'Guardando…';
      const palette = {limon:'#E8C547', naranja:'#F0A03C', mandarina:'#F5B25C', pomelo:'#E88C86', subproductos:'#B7C93C'};
      const cambios = {
        name: name, cat: cat, unit: unit, price: price, stock: stock, min: min,
        color: palette[cat] || '#8A5FB0',
        // La barra de progreso se mide contra el máximo histórico del lote.
        stockInicial: Math.max(stock, lote.stockInicial || 0)
      };
      // Si cambió el nombre o la categoría, la foto se vuelve a generar.
      if(name !== lote.name || cat !== lote.cat) cambios.imagenUrl = urlFotoIA(name, cat);
      // Cada cambio de precio queda en el historial (para "Evolución de precios").
      if(price !== lote.price){
        cambios.historialPrecios = (lote.historialPrecios && lote.historialPrecios.length)
          ? FieldValue.arrayUnion({ precio: price, fecha: Date.now() })
          : [{ precio: lote.price, fecha: (lote.createdAt && lote.createdAt.toMillis) ? lote.createdAt.toMillis() : Date.now() - 60000 }, { precio: price, fecha: Date.now() }];
      }
      db.collection('lotes').doc(lote.id).update(cambios).then(function(){
        const dif = stock - antes;
        showToast(dif > 0
          ? 'Publicación actualizada — repusiste ' + dif.toLocaleString('es-AR') + ' ' + unit
          : 'Publicación actualizada');
        editandoLote = null;
        renderMain();
      }).catch(function(err){
        console.error('[CitrusCode] No se pudo guardar la publicación:', err);
        showToast(err.code === 'permission-denied'
          ? 'Firestore rechazó el cambio por permisos.'
          : 'No se pudo guardar: ' + err.message);
        saveLotBtn.disabled = false;
        saveLotBtn.textContent = 'Guardar cambios';
      });
    });
  }

  main.querySelectorAll('[data-delete-lot]').forEach(function(b){
    b.addEventListener('click', function(){
      if(!window.confirm('¿Eliminar esta publicación? Dejará de verse en el catálogo. Los pedidos ya realizados sobre este producto se conservan.')) return;
      b.disabled = true;
      db.collection('lotes').doc(b.dataset.deleteLot).update({ archivado: true })
        .then(function(){ showToast('Publicación eliminada'); })
        .catch(function(err){ showToast('Error: ' + err.message); b.disabled = false; });
    });
  });

  const addReqBtn = document.getElementById('addReqBtn');
  if(addReqBtn){
    addReqBtn.addEventListener('click', function(){
      const name = document.getElementById('newReqName').value.trim();
      const detalle = document.getElementById('newReqDetalle').value.trim();
      if(name.length < 5){ showToast('Contanos en una frase qué necesitás resolver'); return; }
      if(detalle.length < 25){ showToast('Detallá un poco más las especificaciones (mínimo 25 caracteres)'); return; }
      addReqBtn.disabled = true;
      addReqBtn.textContent = 'Enviando…';
      const hoy = new Date();
      db.collection('proyectos').add({
        name: name,
        cliente: currentUser.entidad || currentUser.nombre,
        detalle: detalle,
        solicitanteUid: currentUser.uid,
        contacto: (currentUser.nombre || '') + (currentUser.telefono ? ' · ' + currentUser.telefono : ''),
        fechaTexto: hoy.toLocaleDateString('es-AR'),
        stageIdx: 0,
        createdAt: FieldValue.serverTimestamp()
      }).then(function(){
        showToast('Solicitud enviada al equipo de CitrusCode');
        document.getElementById('newReqName').value = '';
        document.getElementById('newReqDetalle').value = '';
      }).catch(function(err){
        showToast('No se pudo enviar: ' + err.message);
      }).finally(function(){
        addReqBtn.disabled = false;
        addReqBtn.textContent = 'Enviar solicitud';
      });
    });
  }

  const addProjBtn = document.getElementById('addProjBtn');
  if(addProjBtn){
    addProjBtn.addEventListener('click', function(){
      const name = document.getElementById('newProjName').value.trim();
      const cliente = document.getElementById('newProjClient').value.trim();
      if(!name || !cliente){ showToast('Completá nombre y cliente del proyecto'); return; }
      addProjBtn.disabled = true;
      db.collection('proyectos').add({ name: name, cliente: cliente, stageIdx: 0, createdAt: FieldValue.serverTimestamp() })
        .then(function(){ showToast('Proyecto creado'); })
        .catch(function(err){ showToast('No se pudo crear: ' + err.message); })
        .finally(function(){ addProjBtn.disabled = false; });
    });
  }

  main.querySelectorAll('[data-confirm]').forEach(function(b){
    b.addEventListener('click', function(){
      const orderId = b.dataset.confirm;
      const o = S.orders.find(function(x){ return x.id === orderId; });
      if(!o) return;
      b.disabled = true;
      b.textContent = 'Confirmando…';
      // Confirmar y descontar stock en una sola transacción atómica: si dos pedidos
      // del mismo lote se confirman a la vez, no se puede vender más de lo disponible.
      const orderRef = db.collection('pedidos').doc(orderId);
      let stockNuevo = null;

      const operacion = (!o.lotId || o.stockDescontado)
        // Pedido viejo sin lote asociado, o al que ya se le descontó el stock:
        // se confirma igual, sin tocar el inventario.
        ? orderRef.update({ statusIdx: 1 })
        : db.runTransaction(function(tx){
            const lotRef = db.collection('lotes').doc(o.lotId);
            return tx.get(lotRef).then(function(lotSnap){
              if(!lotSnap.exists){
                // El productor borró la publicación: confirmamos sin descontar.
                tx.update(orderRef, { statusIdx: 1 });
                return;
              }
              const stockActual = Number(lotSnap.data().stock) || 0;
              if(stockActual < o.qty){
                const e = new Error('Stock insuficiente: quedan ' + stockActual.toLocaleString('es-AR') + ' ' + (lotSnap.data().unit || 'kg') + ' y el pedido es de ' + o.qty.toLocaleString('es-AR') + '. Actualizá el stock antes de confirmar.');
                e.esDeNegocio = true;
                throw e;
              }
              stockNuevo = stockActual - o.qty;
              tx.update(lotRef, { stock: stockNuevo });
              tx.update(orderRef, { statusIdx: 1, stockDescontado: true });
            });
          });

      operacion.then(function(){
        showToast(stockNuevo === null
          ? 'Pedido confirmado'
          : 'Pedido confirmado — stock actualizado: quedan ' + stockNuevo.toLocaleString('es-AR') + ' ' + unitOf(o));
      }).catch(function(err){
        console.error('[CitrusCode] Falló la confirmación del pedido:', err);
        let msg;
        if(err && err.esDeNegocio){
          msg = err.message;
        } else if(err && (err.code === 'permission-denied' || /insufficient permissions/i.test(err.message || ''))){
          msg = 'Firestore rechazó la operación por permisos. Hay que publicar las reglas actualizadas en la consola de Firebase.';
        } else {
          msg = 'No se pudo confirmar el pedido: ' + ((err && err.message) || 'error desconocido');
        }
        showToast(msg);
        b.disabled = false;
        b.textContent = 'Confirmar pedido';
      });
    });
  });

  main.querySelectorAll('[data-advance]').forEach(function(b){
    b.addEventListener('click', function(){
      const o = S.orders.find(function(x){ return x.id === b.dataset.advance; });
      if(!o) return;
      b.disabled = true;
      const traceIdx = o.traceIdx + 1;
      const statusIdx = traceStatusIdx(traceIdx);
      const update = { traceIdx: traceIdx, statusIdx: statusIdx };
      if(statusIdx === 4 && !o.invoice){ update.invoice = genInvoice(o); }
      db.collection('pedidos').doc(o.id).update(update).then(function(){
        showToast(statusIdx === 4 ? 'Pedido entregado — factura generada automáticamente' : 'Trazabilidad actualizada: ' + TRACE_LABELS[traceIdx]);
      }).catch(function(err){ showToast('Error: ' + err.message); b.disabled = false; });
    });
  });

  main.querySelectorAll('[data-cancel-order]').forEach(function(b){
    b.addEventListener('click', function(){
      if(!window.confirm('¿Seguro que querés cancelar este pedido? Esta acción no se puede deshacer.')) return;
      b.disabled = true;
      db.collection('pedidos').doc(b.dataset.cancelOrder).update({ cancelado: true })
        .then(function(){ showToast('Pedido cancelado'); })
        .catch(function(err){ showToast('Error: ' + err.message); b.disabled = false; });
    });
  });

  main.querySelectorAll('[data-hide-order]').forEach(function(b){
    b.addEventListener('click', function(){
      if(!window.confirm('¿Quitar este pedido de tu lista? Solo se oculta de tu vista, el registro sigue guardado en el sistema.')) return;
      b.disabled = true;
      db.collection('pedidos').doc(b.dataset.hideOrder).update({ ocultoMayorista: true })
        .then(function(){ showToast('Pedido quitado de la lista'); })
        .catch(function(err){ showToast('Error: ' + err.message); b.disabled = false; });
    });
  });

  const clearMayBtn = main.querySelector('#clearMayoristaPedidos');
  if(clearMayBtn){
    clearMayBtn.addEventListener('click', function(){
      const ids = S.orders.filter(function(o){
        return o.mayoristaUid === currentUser.uid && !o.ocultoMayorista && (o.cancelado || o.statusIdx === STATUSES.length - 1);
      }).map(function(o){ return o.id; });
      if(!ids.length) return;
      if(!window.confirm('¿Vaciar '+ids.length+' pedido(s) cancelado(s)/entregado(s) de tu lista? Solo se ocultan de tu vista, quedan guardados en el sistema.')) return;
      clearMayBtn.disabled = true;
      const batch = db.batch();
      ids.forEach(function(id){ batch.update(db.collection('pedidos').doc(id), { ocultoMayorista: true }); });
      batch.commit()
        .then(function(){ showToast('Lista de pedidos vaciada'); })
        .catch(function(err){ showToast('Error: ' + err.message); clearMayBtn.disabled = false; });
    });
  }

  const clearProdBtn = main.querySelector('#clearProductorPedidos');
  if(clearProdBtn){
    clearProdBtn.addEventListener('click', function(){
      const ids = S.orders.filter(function(o){
        return o.productorUid === currentUser.uid && !o.ocultoProductor && (o.cancelado || o.statusIdx === STATUSES.length - 1);
      }).map(function(o){ return o.id; });
      if(!ids.length) return;
      if(!window.confirm('¿Vaciar '+ids.length+' pedido(s) cancelado(s)/entregado(s) de tu lista? Solo se ocultan de tu vista, quedan guardados en el sistema.')) return;
      clearProdBtn.disabled = true;
      const batch = db.batch();
      ids.forEach(function(id){ batch.update(db.collection('pedidos').doc(id), { ocultoProductor: true }); });
      batch.commit()
        .then(function(){ showToast('Lista de pedidos vaciada'); })
        .catch(function(err){ showToast('Error: ' + err.message); clearProdBtn.disabled = false; });
    });
  }

  main.querySelectorAll('[data-hide-order-productor]').forEach(function(b){
    b.addEventListener('click', function(){
      if(!window.confirm('¿Quitar este pedido de tu lista? Solo se oculta de tu vista, el registro sigue guardado en el sistema.')) return;
      b.disabled = true;
      db.collection('pedidos').doc(b.dataset.hideOrderProductor).update({ ocultoProductor: true })
        .then(function(){ showToast('Pedido quitado de la lista'); })
        .catch(function(err){ showToast('Error: ' + err.message); b.disabled = false; });
    });
  });

  main.querySelectorAll('[data-comprobante-pedido]').forEach(function(b){
    b.addEventListener('click', function(){ descargarComprobante(b.dataset.comprobantePedido, 'pedido'); });
  });

  main.querySelectorAll('[data-comprobante-entrega]').forEach(function(b){
    b.addEventListener('click', function(){ descargarComprobante(b.dataset.comprobanteEntrega, 'entrega'); });
  });

  main.querySelectorAll('[data-project-advance]').forEach(function(b){
    b.addEventListener('click', function(){
      const pr = S.projects.find(function(x){ return x.id === b.dataset.projectAdvance; });
      if(!pr) return;
      b.disabled = true;
      db.collection('proyectos').doc(pr.id).update({ stageIdx: pr.stageIdx + 1 })
        .then(function(){ showToast(pr.name + ' avanzó de etapa'); })
        .catch(function(err){ showToast('Error: ' + err.message); b.disabled = false; });
    });
  });
}

/* ============================================================
   ESTADO DE AUTENTICACIÓN
   ============================================================ */
auth.onAuthStateChanged(function(user){
  if(user){
    db.collection('usuarios').doc(user.uid).get().then(function(doc){
      if(!doc.exists){
        auth.signOut();
        return;
      }
      const data = doc.data();
      currentUser = { uid: user.uid, email: data.email, nombre: data.nombre, rol: data.rol, entidad: data.entidad };
      renderHeaderRight();
      renderApp();
      subscribeData();
    }).catch(function(err){
      document.getElementById('appBody').innerHTML = '<div class="loading-state">Error cargando tu cuenta: '+esc(err.message)+'</div>';
    });
  } else {
    currentUser = null;
    unsubscribeData();
    renderHeaderRight();
    renderAuthScreen();
  }
});

/* ============ CAPA FUTURISTA (decorativa, no toca la lógica del sistema) ============ */
(function(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  /* Modo claro / oscuro (se recuerda en el navegador) */
  const themeBtn = document.getElementById('themeToggle');
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  function temaActual(){ return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function sincronizarBotonTema(){
    const oscuro = temaActual() === 'dark';
    const txt = oscuro ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
    themeBtn.setAttribute('aria-label', txt);
    themeBtn.title = txt;
    if(metaTheme) metaTheme.setAttribute('content', oscuro ? '#10170E' : '#FFFDF6');
  }
  function aplicarTema(t, guardar){
    document.documentElement.setAttribute('data-theme', t);
    if(guardar){ try { localStorage.setItem('cc-theme', t); } catch(_){} }
    sincronizarBotonTema();
    if(window.L) refrescarMapaTema();
  }
  sincronizarBotonTema();
  themeBtn.addEventListener('click', function(e){
    const siguiente = temaActual() === 'dark' ? 'light' : 'dark';
    if(!document.startViewTransition || reduceMotion){ aplicarTema(siguiente, true); return; }
    // Transición circular que se expande desde el botón.
    const r = themeBtn.getBoundingClientRect();
    const x = e.clientX || (r.left + r.width/2), y = e.clientY || (r.top + r.height/2);
    const radio = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));
    const vt = document.startViewTransition(function(){ aplicarTema(siguiente, true); });
    vt.ready.then(function(){
      document.documentElement.animate(
        { clipPath: ['circle(0px at '+x+'px '+y+'px)', 'circle('+radio+'px at '+x+'px '+y+'px)'] },
        { duration: 600, easing: 'cubic-bezier(.2,.8,.2,1)', pseudoElement: '::view-transition-new(root)' }
      );
    }).catch(function(){});
  });
  // Si el usuario nunca eligió, se sigue el tema del sistema operativo.
  if(window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const alCambiar = function(ev){
      let elegido = null;
      try { elegido = localStorage.getItem('cc-theme'); } catch(_){}
      if(!elegido) aplicarTema(ev.matches ? 'dark' : 'light', false);
    };
    if(mq.addEventListener) mq.addEventListener('change', alCambiar);
  }

  /* Efecto "ripple" al tocar botones */
  document.addEventListener('pointerdown', function(e){
    if(reduceMotion || !e.target.closest) return;
    const b = e.target.closest('.btn, .add-btn, .filter-btn, .subnav button, .auth-tabs button');
    if(!b || b.disabled) return;
    const r = b.getBoundingClientRect();
    const d = Math.max(r.width, r.height) * 2.2;
    const onda = document.createElement('span');
    onda.className = 'ripple';
    onda.style.width = onda.style.height = d + 'px';
    onda.style.left = (e.clientX - r.left - d/2) + 'px';
    onda.style.top = (e.clientY - r.top - d/2) + 'px';
    b.appendChild(onda);
    setTimeout(function(){ onda.remove(); }, 700);
  });

  /* Atajo: "/" enfoca el buscador del catálogo */
  document.addEventListener('keydown', function(e){
    if(e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    const buscador = document.getElementById('catBuscar');
    if(buscador){ e.preventDefault(); buscador.focus(); buscador.select(); }
  });

  /* Botón "volver arriba" */
  const toTop = document.getElementById('toTop');
  toTop.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }); });

  /* Barra de progreso de scroll */
  const progressBar = document.getElementById('scrollProgress');
  function updateProgress(){
    toTop.classList.toggle('show', window.scrollY > 500);
    if(!progressBar) return;
    const h = document.documentElement.scrollHeight - window.innerHeight;
    const p = h > 0 ? window.scrollY / h : 0;
    progressBar.style.transform = 'scaleX(' + p + ')';
  }
  window.addEventListener('scroll', updateProgress, {passive:true});
  window.addEventListener('resize', updateProgress);
  updateProgress();

  /* Partículas flotantes */
  const pc = document.getElementById('particles');
  if(pc && !reduceMotion){
    const total = window.innerWidth < 700 ? 8 : 16;
    let frag = '';
    for(let i=0; i<total; i++){
      const left = Math.random()*100;
      const dur = 16 + Math.random()*16;
      const delay = -Math.random()*dur;
      const size = 2 + Math.random()*2;
      const op = .18 + Math.random()*.3;
      frag += '<i style="left:'+left.toFixed(2)+'%; bottom:-10px; width:'+size.toFixed(1)+'px; height:'+size.toFixed(1)+'px;'+
              ' opacity:'+op.toFixed(2)+'; animation-duration:'+dur.toFixed(1)+'s; animation-delay:'+delay.toFixed(1)+'s;"></i>';
    }
    pc.innerHTML = frag;
  }

  /* Tilt 3D en tarjetas (se re-aplica porque el sistema re-renderiza) */
  if(finePointer && !reduceMotion){
    function onMove(e){
      const card = e.target.closest ? e.target.closest('.kpi-card, .product-card') : null;
      if(!card) return;
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - .5;
      const py = (e.clientY - r.top) / r.height - .5;
      card.style.transform = 'perspective(900px) rotateX(' + (-py*5).toFixed(2) + 'deg) rotateY(' + (px*7).toFixed(2) + 'deg) translateY(-5px)';
    }
    function onLeave(e){
      const card = e.target.closest ? e.target.closest('.kpi-card, .product-card') : null;
      if(card && !card.contains(e.relatedTarget)) card.style.transform = '';
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseout', onLeave);
  }
})();
</script>
