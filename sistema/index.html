    html += '<div class="envio-box" style="margin-bottom:20px;"><b>Falta un paso de configuración</b>Para usar la bitácora hay que publicar las reglas nuevas de Firestore (archivo <code>backend/firestore.rules</code>) en la consola de Firebase.</div>';
  }
  html += '<div class="kpi-grid">'+
    '<div class="kpi-card"><div class="kpi-label">Eventos registrados</div><div class="kpi-value">'+S.bitacora.length+'</div><div class="kpi-sub">últimos 500 como máximo</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">Eventos de hoy</div><div class="kpi-value">'+deHoy.length+'</div><div class="kpi-sub">desde las 00:00</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">Usuarios activos hoy</div><div class="kpi-value">'+activosHoy+'</div><div class="kpi-sub">con al menos una acción</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">Acción más frecuente</div><div class="kpi-value" style="font-size:1.05rem;">'+esc(top || '—')+'</div><div class="kpi-sub">'+(top ? porAccion[top] + ' veces' : 'sin datos')+'</div></div>'+
  '</div>';
  html += '<div class="cat-toolbar" style="margin-top:18px;">'+
    '<div class="form-row search-field"><label for="bitBuscar">Buscar</label>'+icono('buscar')+
      '<input type="search" id="bitBuscar" placeholder="Usuario, acción o detalle…" value="'+esc(bitFiltro.q)+'" autocomplete="off"></div>'+
    '<div class="form-row"><label for="bitRol">Rol</label><select id="bitRol">'+
      [['todos','Todos los roles'],['mayorista','Mayorista'],['productor','Productor'],['admin','Administración']].map(function(o){
        return '<option value="'+o[0]+'"'+(o[0]===bitFiltro.rol?' selected':'')+'>'+o[1]+'</option>'; }).join('')+
    '</select></div>'+
    '<div class="form-row"><label for="bitAccion">Acción</label><select id="bitAccion"><option value="todas">Todas las acciones</option>'+
      acciones.map(function(a){ return '<option value="'+esc(a)+'"'+(a===bitFiltro.accion?' selected':'')+'>'+esc(a)+'</option>'; }).join('')+
    '</select></div>'+
  '</div>';
  const filas = lista.map(function(b){
    return '<tr><td style="white-space:nowrap;">'+fechaHora(b.fecha)+'</td><td>'+esc(b.nombre)+'</td><td>'+(roles[b.rol] || esc(b.rol))+'</td>'+
      '<td><span class="bit-accion">'+esc(b.accion)+'</span></td><td>'+esc(b.detalle)+'</td></tr>';
  }).join('');
  html += '<div class="cat-meta"><span>Mostrando <b>'+lista.length+'</b> de '+S.bitacora.length+' eventos</span></div>'+
    '<div class="tabla-scroll"><table class="simple"><tr><th>Fecha y hora</th><th>Usuario</th><th>Rol</th><th>Acción</th><th>Detalle</th></tr>'+
    (filas || '<tr><td colspan="5" style="text-align:center; color:var(--texto-suave);">No hay eventos que coincidan.</td></tr>')+
    '</table></div></div>';
  return html;
}

/* ============================================================
   COTIZACIONES DESDE EL CHAT
   El mayorista pide precio por un volumen; el productor responde con un
   precio especial y, si el mayorista acepta, se genera el pedido con ese precio.
   También se usan para reservar cosecha futura desde el calendario.
   ============================================================ */
const COT_ESTADOS = { pendiente:'Esperando precio', cotizada:'Precio recibido', contraoferta:'Contraoferta', aceptada:'Aceptada', rechazada:'Rechazada', cancelada:'Cancelada' };
let cotizFormAbierto = false;
const MAX_RONDAS = 10;   // propuestas de precio por cotización (las reglas de Firestore ponen el mismo tope)
function rondasDe(c){
  if(c.rondas && c.rondas.length) return c.rondas;
  // Cotizaciones de antes de las contraofertas: su único precio cuenta como primera propuesta.
  return c.precioOfertado ? [{ de: 'productor', precio: c.precioOfertado }] : [];
}
function cotizacionesDeConv(convId){
  return S.cotizaciones.filter(function(c){ return c.convId === convId; })
    .sort(function(a, b){ return msDe(b.creado) - msDe(a.creado); });
}
/* Cotizaciones que esperan una acción del usuario actual. */
function cotizacionesPorAtender(){
  if(!currentUser) return [];
  return S.cotizaciones.filter(function(c){
    return currentUser.rol === 'productor' ? (c.productorUid === currentUser.uid && (c.estado === 'pendiente' || c.estado === 'contraoferta'))
      : (c.mayoristaUid === currentUser.uid && c.estado === 'cotizada');
  });
}
function descripcionCot(c){
  return Number(c.qty).toLocaleString('es-AR') + ' ' + (c.unit || 'kg') + ' de ' + c.producto +
    (c.origen === 'cosecha' ? ' (reserva para ' + MESES[c.mes] + ')' : '');
}
/* Envía un mensaje de texto al chat con otra persona (crea la conversación si hace falta). */
function enviarTextoA(otroUid, texto){
  const id = convIdCon(otroUid);
  const ref = db.collection('conversaciones').doc(id);
  const ahora = FieldValue.serverTimestamp();
  const resumen = { ultimoMensaje: texto.slice(0, 120), ultimoAutorUid: currentUser.uid, actualizado: ahora };
  resumen[campoVisto()] = ahora;
  const batch = db.batch();
  const nueva = !S.convs.some(function(c){ return c.id === id; });
  if(!nueva){
    batch.update(ref, resumen);
  } else {
    const yo = currentUser.entidad || currentUser.nombre;
    const otro = nombreContacto(contactoPorUid(otroUid)) || 'Contacto';
    const esMay = currentUser.rol === 'mayorista';
    batch.set(ref, Object.assign({
      mayoristaUid: esMay ? currentUser.uid : otroUid,
      productorUid: esMay ? otroUid : currentUser.uid,
      mayoristaNombre: esMay ? yo : otro,
      productorNombre: esMay ? otro : yo,
      participantes: esMay ? [currentUser.uid, otroUid] : [otroUid, currentUser.uid],
      creado: ahora
    }, resumen));
  }
  batch.set(ref.collection('mensajes').doc(), {
    autorUid: currentUser.uid,
    autorNombre: currentUser.entidad || currentUser.nombre,
    rol: currentUser.rol,
    texto: texto.slice(0, 500),
    fecha: ahora
  });
  return batch.commit().then(function(){
    if(nueva) registrar('Chat iniciado', 'Con ' + (nombreContacto(contactoPorUid(otroUid)) || 'un contacto'));
  });
}
function errorFirestore(err, accion){
  return err && err.code === 'permission-denied'
    ? 'Firestore rechazó la operación: falta publicar las reglas nuevas.'
    : 'No se pudo ' + accion + ': ' + ((err && err.message) || 'error desconocido');
}
function crearCotizacion(datos){
  const prod = contactoPorUid(datos.productorUid);
  const doc = Object.assign({
    mayoristaUid: currentUser.uid,
    mayoristaNombre: currentUser.entidad || currentUser.nombre,
    productorNombre: nombreContacto(prod) || datos.productorNombre || 'Productor',
    participantes: [currentUser.uid, datos.productorUid],
    convId: currentUser.uid + '_' + datos.productorUid,
    estado: 'pendiente',
    creado: FieldValue.serverTimestamp(),
    actualizado: FieldValue.serverTimestamp()
  }, datos);
  return db.collection('cotizaciones').add(doc).then(function(){
    registrar(datos.origen === 'cosecha' ? 'Reserva de cosecha' : 'Cotización pedida', descripcionCot(doc) + ' a ' + doc.productorNombre);
    return enviarTextoA(datos.productorUid, (datos.origen === 'cosecha' ? '📅 Te pedí una reserva: ' : '📝 Te pedí una cotización: ') +
      descripcionCot(doc) + (datos.nota ? '. ' + datos.nota : '') + '.');
  });
}
function cajaCotizaciones(otroUid){
  const esMay = currentUser.rol === 'mayorista';
  const lista = cotizacionesDeConv(convIdCon(otroUid));
  let html = '';
  if(esMay){
    const lotes = S.lots.filter(function(l){ return l.productorUid === otroUid && !l.archivado; });
    html += '<div class="cot-bar"><button class="btn btn-ghost btn-sm'+(cotizFormAbierto ? ' abierto' : '')+'" id="cotToggle" type="button">📝 '+(cotizFormAbierto ? 'Cerrar' : 'Pedir cotización')+'</button>'+
      (lista.length ? '<span class="cot-cuenta">'+lista.length+' cotización'+(lista.length > 1 ? 'es' : '')+' en este chat</span>' : '')+'</div>';
    if(cotizFormAbierto){
      html += lotes.length
        ? '<div class="cot-form" data-keep>'+
            '<div class="form-row"><label for="cotLote">Producto</label><select id="cotLote">'+
              lotes.map(function(l){ return '<option value="'+l.id+'">'+esc(l.name)+' — '+money(l.price)+'/'+l.unit+' · stock '+l.stock.toLocaleString('es-AR')+' '+l.unit+'</option>'; }).join('')+
            '</select></div>'+
            '<div class="form-row"><label for="cotQty">Cantidad</label><input type="number" id="cotQty" min="1" step="100" value="'+lotes[0].min+'"></div>'+
            '<div class="form-row" style="grid-column:1/-1;"><label for="cotNota">Nota (opcional)</label><input type="text" id="cotNota" maxlength="200" placeholder="Plazo de entrega, calibre, forma de pago…"></div>'+
            '<button class="btn btn-primary btn-sm" id="cotEnviar" type="button">Enviar pedido de cotización</button>'+
          '</div>'
        : '<div class="cot-form"><p class="cot-vacio">Este productor no tiene publicaciones activas. Podés reservar cosecha futura desde el <b>Calendario de cosecha</b>.</p></div>';
    }
  }
  if(lista.length){
    html += '<div class="cot-lista">' + lista.map(function(c){
      const lote = c.lotId ? lotById(c.lotId) : null;
      let cuerpo = '';
      if(c.estado === 'pendiente'){
        cuerpo = esMay
          ? '<div class="cot-acc"><span>Esperando que el productor responda con un precio.</span><button class="btn btn-ghost btn-sm cancel-btn" data-cot-cancelar="'+c.id+'">Cancelar</button></div>'
          : '<div class="cot-acc" data-keep><input type="number" min="1" step="1" id="cotPrecio-'+c.id+'" placeholder="Precio por '+esc(c.unit || 'kg')+'"'+(lote ? ' value="'+lote.price+'"' : '')+'>'+
              '<button class="btn btn-primary btn-sm" data-cot-responder="'+c.id+'">Enviar precio</button>'+
              '<button class="btn btn-ghost btn-sm cancel-btn" data-cot-rechazar="'+c.id+'">Rechazar</button></div>';
      } else if(c.estado === 'cotizada'){
        const lista = lote ? lote.price : null;
        const desc = lista && lista > c.precioOfertado ? ' · '+Math.round((1 - c.precioOfertado / lista) * 100)+' % menos que el precio de lista' : '';
        const unidad = esc(c.unit || 'kg');
        cuerpo = '<div class="cot-precio"><b>'+money(c.precioOfertado)+' / '+unidad+'</b> · total '+money(c.precioOfertado * c.qty)+desc+'</div>'+
          (c.acordado ? '<div class="cot-acuerdo">🤝 '+(esMay ? 'El productor aceptó tu precio.' : 'Aceptaste el precio del mayorista.')+'</div>' : '')+
          (esMay
            ? '<div class="cot-acc"><button class="btn btn-primary btn-sm" data-cot-aceptar="'+c.id+'">'+(c.origen === 'cosecha' ? 'Confirmar reserva' : (c.acordado ? 'Generar pedido' : 'Aceptar y generar pedido'))+'</button>'+
                '<button class="btn btn-ghost btn-sm cancel-btn" data-cot-rechazar="'+c.id+'">Rechazar</button></div>'+
                (c.acordado || rondasDe(c).length >= MAX_RONDAS ? '' :
                '<div class="cot-acc cot-contra" data-keep><input type="number" min="1" step="1" id="cotContra-'+c.id+'" placeholder="Tu precio por '+unidad+'">'+
                  '<button class="btn btn-ghost btn-sm" data-cot-contra="'+c.id+'">Proponer otro precio</button></div>')
            : '<div class="cot-acc"><span>'+(c.acordado ? 'Esperando que el mayorista genere el pedido.' : 'Esperando que el mayorista acepte o proponga otro precio.')+'</span></div>');
      } else if(c.estado === 'contraoferta'){
        const unidad = esc(c.unit || 'kg');
        cuerpo = '<div class="cot-precio">'+(esMay ? 'Propusiste' : 'El mayorista propone')+' <b>'+money(c.precioContraoferta)+' / '+unidad+'</b> · total '+money(c.precioContraoferta * c.qty)+
            (c.precioOfertado ? ' <span class="cot-antes">(antes '+money(c.precioOfertado)+')</span>' : '')+'</div>'+
          (esMay
            ? '<div class="cot-acc"><span>Esperando la respuesta del productor.</span><button class="btn btn-ghost btn-sm cancel-btn" data-cot-cancelar="'+c.id+'">Retirar</button></div>'
            : '<div class="cot-acc"><button class="btn btn-primary btn-sm" data-cot-acepta-contra="'+c.id+'">Aceptar '+money(c.precioContraoferta)+'</button>'+
                '<button class="btn btn-ghost btn-sm cancel-btn" data-cot-rechazar="'+c.id+'">Rechazar</button></div>'+
              (rondasDe(c).length >= MAX_RONDAS ? '' :
              '<div class="cot-acc cot-contra" data-keep><input type="number" min="1" step="1" id="cotPrecio-'+c.id+'" placeholder="Otro precio por '+unidad+'">'+
                '<button class="btn btn-ghost btn-sm" data-cot-responder="'+c.id+'">Contraofertar</button></div>'));
      }
      const rondas = rondasDe(c);
      if(rondas.length > 1){
        cuerpo += '<details class="cot-hist"><summary>Negociación ('+rondas.length+' propuestas)</summary><ol>'+rondas.map(function(r){
          return '<li><b>'+(r.de === 'mayorista' ? esc(c.mayoristaNombre || 'Mayorista') : esc(c.productorNombre || 'Productor'))+'</b>: '+money(r.precio)+' / '+esc(c.unit || 'kg')+(r.acepta ? ' ✓ aceptado' : '')+
            (r.fecha ? ' <span>· '+new Date(r.fecha).toLocaleString('es-AR', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' })+'</span>' : '')+'</li>';
        }).join('')+'</ol></details>';
      } else if(c.estado === 'aceptada'){
        cuerpo = '<div class="cot-precio"><b>'+money(c.precioOfertado)+' / '+esc(c.unit || 'kg')+'</b> · '+
          (c.numeroPedido ? 'se generó el pedido <b>CC-'+c.numeroPedido+'</b>' : 'reserva confirmada para '+MESES[c.mes])+'</div>';
      }
      return '<div class="cot-card est-'+c.estado+'">'+
        '<div class="cot-top"><span class="cot-tit">'+(c.origen === 'cosecha' ? '📅 Reserva' : '📝 Cotización')+' · '+esc(descripcionCot(c))+'</span>'+
        '<span class="cot-estado">'+COT_ESTADOS[c.estado]+'</span></div>'+
        (c.nota ? '<div class="cot-nota">“'+esc(c.nota)+'”</div>' : '')+cuerpo+'</div>';
    }).join('') + '</div>';
  }
  return html ? '<div class="cot-zona">'+html+'</div>' : '';
}
function bindCotizaciones(main){
  const toggle = document.getElementById('cotToggle');
  if(toggle) toggle.addEventListener('click', function(){ cotizFormAbierto = !cotizFormAbierto; renderMain(); });
  const selLote = document.getElementById('cotLote');
  if(selLote) selLote.addEventListener('change', function(){
    const l = lotById(selLote.value); const q = document.getElementById('cotQty');
    if(l && q) q.value = l.min;
  });
  const enviar = document.getElementById('cotEnviar');
  if(enviar) enviar.addEventListener('click', function(){
    const l = lotById(document.getElementById('cotLote').value);
    const qty = parseFloat(document.getElementById('cotQty').value);
    const nota = document.getElementById('cotNota').value.trim().slice(0, 200);
    if(!l){ showToast('Elegí un producto'); return; }
    if(!(qty > 0)){ showToast('Indicá la cantidad que querés cotizar'); return; }
    if(qty < l.min){ showToast('El pedido mínimo de ' + l.name + ' es ' + l.min.toLocaleString('es-AR') + ' ' + l.unit); return; }
    if(qty > l.stock){ showToast('El stock publicado de ' + l.name + ' es ' + l.stock.toLocaleString('es-AR') + ' ' + l.unit + '. Cotizá hasta esa cantidad o reservá cosecha futura desde el calendario.'); return; }
    enviar.disabled = true;
    crearCotizacion({ productorUid: l.productorUid, productorNombre: l.productorNombre, lotId: l.id, producto: l.name, unit: l.unit || 'kg', qty: qty, nota: nota, origen: 'chat' })
      .then(function(){ cotizFormAbierto = false; showToast('Pedido de cotización enviado'); renderMain(); })

      }))

          return enviarTextoA(c.mayoristaUid, (contra ? '↩️ No llego a ' + money(c.precioContraoferta) + '. Te propongo ' : '💲 Te cotizo ' + descripcionCot(c) + ' a ') + money(precio) + ' por ' + (c.unit || 'kg') + ' (total ' + money(precio * c.qty) + ').');
        })

    });

  main.querySelectorAll('[data-cot-contra]').forEach(function(b){

      })).then(function(){

        showToast('Contraoferta enviada al productor');
        return enviarTextoA(c.productorUid, '🤝 ¿Me lo dejás a ' + money(precio) + ' por ' + (c.unit || 'kg') + '? (' + descripcionCot(c) + ', total ' + money(precio * c.qty) + ').');
      }).catch(function(err){ showToast(errorFirestore(err, 'enviar la contraoferta')); b.disabled = false; });
    });
  });
  main.querySelectorAll('[data-cot-acepta-contra]').forEach(function(b){
    b.addEventListener('click', function(){

        rondas: rondasDe(c).concat([{ de: 'productor', precio: precio, acepta: true, fecha: Date.now() }]),
        actualizado: FieldValue.serverTimestamp()
      })).then(function(){
        registrar('Contraoferta aceptada', descripcionCot(c) + ' a ' + money(precio) + '/' + (c.unit || 'kg'));
        showToast('Aceptaste el precio. El mayorista ya puede generar el pedido.');
        return enviarTextoA(c.mayoristaUid, '🤝 Trato hecho: ' + descripcionCot(c) + ' a ' + money(precio) + ' por ' + (c.unit || 'kg') + '. Ya podés generar el pedido.');
      }).catch(function(err){ showToast(errorFirestore(err, 'aceptar la contraoferta')); b.disabled = false; });
    });
  });
  main.querySelectorAll('[data-cot-rechazar],[data-cot-cancelar]').forEach(function(b){

      guardar(db.collection('cotizaciones').doc(c.id).update({ estado: estado, actualizado: FieldValue.serverTimestamp() }))
        .then(function(){
          registrar(estado === 'cancelada' ? 'Cotización cancelada' : 'Cotización rechazada', descripcionCot(c));

/* Datos de entrega que viajan con cada pedido (incluye coordenadas si se conocen). */
function datosEntrega(){
  const e = {
    contacto: currentUser.nombre || '',
    telefono: currentUser.telefono || '',
    dni: currentUser.dni || '',

  };

/* ============================================================
   CALENDARIO DE COSECHA
   El productor anuncia cuándo va a tener cada fruta; el mayorista planifica
   y reserva con anticipación (la reserva viaja como una cotización).
   ============================================================ */
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let cosechaCat = 'todos';
let reservaAbierta = null;   // id de la cosecha con el formulario de reserva abierto
let cosechasDisponible = true;
function mesesDe(c){
  const r = [];
  for(let m = c.desde, i = 0; i < 12; i++, m = (m + 1) % 12){ r.push(m); if(m === c.hasta) break; }
  return r;
}
function rangoTexto(c){ return c.desde === c.hasta ? MESES[c.desde] : MESES[c.desde] + ' a ' + MESES[c.hasta]; }
function viewCosecha(){
  const esProd = currentUser.rol === 'productor';
  const mesHoy = new Date().getMonth();
  let lista = S.cosechas.slice();
  if(esProd) lista = lista.filter(function(c){ return c.productorUid === currentUser.uid; });
  if(!esProd && cosechaCat !== 'todos') lista = lista.filter(function(c){ return c.cat === cosechaCat; });
  // Primero lo que está en temporada o empieza antes.
  const distancia = function(c){ const ms = mesesDe(c); return ms.indexOf(mesHoy) !== -1 ? -1 : (c.desde - mesHoy + 12) % 12; };
  lista.sort(function(a, b){ return distancia(a) - distancia(b) || a.producto.localeCompare(b.producto, 'es'); });

  let html = '<div class="panel"><div class="panel-head"><h2>Calendario de cosecha</h2><p>'+
    (esProd ? 'Anunciá cuándo vas a tener cada producto y cuánto estimás cosechar. Los mayoristas lo ven y pueden reservar con anticipación; las reservas te llegan por el chat para que les pases el precio.'
            : 'Qué va a tener cada productor y en qué meses. Reservá con anticipación: el productor te responde con el precio por el chat.')+'</p>'+
    (esProd ? '<div class="clima-box"><h4 style="margin:10px 0 6px;">Pronóstico en tu finca</h4>'+(coordsDe(currentUser) ? cajaClima(coordsDe(currentUser)) : '<p class="clima-aviso" style="color:var(--texto-suave);">Cargá tu dirección en Mi perfil para ver el pronóstico.</p>')+'</div>' : '')+
    '</div>';
  if(!cosechasDisponible){
    html += '<div class="envio-box" style="margin-bottom:20px;"><b>Falta un paso de configuración</b>Para usar el calendario hay que publicar las reglas nuevas de Firestore (archivo <code>backend/firestore.rules</code>) en la consola de Firebase.</div>';
  }
  if(esProd){
    html += '<div class="form-card" style="margin-bottom:22px;" data-keep><h4 style="margin:0 0 12px;">Anunciar una cosecha</h4><div class="form-grid">'+
      '<div class="form-row"><label for="cosProducto">Producto</label><input type="text" id="cosProducto" maxlength="60" placeholder="Limón Eureka"></div>'+
      '<div class="form-row"><label for="cosCat">Categoría</label><select id="cosCat">'+['limon','naranja','mandarina','pomelo','subproductos'].map(function(c){ return '<option value="'+c+'">'+c.charAt(0).toUpperCase()+c.slice(1)+'</option>'; }).join('')+'</select></div>'+
      '<div class="form-row"><label for="cosDesde">Desde</label><select id="cosDesde">'+MESES.map(function(m, i){ return '<option value="'+i+'"'+(i===mesHoy?' selected':'')+'>'+m+'</option>'; }).join('')+'</select></div>'+
      '<div class="form-row"><label for="cosHasta">Hasta</label><select id="cosHasta">'+MESES.map(function(m, i){ return '<option value="'+i+'"'+(i===(mesHoy+2)%12?' selected':'')+'>'+m+'</option>'; }).join('')+'</select></div>'+
      '<div class="form-row"><label for="cosVolumen">Volumen estimado</label><input type="number" id="cosVolumen" min="1" step="100" placeholder="50000"></div>'+
      '<div class="form-row"><label for="cosUnit">Unidad</label><select id="cosUnit">'+UNIDADES.map(function(u){ return '<option value="'+u+'">'+u+'</option>'; }).join('')+'</select></div>'+
      '<div class="form-row" style="grid-column:1/-1;"><label for="cosNotas">Notas (opcional)</label><input type="text" id="cosNotas" maxlength="200" placeholder="Calibre, certificaciones, condiciones…"></div>'+
    '</div><div class="order-actions" style="margin-top:14px;"><button class="btn btn-primary btn-sm" id="cosPublicar">Publicar en el calendario</button></div></div>';
  } else {
    const cats = ['todos','limon','naranja','mandarina','pomelo','subproductos'];
    html += '<div class="filters" style="margin-bottom:16px;">'+cats.map(function(c){
      return '<button class="filter-btn'+(c===cosechaCat?' active':'')+'" data-cos-cat="'+c+'">'+(c==='todos'?'Todos':c.charAt(0).toUpperCase()+c.slice(1))+'</button>';
    }).join('')+'</div>';
  }
  if(!lista.length){
    html += '<div class="empty-state"><div class="ee-icon">📅</div>'+(esProd ? 'Todavía no anunciaste ninguna cosecha.' : 'Todavía no hay cosechas anunciadas'+(cosechaCat !== 'todos' ? ' en esta categoría' : '')+'.')+'</div></div>';
    return html;
  }
  const cab = '<tr><th class="cal-prod">Producto</th>'+MESES.map(function(m, i){ return '<th class="'+(i===mesHoy?'hoy':'')+'" title="'+m+'">'+m.slice(0,3)+'</th>'; }).join('')+'<th></th></tr>';
  const filas = lista.map(function(c){
    const ms = mesesDe(c);
    const celdas = MESES.map(function(_, i){
      const on = ms.indexOf(i) !== -1;
      return '<td class="'+(i===mesHoy?'hoy ':'')+(on?'on':'')+'">'+(on ? '<span></span>' : '')+'</td>';
    }).join('');
    const acc = esProd
      ? '<button class="btn btn-ghost btn-sm cancel-btn" data-cos-borrar="'+c.id+'" title="Quitar del calendario">✕</button>'
      : '<button class="btn btn-primary btn-sm" data-cos-reservar="'+c.id+'">Reservar</button>';
    let fila = '<tr><td class="cal-prod"><b>'+esc(c.producto)+'</b><small>'+(esProd ? '' : esc(c.productorNombre)+' · ')+rangoTexto(c)+' · ~'+Number(c.volumen).toLocaleString('es-AR')+' '+esc(c.unit)+'</small>'+
      (c.notas ? '<small class="cal-nota">'+esc(c.notas)+'</small>' : '')+'</td>'+celdas+'<td class="cal-acc">'+acc+'</td></tr>';
    if(!esProd && reservaAbierta === c.id){
      fila += '<tr class="cal-reserva"><td colspan="14"><div class="cot-form" style="margin:0;" data-keep>'+
        '<div class="form-row"><label for="resMes">Mes</label><select id="resMes">'+ms.map(function(m){ return '<option value="'+m+'">'+MESES[m]+'</option>'; }).join('')+'</select></div>'+
        '<div class="form-row"><label for="resQty">Cantidad ('+esc(c.unit)+')</label><input type="number" id="resQty" min="1" step="100" value="1000"></div>'+
        '<div class="form-row" style="grid-column:1/-1;"><label for="resNota">Nota (opcional)</label><input type="text" id="resNota" maxlength="200" placeholder="Destino, calibre, forma de pago…"></div>'+
        '<div class="order-actions" style="margin:0;"><button class="btn btn-primary btn-sm" data-res-enviar="'+c.id+'">Enviar reserva</button><button class="btn btn-ghost btn-sm" data-res-cerrar="1">Cancelar</button></div>'+
      '</div></td></tr>';
    }
    return fila;
  }).join('');
  html += '<div class="tabla-scroll"><table class="simple cal-tabla">'+cab+filas+'</table></div>'+
    '<p class="cal-ley"><span class="cal-dot"></span> Meses con cosecha disponible · la columna resaltada es el mes actual.</p></div>';
  return html;
}
function bindCosecha(main){
  main.querySelectorAll('[data-cos-cat]').forEach(function(b){

    };

      ['cosProducto','cosVolumen','cosNotas'].forEach(function(id){ const el = document.getElementById(id); if(el) el.value = ''; });
      pub.disabled = false;

  main.querySelectorAll('[data-cos-borrar]').forEach(function(b){

        productorUid: c.productorUid, productorNombre: c.productorNombre, cosechaId: c.id,
        producto: c.producto, unit: c.unit, qty: qty, mes: parseInt(document.getElementById('resMes').value, 10),
        nota: document.getElementById('resNota').value.trim().slice(0, 200), origen: 'cosecha'
      }).then(function(){

        view.mayorista = 'chats';

      }).catch(function(err){ showToast(errorFirestore(err, 'enviar la reserva')); b.disabled = false; });

/* ============================================================
   SEGUIMIENTO DE PRODUCTORES Y ALERTAS DE PRECIO (mayorista)
   Lo que sigue cada mayorista se guarda en su propio perfil.
   ============================================================ */
let novedadesAvisadas = false;
function sigoA(uid){ return (currentUser.siguiendo || []).indexOf(uid) !== -1; }
function esFavorito(lotId){ return (currentUser.favoritos || []).indexOf(lotId) !== -1; }
function alertasDesde(){ return currentUser.alertasVistas || (Date.now() - 7 * 86400000); }
function novedades(){
  if(!currentUser || currentUser.rol !== 'mayorista') return [];
  const desde = alertasDesde();
  const lista = [];
  S.lots.forEach(function(l){
    if(l.archivado) return;
    const seguido = sigoA(l.productorUid), fav = esFavorito(l.id);
    if(!seguido && !fav) return;
    const creado = msDe(l.createdAt);
    if(seguido && creado > desde){
      lista.push({ tipo: 'nuevo', t: creado, lote: l, texto: esc(l.productorNombre) + ' publicó <b>' + esc(l.name) + '</b> a ' + money(l.price) + ' / ' + l.unit });
      return;
    }
    const h = (l.historialPrecios || []).slice().sort(function(a, b){ return a.fecha - b.fecha; });
    for(let i = h.length - 1; i > 0; i--){
      if(h[i].fecha <= desde) break;
      if(h[i].precio < h[i-1].precio){
        const pct = Math.round((1 - h[i].precio / h[i-1].precio) * 100);
        lista.push({ tipo: 'baja', t: h[i].fecha, lote: l, texto: 'Bajó el precio de <b>' + esc(l.name) + '</b> (' + esc(l.productorNombre) + '): ' + money(h[i-1].precio) + ' → ' + money(h[i].precio) + ' / ' + l.unit + ' <span class="trend down">▼ ' + pct + ' %</span>' });
        break;
      }
    }
  });
  return lista.sort(function(a, b){ return b.t - a.t; });
}
function actualizarSeguimiento(campo, valor, agregar){
  const lista = (currentUser[campo] || []).slice();
  const i = lista.indexOf(valor);
  if(agregar && i === -1) lista.push(valor);
  if(!agregar && i !== -1) lista.splice(i, 1);
  const anterior = currentUser[campo];
  currentUser[campo] = lista;
  renderSubnav(); renderMain();
  const upd = {}; upd[campo] = agregar ? FieldValue.arrayUnion(valor) : FieldValue.arrayRemove(valor);
  return db.collection('usuarios').doc(currentUser.uid).update(upd).catch(function(err){
    currentUser[campo] = anterior;
    renderSubnav(); renderMain();
    showToast(errorFirestore(err, 'guardar el cambio'));
    throw err;
  });
}
function viewAlertas(){
  const nov = novedades();
  const productores = S.contactos.slice().sort(function(a, b){ return nombreContacto(a).localeCompare(nombreContacto(b), 'es'); });
  const favs = S.lots.filter(function(l){ return esFavorito(l.id); });

/* ============================================================
   UBICACIÓN EXACTA (geocodificación con OpenStreetMap Nominatim)
   La dirección se convierte en coordenadas al registrarse o editar el perfil;
   el mapa del pedido usa esas coordenadas y, si no hay, la capital provincial.
   ============================================================ */
const geoCache = {};
function geocodificar(direccion){
  if(!direccion) return Promise.resolve(null);
  if(geoCache[direccion] !== undefined) return Promise.resolve(geoCache[direccion]);
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ar&accept-language=es&q=' + encodeURIComponent(direccion + ', Argentina');
  const ctrl = window.AbortController ? new AbortController() : null;
  const corte = ctrl ? setTimeout(function(){ ctrl.abort(); }, 8000) : null;
  return fetch(url, ctrl ? { signal: ctrl.signal } : undefined).then(function(r){ return r.ok ? r.json() : []; })
    .then(function(res){
      const p = res && res[0] ? [parseFloat(res[0].lat), parseFloat(res[0].lon)] : null;
      return (geoCache[direccion] = (p && isFinite(p[0]) && isFinite(p[1])) ? p : null);
    })
    .catch(function(){ return null; })
    .finally(function(){ if(corte) clearTimeout(corte); });
}
/* Guarda en el perfil las coordenadas de la dirección (en segundo plano). */
function guardarUbicacion(uid, datos){
  const dir = direccionDe(datos);
  return geocodificar(dir).then(function(p){
    const upd = p ? { lat: p[0], lng: p[1] } : { lat: FieldValue.delete(), lng: FieldValue.delete() };
    return db.collection('usuarios').doc(uid).update(upd).then(function(){
      if(currentUser && currentUser.uid === uid){
        if(p){ currentUser.lat = p[0]; currentUser.lng = p[1]; } else { delete currentUser.lat; delete currentUser.lng; }
      }
      return p;
    });
  }).catch(function(err){ console.warn('[CitrusCode] No se pudo ubicar la dirección:', err.message); return null; });
}
const usuarioCache = {};
function usuarioPorUid(uid){
  if(!uid) return Promise.resolve(null);
  if(usuarioCache[uid] !== undefined) return Promise.resolve(usuarioCache[uid]);
  return db.collection('usuarios').doc(uid).get().then(function(d){
    return (usuarioCache[uid] = d.exists ? d.data() : null);
  }).catch(function(){ return (usuarioCache[uid] = null); });
}
/* Punto en el mapa de un usuario: coordenadas guardadas, dirección o provincia. */
function ubicacionDe(u, direccionAlternativa, coordsAlternativas, provDefecto){
  if(coordsAlternativas) return Promise.resolve({ p: coordsAlternativas, etiqueta: direccionAlternativa || (u && direccionDe(u)) || '', exacta: true });
  if(u && typeof u.lat === 'number' && typeof u.lng === 'number') return Promise.resolve({ p: [u.lat, u.lng], etiqueta: direccionDe(u) || u.provincia, exacta: true });
  const dir = direccionAlternativa || (u && direccionDe(u));
  return geocodificar(dir).then(function(p){
    if(p) return { p: p, etiqueta: dir, exacta: true };
    const prov = provinciaDeDireccion(dir) || (u && COORDS_PROV[u.provincia] ? u.provincia : provDefecto);
    return { p: COORDS_PROV[prov], etiqueta: prov + ' (capital provincial)', exacta: false };
  });
}

/* ============================================================
   FOTOS EN FIREBASE STORAGE
   La foto propia se sube a Storage y el lote guarda solo su URL. Si Storage
   no está habilitado en el proyecto, se guarda como antes dentro del lote.
   ============================================================ */
const storage = (firebase.storage && firebaseConfig.storageBucket) ? firebase.storage() : null;
function subirFoto(dataUrl, lotId){
  // Sin señal la foto queda dentro del lote y viaja con él al sincronizar.
  if(!storage || !navigator.onLine) return Promise.resolve(dataUrl);
  const ruta = 'lotes/' + currentUser.uid + '/' + (lotId || 'nuevo') + '-' + Date.now() + '.jpg';
  const subida = storage.ref(ruta).putString(dataUrl, 'data_url', { contentType: 'image/jpeg' })
    .then(function(snap){ return snap.ref.getDownloadURL(); });
  const limite = new Promise(function(_, mal){ setTimeout(function(){ mal(new Error('tiempo de espera agotado')); }, 20000); });
  return Promise.race([subida, limite]).catch(function(err){
    console.warn('[CitrusCode] Storage no disponible, la foto se guarda en el lote:', err.message);
    return dataUrl;
  });
}
function borrarFotoStorage(url){
  if(!storage || !url || url.indexOf('firebasestorage') === -1) return;
  try { storage.refFromURL(url).delete().catch(function(){}); } catch(_){}
}

  main.querySelectorAll('[data-confirm]').forEach(function(b){
    b.addEventListener('click', function(){
      const orderId = b.dataset.confirm;
      const o = S.orders.find(function(x){ return x.id === orderId; });
      if(!o) return;
      b.disabled = true;
      b.textContent = 'Confirmando…';
      // Confirmar y descontar stock en una sola transacción atómica: si dos pedidos
      // del mismo lote se confirman a la vez, no se puede vender más de lo disponible.
      const orderRef = db.collection('pedidos').doc(orderId);
      let stockNuevo = null;

      const operacion = (!o.lotId || o.stockDescontado)
        // Pedido viejo sin lote asociado, o al que ya se le descontó el stock:
        // se confirma igual, sin tocar el inventario.
        ? orderRef.update({ statusIdx: 1 })
        : db.runTransaction(function(tx){
            const lotRef = db.collection('lotes').doc(o.lotId);
            return tx.get(lotRef).then(function(lotSnap){
              if(!lotSnap.exists){
                // El productor borró la publicación: confirmamos sin descontar.
                tx.update(orderRef, { statusIdx: 1 });
                return;
              }
              const stockActual = Number(lotSnap.data().stock) || 0;
              if(stockActual < o.qty){
                const e = new Error('Stock insuficiente: quedan ' + stockActual.toLocaleString('es-AR') + ' ' + (lotSnap.data().unit || 'kg') + ' y el pedido es de ' + o.qty.toLocaleString('es-AR') + '. Actualizá el stock antes de confirmar.');
                e.esDeNegocio = true;
                throw e;
              }
              stockNuevo = stockActual - o.qty;
              tx.update(lotRef, { stock: stockNuevo });
              tx.update(orderRef, { statusIdx: 1, stockDescontado: true });
            });
          });

      operacion.then(function(){
        registrar('Pedido confirmado', 'CC-' + o.numero + (stockNuevo === null ? '' : ' · stock restante ' + stockNuevo.toLocaleString('es-AR') + ' ' + unitOf(o)));
        showToast(stockNuevo === null
          ? 'Pedido confirmado'
          : 'Pedido confirmado — stock actualizado: quedan ' + stockNuevo.toLocaleString('es-AR') + ' ' + unitOf(o));
      }).catch(function(err){
        console.error('[CitrusCode] Falló la confirmación del pedido:', err);
        let msg;
        if(err && err.esDeNegocio){
          msg = err.message;
        } else if(!navigator.onLine || (err && err.code === 'unavailable')){
          msg = 'Confirmar un pedido necesita conexión, porque descuenta stock en el momento. Probá de nuevo cuando vuelva la señal.';
        } else if(err && (err.code === 'permission-denied' || /insufficient permissions/i.test(err.message || ''))){
          msg = 'Firestore rechazó la operación por permisos. Hay que publicar las reglas actualizadas en la consola de Firebase.';
        } else {
          msg = 'No se pudo confirmar el pedido: ' + ((err && err.message) || 'error desconocido');
        }
        showToast(msg);
        b.disabled = false;
        b.textContent = 'Confirmar pedido';
      });
    });
  });

  main.querySelectorAll('[data-advance]').forEach(function(b){
    b.addEventListener('click', function(){
      const o = S.orders.find(function(x){ return x.id === b.dataset.advance; });
      if(!o) return;
      b.disabled = true;
      avanzarTrazabilidad(o).then(function(r){
        showToast(r.statusIdx === 4 ? 'Pedido entregado — factura generada automáticamente' : 'Trazabilidad actualizada: ' + TRACE_LABELS[r.traceIdx]);
      }).catch(function(err){ showToast('Error: ' + err.message); b.disabled = false; });
    });
  });

  main.querySelectorAll('[data-escanear]').forEach(function(b){ b.addEventListener('click', abrirEscaner); });

  main.querySelectorAll('[data-suspender]').forEach(function(b){
    b.addEventListener('click', function(){
      const u = S.users.find(function(x){ return x.uid === b.dataset.suspender; });
      if(!u) return;
      const motivo = window.prompt('Vas a suspender a ' + (u.nombre || u.email) + '. No va a poder entrar ni operar, pero su historial se conserva.\n\nMotivo (lo ve el usuario):', '');
      if(motivo === null) return;
      b.disabled = true;
      db.collection('usuarios').doc(u.uid).update({
        suspendido: true, motivoSuspension: motivo.trim().slice(0, 200),
        suspendidoPor: currentUser.uid, suspendidoEn: FieldValue.serverTimestamp()
      }).then(function(){
        registrar('Cuenta suspendida', (u.nombre || u.email) + ' (' + u.rol + ')' + (motivo.trim() ? ' · ' + motivo.trim().slice(0, 200) : ''));
        showToast('Cuenta de ' + (u.nombre || u.email) + ' suspendida');
      }).catch(function(err){ showToast(errorFirestore(err, 'suspender la cuenta')); b.disabled = false; });
    });
  });
  main.querySelectorAll('[data-reactivar]').forEach(function(b){
    b.addEventListener('click', function(){
      const u = S.users.find(function(x){ return x.uid === b.dataset.reactivar; });
      if(!u || !window.confirm('¿Reactivar la cuenta de ' + (u.nombre || u.email) + '?')) return;
      b.disabled = true;
      db.collection('usuarios').doc(u.uid).update({
        suspendido: false, motivoSuspension: FieldValue.delete(),
        suspendidoPor: currentUser.uid, suspendidoEn: FieldValue.delete()
      }).then(function(){
        registrar('Cuenta reactivada', (u.nombre || u.email) + ' (' + u.rol + ')');
        showToast('Cuenta de ' + (u.nombre || u.email) + ' reactivada');
      }).catch(function(err){ showToast(errorFirestore(err, 'reactivar la cuenta')); b.disabled = false; });
    });
  });
  main.querySelectorAll('[data-etiqueta]').forEach(function(b){
    b.addEventListener('click', function(){
      const o = S.orders.find(function(x){ return x.id === b.dataset.etiqueta; });
      if(o) imprimirEtiqueta(o);
    });
  });

  main.querySelectorAll('[data-cancel-order]').forEach(function(b){
    b.addEventListener('click', function(){
      if(!window.confirm('¿Seguro que querés cancelar este pedido? Esta acción no se puede deshacer.')) return;
      b.disabled = true;
      const oc = S.orders.find(function(x){ return x.id === b.dataset.cancelOrder; });
      guardar(db.collection('pedidos').doc(b.dataset.cancelOrder).update({ cancelado: true }))
        .then(function(){ showToast('Pedido cancelado'); registrar('Pedido cancelado', oc ? 'CC-' + oc.numero : ''); })
        .catch(function(err){ showToast('Error: ' + err.message); b.disabled = false; });
    });
  });

  main.querySelectorAll('[data-hide-order]').forEach(function(b){
    b.addEventListener('click', function(){
      if(!window.confirm('¿Quitar este pedido de tu lista? Solo se oculta de tu vista, el registro sigue guardado en el sistema.')) return;
      b.disabled = true;
      guardar(db.collection('pedidos').doc(b.dataset.hideOrder).update({ ocultoMayorista: true }))
        .then(function(){ showToast('Pedido quitado de la lista'); })
        .catch(function(err){ showToast('Error: ' + err.message); b.disabled = false; });
    });
  });

  const clearMayBtn = main.querySelector('#clearMayoristaPedidos');
  if(clearMayBtn){
    clearMayBtn.addEventListener('click', function(){
      const ids = S.orders.filter(function(o){
        return o.mayoristaUid === currentUser.uid && !o.ocultoMayorista && (o.cancelado || o.statusIdx === STATUSES.length - 1);
      }).map(function(o){ return o.id; });
      if(!ids.length) return;
      if(!window.confirm('¿Vaciar '+ids.length+' pedido(s) cancelado(s)/entregado(s) de tu lista? Solo se ocultan de tu vista, quedan guardados en el sistema.')) return;
      clearMayBtn.disabled = true;
      const batch = db.batch();
      ids.forEach(function(id){ batch.update(db.collection('pedidos').doc(id), { ocultoMayorista: true }); });
      batch.commit()
        .then(function(){ showToast('Lista de pedidos vaciada'); })
        .catch(function(err){ showToast('Error: ' + err.message); clearMayBtn.disabled = false; });
    });
  }

  const clearProdBtn = main.querySelector('#clearProductorPedidos');
  if(clearProdBtn){
    clearProdBtn.addEventListener('click', function(){
      const ids = S.orders.filter(function(o){
        return o.productorUid === currentUser.uid && !o.ocultoProductor && (o.cancelado || o.statusIdx === STATUSES.length - 1);
      }).map(function(o){ return o.id; });
      if(!ids.length) return;
      if(!window.confirm('¿Vaciar '+ids.length+' pedido(s) cancelado(s)/entregado(s) de tu lista? Solo se ocultan de tu vista, quedan guardados en el sistema.')) return;
      clearProdBtn.disabled = true;
      const batch = db.batch();
      ids.forEach(function(id){ batch.update(db.collection('pedidos').doc(id), { ocultoProductor: true }); });
      batch.commit()
        .then(function(){ showToast('Lista de pedidos vaciada'); })
        .catch(function(err){ showToast('Error: ' + err.message); clearProdBtn.disabled = false; });
    });
  }

  main.querySelectorAll('[data-hide-order-productor]').forEach(function(b){
    b.addEventListener('click', function(){
      if(!window.confirm('¿Quitar este pedido de tu lista? Solo se oculta de tu vista, el registro sigue guardado en el sistema.')) return;
      b.disabled = true;
      guardar(db.collection('pedidos').doc(b.dataset.hideOrderProductor).update({ ocultoProductor: true }))
        .then(function(){ showToast('Pedido quitado de la lista'); })
        .catch(function(err){ showToast('Error: ' + err.message); b.disabled = false; });
    });
  });

  main.querySelectorAll('[data-comprobante-pedido]').forEach(function(b){
    b.addEventListener('click', function(){ descargarComprobante(b.dataset.comprobantePedido, 'pedido'); });
  });

  main.querySelectorAll('[data-comprobante-entrega]').forEach(function(b){
    b.addEventListener('click', function(){ descargarComprobante(b.dataset.comprobanteEntrega, 'entrega'); });
  });

  main.querySelectorAll('[data-project-advance]').forEach(function(b){
    b.addEventListener('click', function(){
      const pr = S.projects.find(function(x){ return x.id === b.dataset.projectAdvance; });
      if(!pr) return;
      b.disabled = true;
      db.collection('proyectos').doc(pr.id).update({ stageIdx: pr.stageIdx + 1 })
        .then(function(){ showToast(pr.name + ' avanzó de etapa'); registrar('Proyecto avanzado', pr.name + ' → ' + PROJECT_STAGES[pr.stageIdx + 1]); })
        .catch(function(err){ showToast('Error: ' + err.message); b.disabled = false; });
    });
  });
  bindExtras(main);
}

/* ============================================================
   ESTADO DE AUTENTICACIÓN
   ============================================================ */
auth.onAuthStateChanged(function(user){
  if(user){
    db.collection('usuarios').doc(user.uid).get().then(function(doc){
      if(!doc.exists){
        auth.signOut();
        return;
      }
      const data = doc.data();
      if(data.suspendido === true){
        avisoSuspension = textoSuspension(data);
        auth.signOut();
        return;
      }
      // Se carga el perfil completo: la dirección y el teléfono viajan con cada pedido.
      currentUser = Object.assign({}, data, { uid: user.uid });
      if(loginManual){ loginManual = false; registrar('Inicio de sesión', currentUser.email || ''); }
      renderHeaderRight();
      renderApp();
      subscribeData();
    }).catch(function(err){
      document.getElementById('appBody').innerHTML = '<div class="loading-state">Error cargando tu cuenta: '+esc(err.message)+'</div>';
    });
  } else {
    currentUser = null;
    unsubscribeData();
    renderHeaderRight();
    renderAuthScreen();
  }
});

/* ============ CAPA FUTURISTA (decorativa, no toca la lógica del sistema) ============ */
(function(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  /* Modo claro / oscuro (se recuerda en el navegador) */
  const themeBtn = document.getElementById('themeToggle');
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  function temaActual(){ return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function sincronizarBotonTema(){
    const oscuro = temaActual() === 'dark';
    const txt = oscuro ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
    themeBtn.setAttribute('aria-label', txt);
    themeBtn.title = txt;
    if(metaTheme) metaTheme.setAttribute('content', oscuro ? '#10170E' : '#FFFDF6');
  }
  function aplicarTema(t, guardar){
    document.documentElement.setAttribute('data-theme', t);
    if(guardar){ try { localStorage.setItem('cc-theme', t); } catch(_){} }
    sincronizarBotonTema();
    if(window.L) refrescarMapaTema();
  }
  sincronizarBotonTema();
  themeBtn.addEventListener('click', function(e){
    const siguiente = temaActual() === 'dark' ? 'light' : 'dark';
    if(!document.startViewTransition || reduceMotion){ aplicarTema(siguiente, true); return; }
    // Transición circular que se expande desde el botón.
    const r = themeBtn.getBoundingClientRect();
    const x = e.clientX || (r.left + r.width/2), y = e.clientY || (r.top + r.height/2);
    const radio = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));
    const vt = document.startViewTransition(function(){ aplicarTema(siguiente, true); });
    vt.ready.then(function(){
      document.documentElement.animate(
        { clipPath: ['circle(0px at '+x+'px '+y+'px)', 'circle('+radio+'px at '+x+'px '+y+'px)'] },
        { duration: 600, easing: 'cubic-bezier(.2,.8,.2,1)', pseudoElement: '::view-transition-new(root)' }
      );
    }).catch(function(){});
  });
  // Si el usuario nunca eligió, se sigue el tema del sistema operativo.
  if(window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const alCambiar = function(ev){
      let elegido = null;
      try { elegido = localStorage.getItem('cc-theme'); } catch(_){}
      if(!elegido) aplicarTema(ev.matches ? 'dark' : 'light', false);
    };
    if(mq.addEventListener) mq.addEventListener('change', alCambiar);
  }

  /* Efecto "ripple" al tocar botones */
  document.addEventListener('pointerdown', function(e){
    if(reduceMotion || !e.target.closest) return;
    const b = e.target.closest('.btn, .add-btn, .filter-btn, .subnav button, .auth-tabs button');
    if(!b || b.disabled) return;
    const r = b.getBoundingClientRect();
    const d = Math.max(r.width, r.height) * 2.2;
    const onda = document.createElement('span');
    onda.className = 'ripple';
    onda.style.width = onda.style.height = d + 'px';
    onda.style.left = (e.clientX - r.left - d/2) + 'px';
    onda.style.top = (e.clientY - r.top - d/2) + 'px';
    b.appendChild(onda);
    setTimeout(function(){ onda.remove(); }, 700);
  });

  /* Atajo: "/" enfoca el buscador del catálogo */
  document.addEventListener('keydown', function(e){
    if(e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    const buscador = document.getElementById('catBuscar');
    if(buscador){ e.preventDefault(); buscador.focus(); buscador.select(); }
  });

  /* Botón "volver arriba" */
  const toTop = document.getElementById('toTop');
  toTop.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }); });

  /* Barra de progreso de scroll */
  const progressBar = document.getElementById('scrollProgress');
  function updateProgress(){
    toTop.classList.toggle('show', window.scrollY > 500);
    if(!progressBar) return;
    const h = document.documentElement.scrollHeight - window.innerHeight;
    const p = h > 0 ? window.scrollY / h : 0;
    progressBar.style.transform = 'scaleX(' + p + ')';
  }
  window.addEventListener('scroll', updateProgress, {passive:true});
  window.addEventListener('resize', updateProgress);
  updateProgress();

  /* Partículas flotantes */
  const pc = document.getElementById('particles');
  if(pc && !reduceMotion){
    const total = window.innerWidth < 700 ? 8 : 16;
    let frag = '';
    for(let i=0; i<total; i++){
      const left = Math.random()*100;
      const dur = 16 + Math.random()*16;
      const delay = -Math.random()*dur;
      const size = 2 + Math.random()*2;
      const op = .18 + Math.random()*.3;
      frag += '<i style="left:'+left.toFixed(2)+'%; bottom:-10px; width:'+size.toFixed(1)+'px; height:'+size.toFixed(1)+'px;'+
              ' opacity:'+op.toFixed(2)+'; animation-duration:'+dur.toFixed(1)+'s; animation-delay:'+delay.toFixed(1)+'s;"></i>';
    }
    pc.innerHTML = frag;
  }

  /* Tilt 3D en tarjetas (se re-aplica porque el sistema re-renderiza) */
  if(finePointer && !reduceMotion){
    function onMove(e){
      const card = e.target.closest ? e.target.closest('.kpi-card, .product-card') : null;
      if(!card) return;
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - .5;
      const py = (e.clientY - r.top) / r.height - .5;
      card.style.transform = 'perspective(900px) rotateX(' + (-py*5).toFixed(2) + 'deg) rotateY(' + (px*7).toFixed(2) + 'deg) translateY(-5px)';
    }
    function onLeave(e){
      const card = e.target.closest ? e.target.closest('.kpi-card, .product-card') : null;
      if(card && !card.contains(e.relatedTarget)) card.style.transform = '';
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseout', onLeave);
  }
})();
</script>
