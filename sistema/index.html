const fotosCargadas = {}, fotosFallidas = {};
function imgFoto(url, clase, alt){
  const f = fotosFallidas[url];
  if(f && Date.now() - f < 90000) return '';      // falló hace poco: no insistir enseguida
  return '<img class="'+clase+(fotosCargadas[url] ? ' ok' : '')+'" src="'+esc(url)+'" data-url="'+esc(url)+'" alt="'+esc(alt)+'" loading="lazy" referrerpolicy="no-referrer" onload="fotoOk(this)" onerror="fotoError(this)">';
}
function fotoOk(img){ fotosCargadas[img.dataset.url] = true; delete fotosFallidas[img.dataset.url]; img.classList.add('ok'); }
function fotoError(img){ fotosFallidas[img.dataset.url] = Date.now(); img.remove(); }
/* Reintento en segundo plano: de a una foto por vez (el servicio gratuito
   limita cuántas genera seguidas). Cuando una queda lista, se muestra. */
let reintentandoFoto = false;
setInterval(function(){
  if(reintentandoFoto || document.hidden || !currentUser) return;
  const pendientes = Object.keys(fotosFallidas).sort(function(a, b){ return fotosFallidas[a] - fotosFallidas[b]; });
  if(!pendientes.length) return;
  const url = pendientes[0];
  reintentandoFoto = true;
  const img = new Image();
  img.referrerPolicy = 'no-referrer';
  img.onload = function(){ reintentandoFoto = false; fotosCargadas[url] = true; delete fotosFallidas[url]; renderMain(); };
  img.onerror = function(){ reintentandoFoto = false; fotosFallidas[url] = Date.now(); };
  img.src = url;
}, 75000);

/* ---------- Historial de precios ----------
   Combina los cambios de precio guardados en el lote con el precio de cada
   pedido realizado sobre él, y termina en el precio de hoy. */
function puntosPrecio(l){
  const pts = [];
  (l.historialPrecios || []).forEach(function(h){ if(h && h.precio > 0 && h.fecha) pts.push({ t: h.fecha, precio: h.precio, tipo: 'cambio' }); });
  S.orders.forEach(function(o){
    if(o.lotId === l.id && !o.cancelado && o.price > 0 && o.createdAt && o.createdAt.toMillis) pts.push({ t: o.createdAt.toMillis(), precio: o.price, tipo: 'pedido', numero: o.numero });
  });
  if(!pts.length && l.createdAt && l.createdAt.toMillis) pts.push({ t: l.createdAt.toMillis(), precio: l.price, tipo: 'cambio' });
  pts.sort(function(a, b){ return a.t - b.t; });
  pts.push({ t: Date.now(), precio: l.price, tipo: 'hoy' });
  return pts;
}
/* Variación del precio actual contra el precio anterior distinto. */
function tendenciaPrecio(l){
  const pts = puntosPrecio(l);
  for(let i = pts.length - 2; i >= 0; i--){
    if(pts[i].precio !== l.price) return (l.price - pts[i].precio) / pts[i].precio * 100;
  }
  return 0;
}
function chipTendencia(v){
  if(!v || Math.abs(v) < 0.5) return '';
  const up = v > 0;
  return '<span class="trend '+(up ? 'up' : 'down')+'" title="Variación contra el precio anterior">'+(up ? '▲' : '▼')+' '+Math.abs(v).toFixed(0)+' %</span>';
}

/* ---------- Stock bajo (productor) ---------- */
function lotesStockBajo(){
  return S.lots.filter(function(l){
    if(l.archivado || l.productorUid !== currentUser.uid) return false;
    const inicial = (l.stockInicial && l.stockInicial > 0) ? l.stockInicial : Math.max(l.stock, 1);
    return l.stock === 0 || l.stock / inicial <= 0.25;
  });
}
function revisarStockBajo(){
  if(!currentUser || currentUser.rol !== 'productor') return;
  const bajos = lotesStockBajo();
  const nuevos = bajos.filter(function(l){ return !avisadosStock[l.id]; });
  Object.keys(avisadosStock).forEach(function(id){ if(!bajos.some(function(l){ return l.id === id; })) delete avisadosStock[id]; });
  nuevos.forEach(function(l){ avisadosStock[l.id] = true; });
  if(nuevos.length){
    showToast('⚠ Stock bajo: ' + nuevos.map(function(l){ return l.name + (l.stock === 0 ? ' (agotado)' : ''); }).join(', ') + '. Reponelo desde Mis publicaciones.');
  }
}

/* ---------- Mensajes del pedido ---------- */
function cerrarChat(){
  if(unsubChat) unsubChat();
  unsubChat = null; chatAbierto = null; chatMsgs = []; chatError = false;
}
function abrirChat(orderId){
  if(chatAbierto === orderId){ cerrarChat(); renderMain(); return; }
  cerrarChat();
  chatAbierto = orderId;
  unsubChat = db.collection('pedidos').doc(orderId).collection('mensajes').orderBy('fecha').onSnapshot(function(snap){
    chatMsgs = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
    chatError = false;
    renderMain();
  }, function(err){
    console.warn('[CitrusCode] Mensajes no disponibles:', err.message);
    chatError = true;
    renderMain();
  });
  renderMain();
  setTimeout(function(){ const i = document.getElementById('chatInput'); if(i) i.focus({ preventScroll: true }); }, 50);
}
function botonChat(o){
  const abierto = chatAbierto === o.id;
  return '<button class="btn btn-ghost btn-sm'+(abierto ? ' abierto' : '')+'" data-chat="'+o.id+'">💬 '+(abierto ? 'Cerrar mensajes' : 'Mensajes')+'</button>';
}
function cajaChat(o, otro){
  if(chatAbierto !== o.id) return '';
  if(chatError){
    return '<div class="chat-box"><div class="chat-aviso">Los mensajes se habilitan cuando se publiquen las reglas nuevas de Firestore.</div></div>';
  }
  const msgs = chatMsgs.length ? chatMsgs.map(function(m){
    const mio = m.autorUid === currentUser.uid;
    let hora = '';
    try { hora = m.fecha && m.fecha.toDate ? m.fecha.toDate().toLocaleString('es-AR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : 'enviando…'; } catch(_){}
    return '<div class="msg'+(mio ? ' mio' : '')+'"><span class="msg-meta">'+(mio ? 'Vos' : esc(m.autorNombre || otro))+' · '+hora+'</span>'+esc(m.texto)+'</div>';
  }).join('') : '<div class="chat-vacio">Todavía no hay mensajes con '+esc(otro)+'.<br>Escribí para coordinar horarios de entrega, calidad o embalaje.</div>';
  return '<div class="chat-box">'+
    '<div class="chat-msgs" id="chatMsgs">'+msgs+'</div>'+
    '<form class="chat-form" data-chat-form="'+o.id+'">'+
      '<input type="text" id="chatInput" maxlength="500" autocomplete="off" placeholder="Escribí un mensaje para '+esc(otro)+'…">'+
      '<button class="btn btn-primary btn-sm" type="submit">Enviar</button>'+
    '</form>'+
  '</div>';
}
function enviarMensaje(orderId, input){
  const texto = input.value.trim().slice(0, 500);
  if(!texto) return;
  input.value = '';
  db.collection('pedidos').doc(orderId).collection('mensajes').add({
    autorUid: currentUser.uid,
    autorNombre: currentUser.entidad || currentUser.nombre,
    rol: currentUser.rol,
    texto: texto,
    fecha: FieldValue.serverTimestamp()
  }).catch(function(err){
    input.value = texto;
    showToast(err.code === 'permission-denied'
      ? 'Firestore rechazó el mensaje: falta publicar las reglas nuevas.'
      : 'No se pudo enviar: ' + err.message);
  });
}

/* ---------- Mapa de recorrido (Leaflet, se carga solo al abrir un mapa) ---------- */
const COORDS_PROV = {
  'Buenos Aires':[-34.92,-57.95], 'CABA':[-34.60,-58.38], 'Catamarca':[-28.47,-65.78], 'Chaco':[-27.45,-58.99],
  'Chubut':[-43.30,-65.10], 'Córdoba':[-31.42,-64.18], 'Corrientes':[-27.47,-58.83], 'Entre Ríos':[-31.73,-60.53],
  'Formosa':[-26.18,-58.17], 'Jujuy':[-24.19,-65.30], 'La Pampa':[-36.62,-64.29], 'La Rioja':[-29.41,-66.86],
  'Mendoza':[-32.89,-68.83], 'Misiones':[-27.37,-55.90], 'Neuquén':[-38.95,-68.06], 'Río Negro':[-40.81,-63.00],
  'Salta':[-24.79,-65.41], 'San Juan':[-31.54,-68.53], 'San Luis':[-33.30,-66.34], 'Santa Cruz':[-51.62,-69.22],
  'Santa Fe':[-31.63,-60.70], 'Santiago del Estero':[-27.79,-64.26], 'Tierra del Fuego':[-54.80,-68.30], 'Tucumán':[-26.82,-65.22]
};
let leafletPromesa = null;
function cargarLeaflet(){
  if(window.L) return Promise.resolve();
  if(leafletPromesa) return leafletPromesa;
  function cargar(tag, attrs){
    return new Promise(function(ok, mal){
      const el = document.createElement(tag);
      Object.keys(attrs).forEach(function(k){ el[k] = attrs[k]; });
      el.onload = function(){ ok(); };
      el.onerror = function(){ mal(new Error('No se pudo cargar el mapa')); };
      document.head.appendChild(el);
    });
  }
  // Se espera también la hoja de estilos: sin ella el mapa se dibuja desarmado.
  leafletPromesa = Promise.all([
    cargar('link', { rel: 'stylesheet', href: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css' }),
    cargar('script', { src: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js' })
  ]).catch(function(err){ leafletPromesa = null; throw err; });
  return leafletPromesa;
}
const provinciaCache = {};
function provinciaDeUsuario(uid){
  if(!uid) return Promise.resolve(null);
  if(provinciaCache[uid] !== undefined) return Promise.resolve(provinciaCache[uid]);
  return db.collection('usuarios').doc(uid).get().then(function(d){
    return (provinciaCache[uid] = d.exists ? (d.data().provincia || null) : null);
  }).catch(function(){ return (provinciaCache[uid] = null); });
}
function provinciaDeDireccion(dir){
  if(!dir) return null;
  const partes = String(dir).split(',');
  const ult = partes[partes.length - 1].trim();
  return COORDS_PROV[ult] ? ult : null;
}
/* Fracción del recorrido según el paso de trazabilidad. */
function avanceRecorrido(o){
  if(o.statusIdx >= 4) return 1;
  return { '-1':0, '0':0.04, '1':0.22, '2':0.62, '3':1 }[String(o.traceIdx)] || 0;
}
function curvaRuta(a, b, n){
  const dx = b[1] - a[1], dy = b[0] - a[0];
  const c = [(a[0] + b[0]) / 2 + dx * 0.18, (a[1] + b[1]) / 2 - dy * 0.18];
  const pts = [];
  for(let i = 0; i <= n; i++){
    const t = i / n, u = 1 - t;
    pts.push([u*u*a[0] + 2*u*t*c[0] + t*t*b[0], u*u*a[1] + 2*u*t*c[1] + t*t*b[1]]);
  }
  return pts;
}
/* Mosaicos de OpenStreetMap (gratis, con atribución). En modo oscuro se
   oscurecen con un filtro CSS sobre la capa, no hace falta otro proveedor. */
function tilesMapa(){
  return L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 18
  });
}
function dibujarMapa(o){
  const destinoProv = provinciaDeDireccion(o.entrega && o.entrega.direccion);
  Promise.all([
    cargarLeaflet(),
    provinciaDeUsuario(o.productorUid),
    destinoProv ? Promise.resolve(destinoProv) : provinciaDeUsuario(o.mayoristaUid)
  ]).then(function(r){
    const el = document.getElementById('mapa-' + o.id);
    if(!el || el._mapa) return;
    const provO = COORDS_PROV[r[1]] ? r[1] : 'Tucumán';
    const provD = COORDS_PROV[r[2]] ? r[2] : 'Buenos Aires';
    const orig = COORDS_PROV[provO];
    let dest = COORDS_PROV[provD];
    if(provO === provD) dest = [orig[0] - 0.3, orig[1] + 0.4];   // misma provincia: se separan un poco
    el.innerHTML = '';
    const mapa = L.map(el, { scrollWheelZoom: false });
    el._mapa = mapa;
    el._tiles = tilesMapa().addTo(mapa);
    const ruta = curvaRuta(orig, dest, 60);
    L.polyline(ruta, { color: '#F2C230', weight: 4, opacity: .85, dashArray: '8 10' }).addTo(mapa);
    const hecho = L.polyline([], { color: '#67B75A', weight: 5, opacity: .95 }).addTo(mapa);
    L.marker(orig, { icon: L.divIcon({ className: 'map-pin', html: '🌿', iconSize: [36, 36] }) })
      .addTo(mapa).bindTooltip('Origen: finca · ' + provO, { direction: 'top', offset: [0, -16] });
    L.marker(dest, { icon: L.divIcon({ className: 'map-pin destino', html: '🏬', iconSize: [36, 36] }) })
      .addTo(mapa).bindTooltip('Destino: depósito · ' + provD, { direction: 'top', offset: [0, -16] });
    const camion = L.marker(ruta[0], { icon: L.divIcon({ className: 'map-truck', html: '<span>🚚</span>', iconSize: [40, 40] }), zIndexOffset: 1000 }).addTo(mapa);
    mapa.fitBounds(L.latLngBounds(ruta).pad(0.3));
    function ubicar(f){
      const i = Math.round(f * (ruta.length - 1));
      camion.setLatLng(ruta[i]);
      hecho.setLatLngs(ruta.slice(0, i + 1));
    }
    el._actualizar = function(ord){ ubicar(avanceRecorrido(ord)); };
    const meta = avanceRecorrido(o);
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(mapaAnimado === o.id || reduce){ ubicar(meta); return; }
    mapaAnimado = o.id;
    const t0 = performance.now(), dur = 1800;
    (function paso(ahora){
      const p = Math.min(1, (ahora - t0) / dur);
      ubicar(meta * (1 - Math.pow(1 - p, 3)));
      if(p < 1 && el.isConnected) requestAnimationFrame(paso);
    })(t0);
  }).catch(function(err){
    const el = document.getElementById('mapa-' + o.id);
    if(el) el.innerHTML = '<div class="map-cargando">No se pudo cargar el mapa: ' + esc(err.message) + '</div>';
  });
}

  mapaAbierto = null;

/* Minúsculas y sin tildes, para que "limon" encuentre "Limón". */
function sinAcentos(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('alt');   // alterna la animación para que la barra de tiempo reinicie
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3200);
}
/* Anima un número entre dos valores, para que se vea el stock bajando. */
function animarNumero(el, desde, hasta, ms){
  if(!el) return;
  if(el._anim) cancelAnimationFrame(el._anim);
  if(desde === hasta){ el.textContent = hasta.toLocaleString('es-AR'); return; }
  const t0 = (window.performance && performance.now) ? performance.now() : Date.now();
  const dur = ms || 420;
  function paso(){
    const ahora = (window.performance && performance.now) ? performance.now() : Date.now();
    const p = Math.min(1, (ahora - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    const v = Math.round(desde + (hasta - desde) * eased);
    el.textContent = v.toLocaleString('es-AR');
    if(p < 1) el._anim = requestAnimationFrame(paso);
    else { el._anim = null; el.textContent = hasta.toLocaleString('es-AR'); }
  }
  el._anim = requestAnimationFrame(paso);
}

/* Muestra cuánto stock quedaría si se confirmara lo que el mayorista tiene en pantalla.
   Es una previsualización: el descuento real ocurre cuando el productor confirma. */
function previsualizarStock(lotId){
  const el = document.querySelector('.stock-num[data-stock-id="'+lotId+'"]');
  if(!el) return;
  const p = lotById(lotId);
  if(!p) return;
  const input = document.querySelector('.qty-input[data-id="'+lotId+'"]');
  const enCarrito = S.cart[lotId] || 0;
  const enPantalla = input ? parseInt(input.value, 10) || 0 : 0;
  const reservado = Math.max(enCarrito, enPantalla);
  const proyectado = Math.max(0, p.stock - reservado);
  const actual = parseInt((el.textContent || '0').replace(/\D/g,''), 10) || p.stock;
  animarNumero(el, actual, proyectado);
  el.classList.toggle('bajando', proyectado < p.stock);
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
}

/* Unidad de un pedido: la guardada al crearlo, o la del lote, o kg por compatibilidad */
function unitOf(o){
  if(o && o.unit) return o.unit;
  const p = o ? lotById(o.lotId) : null;
  return (p && p.unit) ? p.unit : 'kg';
}
function traceStatusIdx(traceIdx){
  if(traceIdx <= 0) return 1;
  if(traceIdx <= 2) return 2;
  if(traceIdx === 3) return 3;
  return 4;
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function mapAuthError(code){
  const m = {
    'auth/email-already-in-use':'Ese correo ya está registrado. Iniciá sesión en su lugar.',
    'auth/invalid-email':'El correo ingresado no es válido.',
    'auth/weak-password':'La contraseña debe tener al menos 6 caracteres.',
    'auth/user-not-found':'No existe una cuenta con ese correo.',
    'auth/wrong-password':'Contraseña incorrecta.',
    'auth/invalid-credential':'Correo o contraseña incorrectos.',
    'auth/too-many-requests':'Demasiados intentos. Probá de nuevo en unos minutos.',
    'auth/missing-email':'Escribí tu correo para poder enviarte el enlace.',
    'auth/invalid-continue-uri':'No se pudo enviar el correo de recuperación. Avisale al equipo de CitrusCode.',
    'permission-denied':'Tu correo no está habilitado para crear una cuenta de administración. Registrate como mayorista o productor, o pedile al responsable del proyecto que agregue tu correo.',
  };
  return m[code] || ('Ocurrió un error: ' + code);
}
function nextOrderNumber(){
  const ref = db.collection('meta').doc('contadorPedidos');
  return db.runTransaction(function(tx){
    return tx.get(ref).then(function(snap){
      const actual = (snap.exists && snap.data().valor) ? snap.data().valor : 8840;
      const next = actual + 1;
      tx.set(ref, { valor: next }, { merge:true });
      return next;
    });
  });
}
function genInvoice(order){
  const cae = Array.from({length:14}, function(){ return Math.floor(Math.random()*10); }).join('');
  return { cae: cae, fecha: new Date().toLocaleDateString('es-AR'), monto: order.qty * order.price };
}

/* ============================================================
   COMPROBANTES DESCARGABLES (PDF) — pedido realizado / entregado
   ============================================================ */
function descargarComprobante(orderId, tipo){
  const o = S.orders.find(function(x){ return x.id === orderId; });
  if(!o){ showToast('No se encontró el pedido'); return; }
  if(typeof window.jspdf === 'undefined'){ showToast('No se pudo cargar el generador de PDF'); return; }
  const p = lotById(o.lotId);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });

  doc.setFillColor(18, 53, 36);
  doc.rect(0, 0, 210, 30, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.text('CitrusCode', 15, 17);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  doc.text(tipo === 'entrega' ? 'Comprobante de entrega' : 'Comprobante de pedido', 15, 24);

  let y = 42;
  doc.setTextColor(21, 32, 24);
  function fila(label, valor){
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
    doc.text(label, 15, y);
    doc.setFont('helvetica', 'normal');
    doc.text(String(valor == null || valor === '' ? '—' : valor), 75, y);
    y += 8;
  }
  function separador(){
    doc.setDrawColor(228, 225, 213);
    doc.line(15, y, 195, y);
    y += 8;
  }

  fila('N° de pedido:', 'CC-' + o.numero);
  fila('Fecha de emisión:', new Date().toLocaleDateString('es-AR') + ' ' + new Date().toLocaleTimeString('es-AR'));
  fila('Estado actual:', STATUSES[o.statusIdx]);
  fila('Emitido para la cuenta:', currentUser.email);
  separador();

  fila('Producto:', p ? p.name : '(producto ya no disponible)');
  fila('Cantidad:', o.qty.toLocaleString('es-AR') + ' ' + unitOf(o));
  fila('Precio unitario:', money(o.price));
  fila('Monto total:', money(o.qty * o.price));
  separador();

  fila('Mayorista:', o.mayoristaNombre);
  fila('Productor:', p ? p.productorNombre : '—');

  if(tipo === 'entrega' && o.invoice){
    separador();
    fila('Fecha de entrega:', o.invoice.fecha);
    fila('CAE (simulado):', o.invoice.cae);
    fila('Monto facturado:', money(o.invoice.monto));
  } else if(tipo === 'entrega' && !o.invoice){
    separador();
    doc.setFont('helvetica', 'italic'); doc.setFontSize(10);
    doc.text('Este pedido todavía no llegó al estado "Entregado".', 15, y);
    y += 8;
  }

  y += 8;
  doc.setDrawColor(232, 135, 30);
  doc.setLineWidth(0.8);
  doc.line(15, y, 195, y);
  y += 8;
  doc.setFont('helvetica', 'italic');
  doc.setFontSize(8);
  doc.setTextColor(91, 107, 96);
  doc.text('Documento generado automáticamente por el sistema CitrusCode con fines de demostración académica.', 15, y);
  doc.text('No constituye un comprobante fiscal válido.', 15, y + 5);

  const nombreArchivo = 'CitrusCode_' + (tipo === 'entrega' ? 'ComprobanteEntrega' : 'ComprobantePedido') + '_CC-' + o.numero + '.pdf';
  doc.save(nombreArchivo);
  showToast('Comprobante descargado');
}

        }).catch(function(err){

          // con un correo que no está habilitado). Deshacemos la cuenta recién creada
          // para no dejar un usuario huérfano sin perfil.
          const u = cred.user;
          const limpiar = u ? u.delete().catch(function(){ return auth.signOut(); }) : Promise.resolve();
          return limpiar.then(function(){ return Promise.reject(err); });
        });
      }).catch(function(err){
        errBox.textContent = mapAuthError(err.code);
        errBox.classList.add('show');
        btn.disabled = false;
      });
    }
  });
}

/* ============================================================
   CARGA DE DATOS EN VIVO (FIRESTORE)
   ============================================================ */
function subscribeData(){
  unsubLotes = db.collection('lotes').orderBy('createdAt','desc').onSnapshot(function(snap){
    S.lots = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    revisarStockBajo();
    renderSubnav(); renderMain();
  }, function(err){ showToast('Error leyendo productos: ' + err.message); });

  unsubPedidos = db.collection('pedidos').orderBy('createdAt','desc').onSnapshot(function(snap){
    S.orders = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    renderSubnav(); renderMain();
  }, function(err){ showToast('Error leyendo pedidos: ' + err.message); });

  // Calificaciones de 1 a 5 estrellas (ranking de proveedores). Si las reglas
  // nuevas todavía no se publicaron, el resto del sistema sigue funcionando.
  unsubCalif = db.collection('calificaciones').onSnapshot(function(snap){
    S.ratings = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    califDisponible = true;
    renderMain();
  }, function(err){
    console.warn('[CitrusCode] Calificaciones no disponibles:', err.message);
    califDisponible = false;
    renderMain();
  });

  if(currentUser.rol === 'admin'){
    // Padrón de usuarios: solo la administración lo necesita.
    unsubUsuarios = db.collection('usuarios').onSnapshot(function(snap){
      S.users = snap.docs.map(function(d){ return Object.assign({uid:d.id}, d.data()); });
      renderSubnav(); renderMain();
    }, function(err){ showToast('Error leyendo usuarios: ' + err.message); });

    // La administración ve todos los proyectos.
    unsubProyectos = db.collection('proyectos').orderBy('createdAt','desc').onSnapshot(function(snap){
      S.projects = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      renderSubnav(); renderMain();
    }, function(err){ showToast('Error leyendo proyectos: ' + err.message); });
  } else if(currentUser.rol === 'productor'){
    // El productor solo ve las solicitudes que él mismo envió.
    unsubProyectos = db.collection('proyectos').where('solicitanteUid','==',currentUser.uid)
      .onSnapshot(function(snap){
        S.projects = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        renderSubnav(); renderMain();
      }, function(err){ showToast('Error leyendo tus solicitudes: ' + err.message); });
  }
}
function unsubscribeData(){
  if(unsubLotes) unsubLotes();
  if(unsubPedidos) unsubPedidos();
  if(unsubProyectos) unsubProyectos();
  if(unsubUsuarios) unsubUsuarios();
  if(unsubCalif) unsubCalif();
  cerrarChat();
  mapaAbierto = mapaAnimado = null; precioSel = null; fotoNueva = null;
  Object.keys(avisadosStock).forEach(function(k){ delete avisadosStock[k]; });
  unsubLotes = unsubPedidos = unsubProyectos = unsubUsuarios = unsubCalif = null;
  editandoLote = null;
  catFilter = prodFilter = itemFilter = 'todos';
  catBusqueda = ''; catOrden = 'recientes';
  S = { lots: [], orders: [], projects: [], users: [], cart: {}, ratings: [] };
}

let ultimaVista = null;   // sección dibujada la última vez (para animar solo al cambiar)
let animTimer = null;
function renderMain(){
  const main = document.getElementById('main');
  if(!main || !currentUser) return;

  // Firestore redibuja la vista cuando llegan datos nuevos: si el usuario estaba
  // escribiendo, le devolvemos el foco y lo que había tipeado.
  const act = document.activeElement;
  let foco = null;
  if(act && act.id && main.contains(act)){
    foco = { id: act.id, tag: act.tagName, value: act.value, s: null, e: null };
    try { foco.s = act.selectionStart; foco.e = act.selectionEnd; } catch(_){}
  }

  // Las animaciones de entrada corren solo al cambiar de sección.
  const clave = currentUser.rol + ':' + view[currentUser.rol];
  if(clave !== ultimaVista){
    // Al cambiar de sección se cierran los mensajes y el mapa abiertos.
    cerrarChat();
    liberarMapa();
    const primera = ultimaVista === null;
    ultimaVista = clave;
    main.classList.remove('animar');
    void main.offsetWidth;
    main.classList.add('animar');
    clearTimeout(animTimer);
    animTimer = setTimeout(function(){ main.classList.remove('animar'); }, 1500);
    if(!primera && window.scrollY > 120) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // El mapa abierto se conserva entre redibujos para no recargarlo con cada dato nuevo.
  let mapaVivo = null;
  if(mapaAbierto){
    const m = document.getElementById('mapa-' + mapaAbierto);
    if(m && m._mapa){ mapaVivo = m; m.remove(); }
  }

  // El perfil es común a los tres roles.
  if(view[currentUser.rol] === 'perfil'){
    main.innerHTML = viewPerfil();
  } else if(view[currentUser.rol] === 'ranking'){
    main.innerHTML = viewRanking();
  } else if(view[currentUser.rol] === 'precios'){
    main.innerHTML = viewPrecios();
  } else if(currentUser.rol === 'mayorista'){
    if(view.mayorista === 'catalogo') main.innerHTML = viewMayoristaCatalogo();
    else if(view.mayorista === 'pedidos') main.innerHTML = viewMayoristaPedidos();
    else if(view.mayorista === 'trazabilidad') main.innerHTML = viewMayoristaTrazabilidad();
    else main.innerHTML = viewMayoristaFacturas();
  } else if(currentUser.rol === 'productor'){
    if(view.productor === 'publicaciones') main.innerHTML = viewProductorPublicaciones();
    else if(view.productor === 'recibidos') main.innerHTML = viewProductorRecibidos();
    else if(view.productor === 'ganancias') main.innerHTML = viewProductorDashboard();
    else if(view.productor === 'medida') main.innerHTML = viewProductorMedida();
    else main.innerHTML = viewProductorTrazabilidad();
  } else {
    if(view.admin === 'dashboard') main.innerHTML = viewAdminDashboard();
    else if(view.admin === 'pedidos') main.innerHTML = viewAdminPedidos();
    else if(view.admin === 'usuarios') main.innerHTML = viewAdminUsuarios();
    else main.innerHTML = viewAdminMedida();
  }
  bindMainEvents();

  if(foco){
    const el = document.getElementById(foco.id);
    if(el && el.tagName === foco.tag){
      if((el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') && !el.readOnly && !el.disabled) el.value = foco.value;
      try { el.focus({ preventScroll: true }); } catch(_){ el.focus(); }
      try { if(foco.s != null) el.setSelectionRange(foco.s, foco.e); } catch(_){}
    }
  }
  if(main.classList.contains('animar')) animarKPIs(main);

  if(mapaAbierto){
    const lugar = document.getElementById('mapa-' + mapaAbierto);
    const ord = S.orders.find(function(x){ return x.id === mapaAbierto; });
    if(mapaVivo && lugar){
      lugar.replaceWith(mapaVivo);
      mapaVivo._mapa.invalidateSize();
      if(ord && mapaVivo._actualizar) mapaVivo._actualizar(ord);
    } else if(lugar && ord){
      dibujarMapa(ord);
    } else if(mapaVivo){
      mapaVivo._mapa.remove();
    }
  } else if(mapaVivo){
    mapaVivo._mapa.remove();
  }
  const cm = document.getElementById('chatMsgs');
  if(cm){ cm.style.scrollBehavior = 'auto'; cm.scrollTop = cm.scrollHeight; cm.style.scrollBehavior = ''; }
}

/* Cuenta ascendente de los números de los KPIs ($ 1.234.567, 45 %, 12). */
function animarKPIs(main){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  main.querySelectorAll('.kpi-value').forEach(function(el){
    const m = el.textContent.match(/^(\D*)([\d.]+)(\D*)$/);
    if(!m) return;
    const fin = parseInt(m[2].replace(/\./g, ''), 10);
    if(!fin) return;
    const t0 = performance.now(), dur = 900;
    function paso(ahora){
      const p = Math.min(1, (ahora - t0) / dur);
      const v = Math.round(fin * (1 - Math.pow(1 - p, 3)));
      el.textContent = m[1] + v.toLocaleString('es-AR') + m[3];
      if(p < 1 && el.isConnected) requestAnimationFrame(paso);
    }
    requestAnimationFrame(paso);
  });
}

/* Punto que "vuela" desde el botón Agregar hasta el carrito flotante. */
function volarAlCarrito(desde){
  if(!desde.animate || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  const a = desde.getBoundingClientRect();
  const fab = document.getElementById('cartFab');
  const destino = (fab && fab.classList.contains('show'))
    ? fab.getBoundingClientRect()
    : { left: window.innerWidth - 150, top: window.innerHeight - 70, width: 40, height: 40 };
  const x0 = a.left + a.width/2, y0 = a.top + a.height/2;
  const x1 = destino.left + 28, y1 = destino.top + destino.height/2;
  const dot = document.createElement('div');
  dot.className = 'fly-dot';
  dot.style.left = x0 + 'px'; dot.style.top = y0 + 'px';
  document.body.appendChild(dot);
  const dx = x1 - x0, dy = y1 - y0;
  dot.animate([
    { transform: 'translate(0,0) scale(1)' },
    { transform: 'translate('+(dx*0.5)+'px,'+(dy*0.5 - 140)+'px) scale(1.25)', offset: 0.45 },
    { transform: 'translate('+dx+'px,'+dy+'px) scale(.4)', opacity: .6 }
  ], { duration: 750, easing: 'cubic-bezier(.5,0,.3,1)' }).onfinish = function(){
    dot.remove();
    const f = document.getElementById('cartFab');
    if(f){ f.classList.remove('bump'); void f.offsetWidth; f.classList.add('bump'); }
  };
}

/* Descarga la tabla del panel como CSV (se abre bien en Excel en español). */
function exportarTablaCSV(boton, nombre){
  const panel = boton.closest('.panel');
  const tabla = panel ? panel.querySelector('table.simple') : null;
  if(!tabla){ showToast('No hay datos para exportar'); return; }
  const filas = Array.from(tabla.querySelectorAll('tr'));
  const titulos = Array.from(filas[0].children).map(function(c){ return c.textContent.trim(); });
  const celda = function(t){ return '"' + t.replace(/"/g, '""') + '"'; };
  const lineas = [];
  filas.forEach(function(tr, i){
    // Se saltean las filas de "todavía no hay…" y las columnas sin título (botones).
    if(tr.children.length !== titulos.length) return;
    const valores = Array.from(tr.children)
      .filter(function(_, j){ return titulos[j] !== ''; })
      .map(function(c){ return celda(c.textContent.replace(/\s+/g, ' ').trim()); });
    lineas.push(valores.join(';'));
  });
  if(lineas.length < 2){ showToast('No hay datos para exportar'); return; }
  const blob = new Blob(['\ufeff' + lineas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'CitrusCode_' + nombre + '_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
  showToast('Exportaste ' + (lineas.length - 1) + ' fila(s) a CSV');
}
/* Guarda (o actualiza) la calificación de un pedido entregado. Una por pedido. */
function guardarCalificacion(orderId, valor, caja){
  const o = S.orders.find(function(x){ return x.id === orderId; });
  if(!o || !(valor >= 1 && valor <= 5)) return;
  const lote = lotById(o.lotId) || S.lots.find(function(l){ return l.productorUid === o.productorUid; });
  const cmt = document.getElementById('cmt-' + orderId);
  const previa = S.ratings.find(function(r){ return r.id === orderId; });
  if(caja){
    // Respuesta visual inmediata, antes de que confirme Firestore.
    caja.querySelectorAll('button').forEach(function(btn){ btn.classList.toggle('on', parseInt(btn.dataset.val, 10) <= valor); });
    caja.classList.remove('pop'); void caja.offsetWidth; caja.classList.add('pop');
  }
  db.collection('calificaciones').doc(o.id).set({
    pedidoId: o.id,
    numero: o.numero || null,
    productorUid: o.productorUid,
    productorNombre: lote ? lote.productorNombre : 'Productor',
    producto: lote ? lote.name : '',
    mayoristaUid: currentUser.uid,
    mayoristaNombre: currentUser.entidad || currentUser.nombre,
    estrellas: valor,
    comentario: cmt ? cmt.value.trim().slice(0, 300) : '',
    fecha: FieldValue.serverTimestamp()
  }).then(function(){
    showToast(caja ? (previa ? 'Actualizaste tu calificación: ' : '¡Gracias! Calificaste con ') + valor + ' estrella' + (valor > 1 ? 's' : '') : 'Comentario guardado');
  }).catch(function(err){
    console.error('[CitrusCode] No se pudo guardar la calificación:', err);
    showToast(err.code === 'permission-denied'
      ? 'Firestore rechazó la calificación: falta publicar las reglas nuevas en la consola de Firebase.'
      : 'No se pudo guardar la calificación: ' + err.message);
    renderMain();
  });
}

/* ============================================================
   VISTA MAYORISTA — CATALOGO
   ============================================================ */
function viewMayoristaCatalogo(){
  const cats = ['todos','limon','naranja','mandarina','pomelo','subproductos'];
  const disponibles = S.lots.filter(function(l){ return !l.archivado; });
  const porCat = catFilter === 'todos' ? disponibles : disponibles.filter(function(l){ return l.cat === catFilter; });

  // Productores con oferta en la categoría elegida. Si el elegido ya no tiene lotes, se resetea.
  const productores = {};
  porCat.forEach(function(l){ productores[l.productorUid] = l.productorNombre; });
  if(prodFilter !== 'todos' && !productores[prodFilter]) prodFilter = 'todos';
  const porProd = prodFilter === 'todos' ? porCat : porCat.filter(function(l){ return l.productorUid === prodFilter; });

  // Productos (por nombre) que ofrece ese productor dentro de la categoría.
  const productos = {};
  porProd.forEach(function(l){ const k = normNombre(l.name); if(!productos[k]) productos[k] = l.name.trim(); });
  if(itemFilter !== 'todos' && !productos[itemFilter]) itemFilter = 'todos';
  let list = itemFilter === 'todos' ? porProd : porProd.filter(function(l){ return normNombre(l.name) === itemFilter; });

  // Búsqueda libre por producto o productor, y orden elegido.
  const q = sinAcentos(catBusqueda.trim());
  if(q) list = list.filter(function(l){ return sinAcentos(l.name + ' ' + l.productorNombre).indexOf(q) !== -1; });
  const ordenes = {
    'precio-asc': function(a, b){ return a.price - b.price; },
    'precio-desc': function(a, b){ return b.price - a.price; },
    'stock-desc': function(a, b){ return b.stock - a.stock; },
    'nombre': function(a, b){ return a.name.localeCompare(b.name, 'es'); }
  };
  const rep = reputacion().porUid;
  ordenes['calificacion'] = function(a, b){
    const ra = rep[a.productorUid], rb = rep[b.productorUid];
    return (rb ? rb.puntaje : -1) - (ra ? ra.puntaje : -1);

  if(ordenes[catOrden]) list = list.slice().sort(ordenes[catOrden]);

    return '<option value="'+esc(o[0])+'"'+(o[0]===itemFilter?' selected':'')+'>'+esc(o[1])+'</option>';
  }).join('');
  const optsOrden = [['recientes','Más recientes'],['precio-asc','Menor precio'],['precio-desc','Mayor precio'],['stock-desc','Mayor stock'],['calificacion','Mejor calificados'],['nombre','Nombre (A-Z)']].map(function(o){
    return '<option value="'+o[0]+'"'+(o[0]===catOrden?' selected':'')+'>'+o[1]+'</option>';

  const cartIds = Object.keys(S.cart).filter(function(id){ return lotById(id); });

      subtotal += lt;
      return '<div class="cart-line"><span>'+esc(p.name)+' — '+q.toLocaleString('es-AR')+' '+p.unit+'</span><span>'+money(lt)+' <button data-remove="'+id+'">Quitar</button></span></div>';
    }).join('');
    cartHtml = lines + '<div class="cart-total"><span>Total del pedido</span><b>'+money(subtotal)+'</b></div>'+
      '<button class="btn btn-primary" style="width:100%; justify-content:center; margin-top:14px;" id="placeOrderBtn">Solicitar pedido mayorista</button>';
  }

  return '<div class="panel">'+
    '<div class="panel-head"><h2>Catálogo mayorista</h2><p>Explorá la oferta de fincas y cooperativas del NOA y armá tu pedido por volumen.</p></div>'+
    '<div class="cat-filters">'+filters+'</div>'+

    '<div class="product-grid">'+cards+'</div>'+
    '<div class="cart-box" id="cartBox"><h4>'+icono('carrito')+'Tu pedido</h4>'+cartHtml+'</div>'+
  '</div>'+
  '<button class="cart-fab'+(cartIds.length ? ' show' : '')+'" id="cartFab" type="button" aria-label="Ver mi pedido">'+
    '<span class="fab-ico">'+icono('carrito')+'<span class="fab-count">'+cartIds.length+'</span></span>'+
    '<span class="fab-total">'+money(subtotal)+'</span>'+
  '</button>';
}

}

/* ============================================================
   VISTA COMÚN — EVOLUCIÓN DE PRECIOS
   ============================================================ */
function graficoPrecios(pts, unidad){
  const W = 760, H = 270, pl = 70, pr = 20, pt = 20, pb = 40;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  let min = Math.min.apply(null, pts.map(function(p){ return p.precio; }));
  let max = Math.max.apply(null, pts.map(function(p){ return p.precio; }));
  if(min === max){ min = min * 0.9; max = max * 1.1; }
  const pad = (max - min) * 0.12; min = Math.max(0, min - pad); max = max + pad;
  const x = function(t){ return t1 === t0 ? pl + (W - pl - pr) / 2 : pl + (t - t0) / (t1 - t0) * (W - pl - pr); };
  const y = function(v){ return pt + (1 - (v - min) / (max - min)) * (H - pt - pb); };
  // Línea en escalera: el precio se mantiene hasta que cambia.
  let d = '';
  pts.forEach(function(p, i){
    if(i === 0){ d += 'M' + x(p.t).toFixed(1) + ' ' + y(p.precio).toFixed(1); return; }
    d += ' H' + x(p.t).toFixed(1) + ' V' + y(p.precio).toFixed(1);
  });
  const area = d + ' V' + (H - pb) + ' H' + x(pts[0].t).toFixed(1) + ' Z';
  let grid = '';
  for(let i = 0; i <= 4; i++){
    const v = min + (max - min) * i / 4;
    grid += '<line class="grid-l" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/>'+
      '<text class="eje" x="'+(pl-10)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end">'+money(v)+'</text>';
  }
  const fmt = function(t){ return new Date(t).toLocaleDateString('es-AR', { day:'2-digit', month:'short' }); };
  const ejeX = '<text class="eje" x="'+pl+'" y="'+(H-12)+'">'+fmt(t0)+'</text>'+
    '<text class="eje" x="'+(W-pr)+'" y="'+(H-12)+'" text-anchor="end">Hoy</text>';
  const puntos = pts.map(function(p){
    if(p.tipo === 'hoy') return '';
    const etiqueta = (p.tipo === 'pedido' ? 'Pedido #CC-' + p.numero : 'Precio publicado') + ' · ' + fmt(p.t) + ' · ' + money(p.precio) + ' / ' + unidad;
    return '<circle class="punto'+(p.tipo === 'pedido' ? ' pedido' : '')+'" cx="'+x(p.t).toFixed(1)+'" cy="'+y(p.precio).toFixed(1)+'" r="5"><title>'+esc(etiqueta)+'</title></circle>';
  }).join('');
  return '<svg class="precio-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de evolución del precio">'+
    '<defs><linearGradient id="gradPrecio" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#67B75A" stop-opacity=".35"/><stop offset="100%" stop-color="#67B75A" stop-opacity="0"/></linearGradient></defs>'+
    grid + '<path class="area" d="'+area+'" fill="url(#gradPrecio)"/>' + '<path class="linea" d="'+d+'"/>' + puntos + ejeX +
  '</svg>';
}
function sparkline(pts){
  if(pts.length < 2) return '';
  const W = 96, H = 28;
  const vals = pts.map(function(p){ return p.precio; });
  let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if(min === max){ min -= 1; max += 1; }
  const d = pts.map(function(p, i){
    return (i ? 'L' : 'M') + (i / (pts.length - 1) * (W - 4) + 2).toFixed(1) + ' ' + (H - 3 - (p.precio - min) / (max - min) * (H - 6)).toFixed(1);
  }).join(' ');
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><path d="'+d+'"/></svg>';
}
function viewPrecios(){
  const esProductor = currentUser.rol === 'productor';

  const vals = pts.map(function(p){ return p.precio; });

  const opciones = lotes.slice().sort(function(a, b){ return a.name.localeCompare(b.name, 'es'); }).map(function(x){
    return '<option value="'+x.id+'"'+(x.id === precioSel ? ' selected' : '')+'>'+esc(x.name)+(esProductor ? '' : ' — '+esc(x.productorNombre))+'</option>';
  }).join('');
  const kpis = '<div class="kpi-grid">'+
    '<div class="kpi-card"><div class="kpi-label">Precio actual</div><div class="kpi-value">'+money(l.price)+'</div><div class="kpi-sub">por '+l.unit+'</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">Mínimo</div><div class="kpi-value">'+money(Math.min.apply(null, vals))+'</div><div class="kpi-sub">en el período</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">Máximo</div><div class="kpi-value">'+money(Math.max.apply(null, vals))+'</div><div class="kpi-sub">en el período</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">Variación</div><div class="kpi-value">'+(variacion > 0 ? '+' : '')+variacion.toFixed(1).replace('.', ',')+' %</div><div class="kpi-sub">desde el primer registro</div></div>'+
  '</div>';
  const grafico = '<div class="chart-card">'+
    '<div style="display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:14px;">'+
      '<h4 style="margin:0;">'+esc(l.name)+(esProductor ? '' : ' <span style="font-weight:500; color:var(--texto-suave); font-size:.82rem;">· '+esc(l.productorNombre)+'</span>')+'</h4>'+

    '</div>'+
    graficoPrecios(pts, l.unit)+
    '<div class="precio-leyenda"><span><i></i>Precio publicado por el productor</span><span><i class="pedido"></i>Precio de un pedido realizado</span>'+
      (reales.length < 2 ? '<span>Todavía hay pocos registros: el historial se completa con cada cambio de precio y cada pedido.</span>' : '')+'</div>'+
  '</div>';
  const filas = lotes.map(function(x){
    const p = puntosPrecio(x);
    return { l: x, pts: p, var: p[0].precio ? (x.price - p[0].precio) / p[0].precio * 100 : 0 };
  }).sort(function(a, b){ return Math.abs(b.var) - Math.abs(a.var); }).map(function(f){
    const v = f.var;
    return '<tr data-precio-ver="'+f.l.id+'" style="cursor:pointer;"'+(f.l.id === precioSel ? ' class="sel"' : '')+'>'+
      '<td>'+esc(f.l.name)+'</td>'+(esProductor ? '' : '<td>'+esc(f.l.productorNombre)+'</td>')+
      '<td>'+money(f.l.price)+' / '+f.l.unit+'</td>'+
      '<td>'+(Math.abs(v) < 0.5 ? '<span style="color:var(--texto-suave);">sin cambios</span>' : '<b style="color:'+(v > 0 ? 'var(--c-naranja)' : 'var(--acento)')+';">'+(v > 0 ? '▲ +' : '▼ ')+v.toFixed(1).replace('.', ',')+' %</b>')+'</td>'+
      '<td>'+sparkline(f.pts)+'</td>'+
    '</tr>';
  }).join('');
  const tabla = '<h3 style="font-size:1.05rem; margin:6px 0 14px;">Todos los productos</h3>'+

  return '<div class="panel">'+head+kpis+grafico+tabla+'</div>';
}

      '<td>'+l.stock.toLocaleString('es-AR')+' '+l.unit+'</td>'+
      '<td>'+l.min.toLocaleString('es-AR')+' '+l.unit+'</td>'+
      '<td style="text-align:right; white-space:nowrap;">'+
        '<button class="btn btn-ghost btn-sm" data-edit-lot="'+l.id+'">✎ Editar</button> '+
        '<button class="btn btn-ghost btn-sm cancel-btn" data-delete-lot="'+l.id+'">🗑 Eliminar</button>'+
      '</td></tr>';
  }).join('') : '<tr><td colspan="6" style="text-align:center; color:var(--texto-suave);">Todavía no publicaste productos.</td></tr>';

  const lote = editandoLote ? mine.find(function(l){ return l.id === editandoLote; }) : null;
  if(editandoLote && !lote) editandoLote = null;   // lo borraron mientras editábamos
  const editando = !!lote;
  const v = function(campo, def){ return editando ? String(lote[campo] != null ? lote[campo] : '') : (def || ''); };
  const sel = function(campo, valor){ return (editando && lote[campo] === valor) ? ' selected' : ''; };
  // Cartel de stock en vivo: se redibuja solo cada vez que Firestore avisa un cambio.
  let stockPanel = '';
  if(mine.length){
    const items = mine.map(function(l){
      const inicial = (l.stockInicial && l.stockInicial > 0) ? l.stockInicial : Math.max(l.stock, 1);
      const pct = Math.max(0, Math.min(100, Math.round((l.stock / inicial) * 100)));
      const estado = l.stock === 0 ? ' agotado' : (pct <= 25 ? ' bajo' : '');
      return '<div class="sl-item'+estado+'">'+
        '<div class="sl-name">'+esc(l.name)+'</div>'+
        '<div class="sl-val">'+l.stock.toLocaleString('es-AR')+' <small>'+l.unit+'</small></div>'+
        '<div class="sl-bar"><span style="width:'+pct+'%;"></span></div>'+
      '</div>';
    }).join('');
    stockPanel = '<div class="stock-live">'+
      '<h4><span class="live-dot"></span>Stock disponible en tiempo real</h4>'+
      '<p class="sl-sub">Se actualiza solo, sin recargar la página, cada vez que confirmás un pedido.</p>'+
      '<div class="stock-live-grid">'+items+'</div>'+
    '</div>';
  }

  return '<div class="panel">'+
    '<div class="panel-head split"><div><h2>Mis publicaciones</h2><p>Productos que publicaste en el marketplace mayorista de CitrusCode.</p></div>'+(mine.length ? botonExportar('Publicaciones') : '')+'</div>'+
    alertaStockBajo()+
    stockPanel+
    '<div class="form-card"'+(editando ? ' style="border-color:var(--limon); border-left:3px solid var(--limon);"' : '')+'>'+
      '<h4 style="margin-bottom:'+(editando?'6':'14')+'px; font-size:.98rem;">'+(editando ? '✎ Editando: '+esc(lote.name) : 'Publicar nuevo lote')+'</h4>'+
      (editando ? '<p style="font-size:.8rem; color:var(--texto-suave); margin-bottom:14px;">Podés corregir el precio o reponer el stock. Los cambios se ven al instante en el catálogo de los mayoristas.</p>' : '')+
      bloqueFoto(editando ? lote : null)+
      '<div class="form-grid">'+
        '<div class="form-row"><label>Nombre del producto</label><input type="text" id="newLotName" placeholder="Ej: Limón Fino 95" value="'+esc(v('name'))+'"></div>'+
        '<div class="form-row"><label>Categoría</label><select id="newLotCat">'+
          '<option value="limon"'+sel('cat','limon')+'>Limón</option>'+
          '<option value="naranja"'+sel('cat','naranja')+'>Naranja</option>'+
          '<option value="mandarina"'+sel('cat','mandarina')+'>Mandarina</option>'+
          '<option value="pomelo"'+sel('cat','pomelo')+'>Pomelo</option>'+
          '<option value="subproductos"'+sel('cat','subproductos')+'>Subproductos (jugo, aceite, etc.)</option>'+
        '</select></div>'+
        '<div class="form-row"><label>Unidad de venta</label><select id="newLotUnit">'+
          '<option value="kg"'+sel('unit','kg')+'>Kilogramos (kg)</option>'+
          '<option value="L"'+sel('unit','L')+'>Litros (L)</option>'+
        '</select></div>'+
        '<div class="form-row"><label>Precio por unidad (ARS)</label><input type="number" id="newLotPrice" placeholder="Ej: 700" value="'+esc(v('price'))+'"></div>'+
        '<div class="form-row"><label>Stock disponible'+(editando ? ' <span style="color:var(--acento); font-weight:700;">(subilo para reponer)</span>' : '')+'</label><input type="number" id="newLotStock" placeholder="Ej: 2000" value="'+esc(v('stock'))+'"></div>'+
        '<div class="form-row"><label>Pedido mínimo</label><input type="number" id="newLotMin" placeholder="Ej: 300" value="'+esc(v('min'))+'"></div>'+
      '</div>'+
      (editando
        ? '<div class="order-actions" style="margin-top:16px;">'+
            '<button class="btn btn-primary btn-sm" id="saveLotBtn">Guardar cambios</button>'+
            '<button class="btn btn-ghost btn-sm" id="cancelEditBtn">Cancelar</button>'+
          '</div>'
        : '<button class="btn btn-primary btn-sm" id="addLotBtn" style="margin-top:16px;">Publicar producto</button>')+
    '</div>'+
    '<table class="simple"><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Pedido mínimo</th><th></th></tr>'+rows+'</table>'+
  '</div>';
}

/* Aviso de publicaciones con stock bajo o agotado. */
function alertaStockBajo(){
  const bajos = lotesStockBajo();
  if(!bajos.length) return '';
  return '<div class="alerta-stock">'+icono('info')+'<div>'+
    '<b>'+(bajos.length === 1 ? 'Una publicación tiene' : bajos.length + ' publicaciones tienen')+' stock bajo</b>'+
    '<div class="alerta-lista">'+bajos.map(function(l){
      const inicial = (l.stockInicial && l.stockInicial > 0) ? l.stockInicial : Math.max(l.stock, 1);
      return '<button data-edit-lot="'+l.id+'">'+esc(l.name)+' <em>'+(l.stock === 0 ? 'agotado' : Math.round(l.stock / inicial * 100) + ' %')+'</em> · Reponer</button>';
    }).join('')+'</div>'+
  '</div></div>';
}

/* ============================================================
   VISTA PRODUCTOR — PEDIDOS RECIBIDOS
   ============================================================ */
function viewProductorRecibidos(){
  const received = S.orders.filter(function(o){ return o.productorUid === currentUser.uid && !o.ocultoProductor; });
  if(!received.length){
    return '<div class="panel"><div class="panel-head"><h2>Pedidos recibidos</h2></div><div class="empty-state"><div class="ee-icon">📥</div>Todavía no llegaron pedidos.</div></div>';
  }
  const limpiablesCount = received.filter(function(o){ return o.cancelado || (o.statusIdx === STATUSES.length - 1); }).length;
  const headBtn = limpiablesCount ? '<button class="btn btn-ghost btn-sm" id="clearProductorPedidos">🧹 Vaciar cancelados y entregados</button>' : '';
  const cards = received.map(function(o){
    const p = lotById(o.lotId);
    let actions = '';
    if(o.cancelado){
      actions = '<div class="order-meta" style="color:var(--rojo); font-weight:600;">✕ Este pedido fue cancelado.</div>';
    } else if(o.statusIdx === 0){
      actions = '<div class="order-actions"><button class="btn btn-primary btn-sm" data-confirm="'+o.id+'">Confirmar pedido</button></div>';
    } else if(o.statusIdx < 4){
      actions = '<div class="order-actions"><button class="btn btn-ghost btn-sm" data-advance="'+o.id+'">Avanzar trazabilidad → '+TRACE_LABELS[o.traceIdx+1]+'</button></div>';
    } else {
      actions = '<div class="order-meta">✓ Pedido entregado y facturado.</div>';
      const calif = S.ratings.find(function(r){ return r.id === o.id; });
      if(calif){
        actions += '<div class="rate-recibida"><b>El comprador te calificó</b> '+estrellas(calif.estrellas)+
          (calif.comentario ? '<q>'+esc(calif.comentario)+'</q>' : '')+'</div>';
      }
    }
    const puedeCancelar = !o.cancelado && o.statusIdx === 0;  // solo mientras el productor no lo confirmó
    const entregado = !o.cancelado && o.statusIdx === STATUSES.length - 1;
    const puedeQuitar = o.cancelado || entregado;
    const statusBlock = o.cancelado
      ? '<span class="status-badge st-cancel">Cancelado</span>'
      : '<span class="status-badge st-'+o.statusIdx+'">'+STATUSES[o.statusIdx]+'</span>';
    const comprobantes = '<div class="order-actions">'+
      (puedeCancelar ? '<button class="btn btn-ghost btn-sm cancel-btn" data-cancel-order="'+o.id+'">✕ Cancelar pedido</button>' : '')+
      '<button class="btn btn-ghost btn-sm" data-comprobante-pedido="'+o.id+'">📄 Comprobante de pedido</button>'+
      (o.invoice ? '<button class="btn btn-ghost btn-sm" data-comprobante-entrega="'+o.id+'">📄 Comprobante de entrega</button>' : '')+
      botonChat(o)+
      (puedeQuitar ? '<button class="btn btn-ghost btn-sm cancel-btn" data-hide-order-productor="'+o.id+'">🗑 Quitar de la lista</button>' : '')+
    '</div>'+
    cajaChat(o, o.mayoristaNombre || 'el comprador');
    const e = o.entrega || {};
    const envio = (e.direccion || e.telefono)
      ? '<div class="envio-box">'+
          '<b>📍 Enviar a</b>'+
          (e.direccion ? '<div>'+esc(e.direccion)+'</div>' : '')+
          '<div class="envio-meta">'+
            (e.contacto ? esc(e.contacto) : '')+
            (e.telefono ? ' · Tel. '+esc(e.telefono) : '')+
            (e.dni ? ' · DNI/CUIT '+esc(e.dni) : '')+
          '</div>'+
        '</div>'
      : '<div class="envio-box envio-falta">📍 Este comprador se registró antes de que pidiéramos la dirección. Contactalo para coordinar la entrega.</div>';

    return '<div class="order-card">'+
      '<div class="order-top">'+
        '<div><div class="oid">Pedido #CC-'+o.numero+'</div><div class="osub">'+esc(p ? p.name : '—')+' · '+o.qty.toLocaleString('es-AR')+' '+unitOf(o)+' · Comprador: '+esc(o.mayoristaNombre)+'</div></div>'+
        statusBlock+
      '</div>'+
      (o.cancelado ? '' : envio)+
      (o.cancelado ? '' : orderStepper(o))+actions+comprobantes+
    '</div>';
  }).join('');
  return '<div class="panel"><div class="panel-head" style="display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:12px;"><div><h2>Pedidos recibidos</h2><p>Confirmá los pedidos entrantes y actualizá la trazabilidad a medida que avanza la cosecha.</p></div>'+headBtn+'</div>'+cards+'</div>';
}

/* ============================================================
   VISTA PRODUCTOR — TRAZABILIDAD
   ============================================================ */
function viewProductorTrazabilidad(){
  const active = S.orders.filter(function(o){ return o.productorUid === currentUser.uid && !o.cancelado && o.statusIdx > 0 && o.statusIdx < 4; });
  if(!active.length){
    return '<div class="panel"><div class="panel-head"><h2>Trazabilidad de lotes</h2></div><div class="empty-state"><div class="ee-icon">📍</div>No hay lotes en tránsito en este momento.</div></div>';
  }
  const cards = active.map(function(o){
    const p = lotById(o.lotId);
    const qrCells = Array.from({length:49}, function(_, i){
      const on = ((i*97+o.numero) % 100) < 45;
      return '<div style="opacity:'+(on?1:0)+'"></div>';
    }).join('');
    const stepsHtml = TRACE_LABELS.map(function(l, i){
      const done = i <= o.traceIdx;
      return '<div style="display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:.82rem; color:'+(done?'var(--texto)':'var(--texto-suave)')+';">'+
        '<span style="width:8px;height:8px;border-radius:50%;background:'+(done?'var(--neon)':'var(--borde)')+';"></span>'+l+(done?' ✓':'')+

      '<div class="qr-mini">'+qrCells+'</div>'+
      '<div>'+
        '<b style="color:var(--texto); display:block; margin-bottom:6px;">Lote #CC-'+o.numero+' — '+esc(p ? p.name : '—')+'</b>'+
        stepsHtml+
        botonMapa(o)+
      '</div>'+
      cajaMapa(o)+

  }).join('');
  return '<div class="panel"><div class="panel-head"><h2>Trazabilidad de lotes</h2><p>Cada lote en camino muestra su código QR y el estado de la cadena de trazabilidad, desde la cosecha hasta la entrega.</p></div>'+cards+'</div>';
}

/* ============================================================
   VISTA PRODUCTOR — DASHBOARD DE GANANCIAS
   ============================================================ */
function viewProductorDashboard(){
  const mios = S.orders.filter(function(o){ return o.productorUid === currentUser.uid && !o.cancelado; });
  const entregados = mios.filter(function(o){ return o.statusIdx === 4; });
  const enCurso = mios.filter(function(o){ return o.statusIdx > 0 && o.statusIdx < 4; });
  const pendientes = mios.filter(function(o){ return o.statusIdx === 0; });
  const monto = function(list){ return list.reduce(function(a,o){ return a + o.qty*o.price; }, 0); };

  const cobrado = monto(entregados);
  const porCobrar = monto(enCurso);
  const potencial = monto(pendientes);
  const ticket = mios.length ? Math.round(monto(mios) / mios.length) : 0;

  const kpis = '<div class="kpi-grid">'+
    '<div class="kpi-card"><div class="kpi-label">Facturado (entregado)</div><div class="kpi-value">'+money(cobrado)+'</div><div class="kpi-sub">'+entregados.length+' pedido(s) completado(s)</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">Por cobrar (en curso)</div><div class="kpi-value">'+money(porCobrar)+'</div><div class="kpi-sub">'+enCurso.length+' en preparación o tránsito</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">A confirmar</div><div class="kpi-value">'+money(potencial)+'</div><div class="kpi-sub">'+pendientes.length+' esperando tu confirmación</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">Ticket promedio</div><div class="kpi-value">'+money(ticket)+'</div><div class="kpi-sub">sobre '+mios.length+' pedido(s)</div></div>'+
  '</div>';

  // Ingresos por producto
  const porProducto = {};
  mios.forEach(function(o){
    const p = lotById(o.lotId);
    const nombre = p ? p.name : '(producto eliminado)';
    if(!porProducto[nombre]) porProducto[nombre] = { total:0, qty:0, unit: unitOf(o) };
    porProducto[nombre].total += o.qty*o.price;
    porProducto[nombre].qty += o.qty;
  });
  const nombres = Object.keys(porProducto);
  const maxTotal = nombres.reduce(function(m,n){ return Math.max(m, porProducto[n].total); }, 0);

  let grafico;
  if(!nombres.length){
    grafico = '<div class="empty-state"><div class="ee-icon">📊</div>Todavía no recibiste pedidos.<br>Cuando lleguen, vas a ver acá cuánto genera cada producto.</div>';
  } else {
    const filas = nombres.map(function(n){
      const d = porProducto[n];
      const pct = maxTotal ? Math.round(d.total/maxTotal*100) : 0;
      return '<div class="rank-row">'+
        '<div class="rank-top"><span class="rank-name">'+esc(n)+'</span><span class="rank-val">'+money(d.total)+'</span></div>'+
        '<div class="rank-bar"><span style="width:'+pct+'%;"></span></div>'+
        '<div class="rank-sub">'+d.qty.toLocaleString('es-AR')+' '+d.unit+' vendidos</div>'+
      '</div>';
    }).join('');
    grafico = '<div class="chart-card"><h4>Ingresos por producto</h4>'+filas+'</div>';
  }

  return '<div class="panel">'+
    '<div class="panel-head"><h2>Mis ganancias</h2><p>Resumen económico de los pedidos que recibiste. Los montos excluyen los pedidos cancelados.</p></div>'+
    kpis + grafico +
  '</div>';
}

/* ============================================================
   VISTA ADMIN — DASHBOARD
   ============================================================ */
function viewAdminDashboard(){
  const canceladosCount = S.orders.filter(function(o){ return o.cancelado; }).length;
  const ordersActivas = S.orders.filter(function(o){ return !o.cancelado; });
  const totalOrders = ordersActivas.length;
  const gmv = ordersActivas.reduce(function(a,o){ return a + o.qty*o.price; }, 0);
  const entregados = ordersActivas.filter(function(o){ return o.statusIdx===4; }).length;
  const pctTraza = totalOrders ? Math.round(entregados/totalOrders*100) : 0;
  const productores = new Set(S.lots.map(function(l){ return l.productorUid; })).size;

  const counts = STATUSES.map(function(s, i){ return ordersActivas.filter(function(o){ return o.statusIdx===i; }).length; });
  const maxC = Math.max.apply(null, counts.concat([1]));
  const colors = ['#C2761C','#2F6FA8','#7A5EA8','#B08A1E','#2E7D3E'];
  const bars = counts.map(function(c, i){
    const h = Math.max(6, Math.round((c/maxC)*130));
    return '<div class="bar-col"><div class="bar-val">'+c+'</div><div class="bar" style="height:'+h+'px; background:'+colors[i]+';"></div><div class="bar-label">'+STATUSES[i]+'</div></div>';
  }).join('');

  return '<div class="panel">'+
    '<div class="panel-head"><h2>Dashboard de operaciones</h2><p>Vista consolidada del marketplace: pedidos, volumen comercializado y trazabilidad.</p></div>'+
    '<div class="kpi-grid">'+
      '<div class="kpi-card"><div class="kpi-label">GMV total</div><div class="kpi-value">'+money(gmv)+'</div><div class="kpi-sub">'+totalOrders+' pedidos totales</div></div>'+
      '<div class="kpi-card"><div class="kpi-label">Pedidos activos</div><div class="kpi-value">'+(totalOrders-entregados)+'</div><div class="kpi-sub">'+(canceladosCount ? canceladosCount + ' cancelado(s) no incluido(s)' : 'en curso ahora mismo')+'</div></div>'+
      '<div class="kpi-card"><div class="kpi-label">Trazabilidad completa</div><div class="kpi-value">'+pctTraza+'%</div><div class="kpi-sub">'+entregados+' de '+totalOrders+' entregados</div></div>'+
      '<div class="kpi-card"><div class="kpi-label">Productores activos</div><div class="kpi-value">'+productores+'</div><div class="kpi-sub">publicando en el marketplace</div></div>'+
    '</div>'+
    '<div class="chart-card"><h4>Pedidos por estado</h4><div class="bar-chart">'+bars+'</div></div>'+
  '</div>';
}
