<style>
  :root{
    color-scheme: light;
    --verde-oscuro:#22301E;
    --verde:#2E7D3E;
    --verde-med:#2E7D3E;
    --verde-claro:#67B75A;
    --limon:#F2C230;
    --limon-claro:#FBE38A;
    --lima:#DCEFA6;
    --neon:#2E7D3E;
    --cian:#67B75A;
    --naranja:#E09415;
    --azul:#2F6FA8;
    --morado:#7A5EA8;
    --rojo:#C64A38;
    --crema:#FFFDF6;
    --crema-2:#FDF7E3;
    --blanco:#FFFFFF;
    --texto:#22301E;
    --texto-suave:#6E7C60;
    --borde:#EDE3C6;
    --sombra: 0 1px 2px rgba(34,48,30,.05), 0 6px 18px rgba(34,48,30,.06);
    --sombra-fuerte: 0 4px 12px rgba(34,48,30,.08), 0 16px 40px rgba(34,48,30,.10);
    --glow: 0 0 0 3px rgba(242,194,48,.28);
    --easing: cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter','Segoe UI',system-ui,sans-serif; color:var(--texto); background:var(--crema); line-height:1.55;}
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:9999; opacity:.02; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  h1,h2,h3,h4{font-family:'Poppins','Segoe UI',system-ui,sans-serif; font-weight:700; letter-spacing:-.01em;}
  button{font-family:inherit; cursor:pointer;}
  ul{list-style:none;}
  input,select{font-family:inherit;}

  header{
    position:sticky; top:0; z-index:50; background:var(--verde-oscuro); color:#fff;
    padding:14px 28px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    box-shadow:var(--sombra-fuerte);
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.1rem;}
  .brand .mark{width:32px; height:32px; border-radius:9px; box-shadow:0 4px 10px rgba(0,0,0,.18); flex-shrink:0; transition:transform .35s var(--easing);}
  .brand:hover .mark{transform:rotate(-8deg) scale(1.06);}
  .brand .sub{font-size:.72rem; font-weight:500; color:var(--lima); letter-spacing:.04em; text-transform:uppercase; margin-left:8px;}
  .back-link{display:flex; align-items:center; gap:6px; color:#fff; opacity:.85; font-size:.8rem; font-weight:600; padding:7px 12px; border-radius:20px; border:1px solid rgba(255,255,255,.22); transition:.25s; flex-shrink:0;}
  .back-link:hover{opacity:1; background:rgba(255,255,255,.1);}
  .header-left{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .header-right{display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:flex-end;}
  .acc-pill{display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); padding:6px 8px 6px 14px; border-radius:30px; font-size:.78rem;}
  .acc-pill .acc-name{font-weight:700;}
  .acc-pill .acc-role{background:rgba(255,255,255,.18); padding:3px 10px; border-radius:20px; font-size:.68rem; text-transform:uppercase; letter-spacing:.03em;}
  .logout-btn{background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.25); padding:7px 14px; border-radius:30px; font-size:.76rem; font-weight:600; transition:.25s;}
  .logout-btn:hover{background:var(--naranja); border-color:var(--naranja);}
  .live-pill{display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); padding:6px 12px; border-radius:30px; font-size:.72rem; font-weight:600;}
  .live-pill .dotpulse{width:7px; height:7px; border-radius:50%; background:var(--verde-claro); animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .info-banner{
    background:#EAF6EC; border-bottom:1px solid var(--lima); color:var(--verde-oscuro); font-size:.85rem;
    padding:12px 28px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  }
  .info-banner p{max-width:900px;}
  .info-banner button{background:transparent; border:1px solid var(--verde-med); color:var(--verde-oscuro); padding:5px 12px; border-radius:20px; font-size:.76rem; font-weight:600; flex-shrink:0;}

  .subnav{display:flex; gap:8px; padding:20px 28px 0; max-width:1240px; margin:0 auto; flex-wrap:wrap;}
  .subnav button{
    padding:9px 18px; border-radius:30px; border:1px solid var(--borde); background:var(--blanco); font-size:.84rem;
    font-weight:600; color:var(--texto-suave); transition:.25s; position:relative;
  }
  .subnav button:hover{border-color:var(--verde-med);}
  .subnav button.active{background:var(--verde-oscuro); color:#fff; border-color:var(--verde-oscuro);}
  .subnav button .badge{
    background:var(--naranja); color:#fff; font-size:.66rem; font-weight:700; border-radius:10px; padding:1px 6px; margin-left:6px;
  }

  main{max-width:1240px; margin:0 auto; padding:24px 28px 80px;}
  .panel{animation:fadein .4s var(--easing);}
  @keyframes fadein{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

  .panel-head{margin-bottom:22px;}
  .panel-head h2{font-size:1.7rem; letter-spacing:-.015em; color:var(--verde-oscuro); margin-bottom:6px;}
  .panel-head p{color:var(--texto-suave); font-size:.92rem;}

  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px;}
  .kpi-card{background:var(--blanco); border:1px solid var(--borde); border-radius:16px; padding:20px; box-shadow:var(--sombra); transition:transform .3s var(--easing), box-shadow .3s; animation:kpiPop .5s var(--easing) backwards;}
  .kpi-card:hover{transform:translateY(-4px); box-shadow:var(--sombra-fuerte);}
  .kpi-card:nth-child(1){animation-delay:.03s;}
  .kpi-card:nth-child(2){animation-delay:.09s;}
  .kpi-card:nth-child(3){animation-delay:.15s;}
  .kpi-card:nth-child(4){animation-delay:.21s;}
  @keyframes kpiPop{from{opacity:0; transform:translateY(14px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);}}
  .kpi-card .kpi-label{font-size:.76rem; color:var(--texto-suave); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px;}
  .kpi-card .kpi-value{font-size:1.9rem; font-weight:800; color:var(--verde-oscuro); letter-spacing:-.01em;}
  .kpi-card .kpi-sub{font-size:.74rem; color:var(--verde-med); margin-top:4px;}

  .chart-card{background:var(--blanco); border:1px solid var(--borde); border-radius:16px; padding:24px; margin-bottom:24px; transition:box-shadow .3s;}
  .chart-card:hover{box-shadow:var(--sombra);}
  .chart-card h4{font-size:.95rem; color:var(--verde-oscuro); margin-bottom:18px;}
  .bar-chart{display:flex; align-items:flex-end; gap:18px; height:160px; padding-top:10px;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:8px;}
  .bar-col .bar{width:100%; max-width:52px; border-radius:8px 8px 0 0; transition:height .6s var(--easing); min-height:4px;}
  .bar-col .bar-val{font-weight:700; font-size:.82rem; color:var(--verde-oscuro);}
  .bar-col .bar-label{font-size:.68rem; color:var(--texto-suave); text-align:center;}

  .cat-filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .filter-btn{padding:8px 16px; border-radius:30px; border:1px solid var(--borde); background:var(--blanco); font-size:.8rem; font-weight:600; color:var(--texto-suave); transition:.25s;}
  .filter-btn.active{background:var(--verde-oscuro); color:#fff; border-color:var(--verde-oscuro);}
  .product-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px;}
  .product-card{background:var(--blanco); border:1px solid var(--borde); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; transition:.3s;}
  .product-card:hover{transform:translateY(-4px); box-shadow:var(--sombra);}
  .product-visual{height:100px; display:flex; align-items:center; justify-content:center; position:relative;}
  .product-visual .badge-cat{position:absolute; top:8px; left:8px; background:rgba(255,255,255,.85); color:var(--verde-oscuro); font-size:.62rem; font-weight:700; padding:3px 8px; border-radius:20px; text-transform:uppercase;}
  .product-info{padding:14px 16px 16px; display:flex; flex-direction:column; flex:1;}
  .product-info h4{font-size:.9rem; color:var(--verde-oscuro); margin-bottom:2px;}
  .product-info .origin{font-size:.7rem; color:var(--texto-suave); margin-bottom:8px;}
  .product-price{font-weight:700; color:var(--verde-oscuro); font-size:1rem; margin-bottom:2px;}
  .product-stock{font-size:.68rem; color:var(--texto-suave); margin-bottom:10px;}
  .qty-row{display:flex; align-items:center; gap:8px; margin-top:auto;}
  .qty-stepper{display:flex; align-items:center; border:1px solid var(--borde); border-radius:30px; overflow:hidden;}
  .qty-stepper button{width:24px; height:26px; background:var(--crema-2); border:none; font-size:.9rem; color:var(--verde-oscuro); font-weight:700;}
  .qty-stepper input{width:36px; text-align:center; border:none; font-size:.75rem; font-weight:700; color:var(--verde-oscuro); background:transparent;}
  .add-btn{flex:1; background:var(--verde-oscuro); color:#fff; border:none; border-radius:30px; padding:7px 8px; font-size:.72rem; font-weight:600; transition:.25s;}
  .add-btn:hover{background:var(--naranja);}
  .add-btn.added{background:var(--verde-med);}

  .cart-box{background:var(--blanco); border:1.5px solid var(--verde-med); border-radius:16px; padding:20px; margin-top:24px;}
  .cart-box h4{font-size:1rem; color:var(--verde-oscuro); margin-bottom:14px;}
  .cart-line{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--crema-2); font-size:.85rem;}
  .cart-line button{background:none; border:none; color:var(--rojo); font-size:.74rem; font-weight:600;}
  .cart-total{display:flex; justify-content:space-between; align-items:center; padding-top:14px; margin-top:6px;}
  .cart-total b{font-size:1.2rem; color:var(--verde-oscuro);}
  .empty-hint{color:var(--texto-suave); font-size:.85rem; text-align:center; padding:30px;}

  .btn{padding:11px 22px; border-radius:30px; font-weight:600; font-size:.86rem; border:none; transition:transform .25s var(--easing), box-shadow .25s, background .25s; display:inline-flex; align-items:center; gap:6px;}
  .btn-primary{background:var(--verde-oscuro); color:#fff; position:relative; overflow:hidden;}
  .btn-primary::before{content:''; position:absolute; top:0; left:-60%; width:45%; height:100%; background:linear-gradient(120deg, transparent, rgba(255,255,255,.35), transparent); transform:skewX(-20deg); transition:left .55s var(--easing); pointer-events:none;}
  .btn-primary:hover::before{left:130%;}
  .btn-primary:hover{background:var(--naranja); transform:translateY(-2px); box-shadow:0 10px 20px rgba(232,135,30,.28);}
  .btn-primary:disabled{background:var(--borde); color:var(--texto-suave); cursor:not-allowed; transform:none; box-shadow:none;}
  .btn-ghost{background:transparent; border:1.5px solid var(--borde); color:var(--verde-oscuro);}
  .btn-ghost:hover{border-color:var(--verde-oscuro); transform:translateY(-2px);}
  .btn-sm{padding:7px 14px; font-size:.76rem;}

  .order-card{background:var(--blanco); border:1px solid var(--borde); border-radius:16px; padding:20px 22px; margin-bottom:16px; transition:box-shadow .3s, transform .3s var(--easing);}
  .order-card:hover{box-shadow:var(--sombra); transform:translateY(-2px);}
  .order-top{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
  .order-top .oid{font-weight:700; color:var(--verde-oscuro); font-size:.95rem;}
  .order-top .osub{font-size:.76rem; color:var(--texto-suave);}
  .status-badge{padding:5px 12px; border-radius:20px; font-size:.72rem; font-weight:700;}
  .st-0{background:#FBF3EC; color:var(--naranja);}
  .st-1{background:#EEF6FB; color:var(--azul);}
  .st-2{background:#F5F0FB; color:var(--morado);}
  .st-3{background:#FFF7E0; color:#B8860B;}
  .st-4{background:#F1FAF3; color:var(--verde-med);}
  .st-cancel{background:#FBEAEA; color:var(--rojo);}
  .cancel-btn{color:var(--rojo); border-color:#F0C7C0;}
  .cancel-btn:hover{background:var(--rojo); color:#fff; border-color:var(--rojo);}
  .stepper{display:flex; align-items:center; margin:14px 0 4px;}
  .step{flex:1; text-align:center; position:relative;}
  .step .sdot{width:26px; height:26px; border-radius:50%; background:var(--crema-2); color:var(--texto-suave); display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:700; margin:0 auto 6px; border:2px solid var(--borde); transition:.3s;}
  .step.done .sdot{background:var(--verde-med); color:#fff; border-color:var(--verde-med);}
  .step .slabel{font-size:.66rem; color:var(--texto-suave);}
  .step.done .slabel{color:var(--verde-oscuro); font-weight:600;}
  .step::before{content:''; position:absolute; top:13px; left:-50%; width:100%; height:2px; background:var(--borde); z-index:0;}
  .step:first-child::before{display:none;}
  .step.done::before{background:var(--verde-med);}
  .order-actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .order-meta{font-size:.8rem; color:var(--texto-suave); margin-top:4px;}

  table.simple{width:100%; border-collapse:collapse; background:var(--blanco); border-radius:14px; overflow:hidden; box-shadow:var(--sombra); font-size:.85rem;}
  table.simple th{background:var(--verde-oscuro); color:#fff; text-align:left; padding:12px 14px; font-size:.75rem; text-transform:uppercase; letter-spacing:.03em;}
  table.simple td{padding:11px 14px; border-bottom:1px solid var(--crema-2); color:var(--texto);}
  table.simple tr:last-child td{border-bottom:none;}
  table.simple tr:hover td{background:#FAFBF6;}

  .form-card{background:var(--blanco); border:1px solid var(--borde); border-radius:16px; padding:24px; margin-bottom:24px; transition:box-shadow .3s;}
  .form-card:focus-within{box-shadow:var(--sombra);}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .form-row label{display:block; font-size:.78rem; font-weight:600; color:var(--verde-oscuro); margin-bottom:5px;}
  .form-row input, .form-row select{width:100%; padding:10px 12px; border:1px solid var(--borde); border-radius:9px; font-size:.85rem; background:var(--crema);}

  .trace-lot{background:var(--blanco); border:1px solid var(--borde); border-radius:16px; padding:22px; margin-bottom:16px; display:grid; grid-template-columns:120px 1fr; gap:20px; align-items:center;}
  .qr-mini{width:100px; height:100px; background:var(--verde-oscuro); border-radius:12px; padding:8px; display:grid; grid-template-columns:repeat(7,1fr); gap:2px;}
  .qr-mini div{background:#fff; border-radius:1px;}

  .kanban{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
  .kanban-col{background:var(--crema-2); border-radius:14px; padding:14px;}
  .kanban-col h5{font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; color:var(--verde-oscuro); margin-bottom:12px; text-align:center;}
  .kanban-card{background:var(--blanco); border:1px solid var(--borde); border-radius:10px; padding:12px; margin-bottom:10px; font-size:.78rem; box-shadow:0 2px 6px rgba(0,0,0,.04); transition:transform .25s var(--easing), box-shadow .25s;}
  .kanban-card:hover{transform:translateY(-3px); box-shadow:var(--sombra);}
  .kanban-card b{display:block; color:var(--verde-oscuro); font-size:.82rem; margin-bottom:4px;}
  .kanban-card .kc-client{color:var(--texto-suave); font-size:.7rem; margin-bottom:8px;}
  .kanban-card button{width:100%; margin-top:4px;}

  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(30px); opacity:0; visibility:hidden; background:var(--verde-oscuro); color:#fff; padding:13px 22px; border-radius:30px; font-size:.84rem; z-index:200; transition:transform .4s var(--easing), opacity .3s, visibility .3s; box-shadow:var(--sombra-fuerte); max-width:90vw; text-align:center;}
  .toast.show{transform:translateX(-50%) translateY(0); opacity:1; visibility:visible;}

  .empty-state{text-align:center; padding:50px 20px; color:var(--texto-suave);}
  .empty-state .ee-icon{font-size:2.2rem; margin-bottom:10px;}

  footer.sysfooter{max-width:1240px; margin:0 auto; padding:0 28px 40px; color:var(--texto-suave); font-size:.72rem; text-align:center;}

  /* AUTH SCREEN */
  .auth-wrap{min-height:calc(100vh - 64px); display:flex; align-items:center; justify-content:center; padding:40px 20px; position:relative; overflow:hidden;}
  .auth-wrap::before{content:''; position:absolute; top:-15%; right:-10%; width:480px; height:480px; background:radial-gradient(circle, var(--lima) 0%, transparent 70%); opacity:.4; filter:blur(8px); border-radius:50%; animation:floatDrift 18s ease-in-out infinite; pointer-events:none;}
  .auth-wrap::after{content:''; position:absolute; bottom:-20%; left:-10%; width:420px; height:420px; background:radial-gradient(circle, var(--naranja) 0%, transparent 70%); opacity:.15; border-radius:50%; animation:floatDrift 22s ease-in-out infinite reverse; pointer-events:none;}
  @keyframes floatDrift{0%,100%{transform:translate(0,0);}50%{transform:translate(18px,24px);}}
  .auth-card{background:var(--blanco); border:1px solid var(--borde); border-radius:20px; padding:34px; width:100%; max-width:440px; box-shadow:var(--sombra-fuerte); position:relative; z-index:1; animation:kpiPop .5s var(--easing) backwards;}
  .auth-card h2{color:var(--verde-oscuro); font-size:1.55rem; letter-spacing:-.015em; margin-bottom:4px;}
  .auth-card .auth-sub{color:var(--texto-suave); font-size:.84rem; margin-bottom:20px;}
  .auth-tabs{display:flex; gap:6px; background:var(--crema-2); border-radius:30px; padding:4px; margin-bottom:22px;}
  .auth-tabs button{flex:1; padding:9px; border-radius:26px; border:none; background:transparent; font-size:.82rem; font-weight:700; color:var(--texto-suave); transition:.25s;}
  .auth-tabs button.active{background:var(--verde-oscuro); color:#fff;}
  .auth-field{margin-bottom:14px;}
  .auth-field label{display:block; font-size:.78rem; font-weight:600; color:var(--verde-oscuro); margin-bottom:5px;}
  .auth-field input, .auth-field select{width:100%; padding:11px 13px; border:1px solid var(--borde); border-radius:9px; font-size:.86rem; background:var(--crema); transition:border-color .25s;}
  .auth-field input:focus, .auth-field select:focus{outline:none; border-color:var(--verde-med);}
  .auth-error{background:#FBEAEA; color:var(--rojo); border:1px solid #F0C7C0; padding:10px 14px; border-radius:10px; font-size:.8rem; margin-bottom:14px; display:none;}
  .auth-error.show{display:block;}
  .auth-submit{width:100%; justify-content:center; margin-top:6px;}
  .auth-hint{font-size:.72rem; color:var(--texto-suave); margin-top:10px; text-align:center;}
  .loading-state{text-align:center; padding:80px 20px; color:var(--texto-suave); font-size:.9rem;}
  .loading-dots{display:inline-flex; gap:5px; margin-left:6px; vertical-align:middle;}
  .loading-dots span{width:6px; height:6px; border-radius:50%; background:var(--verde-med); animation:loadBounce 1.1s infinite ease-in-out;}
  .loading-dots span:nth-child(2){animation-delay:.15s;}
  .loading-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes loadBounce{0%,80%,100%{transform:scale(.6); opacity:.4;} 40%{transform:scale(1); opacity:1;}}

  @media(max-width:1000px){
    .kpi-grid, .product-grid{grid-template-columns:repeat(2,1fr);}
    .kanban{grid-template-columns:1fr 1fr;}
    .form-grid{grid-template-columns:1fr;}
    .trace-lot{grid-template-columns:1fr; text-align:center;}
    .qr-mini{margin:0 auto;}
  }
  @media(max-width:640px){
    .kpi-grid,.product-grid,.kanban{grid-template-columns:1fr;}
    header{padding:12px 16px;}
    .subnav, main{padding-left:16px; padding-right:16px;}
    .header-left, .header-right{width:100%; justify-content:flex-start;}
    .header-right{gap:10px 12px;}
    .subnav{gap:10px 12px;}
    .order-actions{gap:10px 12px;}
    .order-actions .btn{flex:1 1 auto; min-width:150px; justify-content:center;}
    .cart-line{flex-wrap:wrap; gap:6px;}
  }

  /* ============================================================
     TEMA CLARO MINIMALISTA — overrides
     ============================================================ */
  body{background:var(--crema);}
  body::before{display:none;}
  body::after{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:1;
    background-image:linear-gradient(rgba(34,48,30,.028) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(34,48,30,.028) 1px, transparent 1px);
    background-size:72px 72px;
    mask-image:radial-gradient(ellipse 85% 50% at 50% 0%, #000 30%, transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse 85% 50% at 50% 0%, #000 30%, transparent 75%);
  }
  header, .info-banner, .subnav, main, .toast{position:relative; z-index:1;}

  /* Header claro */
  header{
    background:rgba(255,255,255,.86); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--borde); box-shadow:none; color:var(--texto);
  }
  .brand{color:var(--texto);}
  .brand .sub{color:var(--texto-suave); font-weight:600;}
  .back-link{color:var(--texto-suave); border-color:var(--borde); opacity:1;}
  .back-link:hover{background:var(--crema-2); color:var(--texto); border-color:var(--borde);}
  .acc-pill{background:var(--crema-2); border-color:var(--borde); color:var(--texto);}
  .acc-pill .acc-role{background:#F3EBD2; color:var(--verde);}
  .logout-btn{background:transparent; color:var(--texto-suave); border-color:var(--borde);}
  .logout-btn:hover{background:var(--crema-2); color:var(--texto); border-color:var(--borde);}
  .live-pill{background:var(--crema-2); border-color:var(--borde); color:var(--texto-suave);}
  .live-pill .dotpulse{background:var(--verde); box-shadow:none;}

  /* Banner informativo */
  .info-banner{background:var(--crema-2); border-bottom:1px solid var(--borde); color:var(--texto-suave);}
  .info-banner button{border-color:var(--borde); color:var(--texto); background:transparent;}
  .info-banner button:hover{background:#fff;}

  /* Tipografía */
  h1,h2,h3,h4{color:var(--texto);}
  .panel-head h2{color:var(--texto);}
  .panel-head h2::after{content:none;}
  .kpi-card .kpi-value, .cart-total b, .product-price, .product-info h4,
  .order-top .oid, .form-row label, .auth-field label, .auth-card h2,
  .chart-card h4, .kanban-card b, .bar-col .bar-val, .cart-box h4{color:var(--texto);}
  .kanban-col h5{color:var(--texto-suave);}
  .kpi-card .kpi-sub{color:var(--verde);}

  /* Superficies */
  .kpi-card, .chart-card, .order-card, .form-card, .product-card,
  .kanban-card, .auth-card, .cart-box, table.simple, .trace-lot{
    background:var(--blanco); border-color:var(--borde); box-shadow:var(--sombra);
  }
  .kpi-card:hover, .order-card:hover, .product-card:hover, .kanban-card:hover{
    border-color:#DCCF9F; box-shadow:var(--sombra-fuerte);
  }
  .kanban-col{background:var(--crema-2); border:1px solid var(--borde);}

  /* Botones */
  .btn-primary{background:var(--verde); color:#fff; box-shadow:none;}
  .btn-primary:hover{background:#25652F; color:#fff; box-shadow:0 6px 16px rgba(46,125,62,.22);}
  .btn-primary::before{background:linear-gradient(120deg, transparent, rgba(255,255,255,.28), transparent);}
  .btn-primary:disabled{background:#EFE8D4; color:#A79C7A; box-shadow:none;}
  .btn-ghost{border-color:var(--borde); color:var(--texto); background:#fff;}
  .btn-ghost:hover{border-color:#D8CB99; color:var(--texto); background:var(--crema-2);}
  .add-btn{background:var(--verde); color:#fff;}
  .add-btn:hover{background:#25652F; color:#fff;}
  .add-btn.added{background:#67B75A; color:#fff;}
  .cancel-btn{color:var(--rojo); border-color:#EBC9C3;}
  .cancel-btn:hover{background:var(--rojo); color:#fff; border-color:var(--rojo);}

  /* Subnav / filtros */
  .subnav button{background:#fff; border-color:var(--borde); color:var(--texto-suave);}
  .subnav button:hover{border-color:#D8CB99; color:var(--texto);}
  .subnav button.active{background:var(--texto); color:#fff; border-color:var(--texto); box-shadow:none;}
  .subnav button .badge{background:var(--verde); color:#fff;}
  .subnav button.active .badge{background:rgba(255,255,255,.22); color:#fff;}
  .filter-btn{background:#fff; border-color:var(--borde); color:var(--texto-suave);}
  .filter-btn:hover{border-color:#D8CB99; color:var(--texto);}
  .filter-btn.active{background:var(--texto); color:#fff; border-color:var(--texto);}

  /* Formularios */
  .form-row input, .form-row select, .auth-field input, .auth-field select{
    background:#fff; border-color:var(--borde); color:var(--texto);
  }
  .form-row input:focus, .form-row select:focus, .auth-field input:focus, .auth-field select:focus{
    outline:none; border-color:var(--verde); box-shadow:var(--glow);
  }
  .form-row input::placeholder{color:#A79C7A;}
  .qty-stepper{border-color:var(--borde);}
  .qty-stepper button{background:var(--crema-2); color:var(--texto);}
  .qty-stepper button:hover{background:var(--verde); color:#fff;}
  .qty-stepper input{color:var(--texto);}

  /* Tablas */
  table.simple th{background:var(--crema-2); color:var(--texto-suave); border-bottom:1px solid var(--borde);}
  table.simple td{color:var(--texto); border-bottom-color:var(--borde);}
  table.simple tr:hover td{background:var(--crema-2);}

  /* Estados */
  .status-badge{border:1px solid transparent; font-weight:600;}
  .st-0{background:#FBF2E7; color:#9C5D13; border-color:#F0DEC4;}
  .st-1{background:#EAF1F8; color:#245A88; border-color:#CFDFEE;}
  .st-2{background:#F1ECF8; color:#5F4788; border-color:#DCD1EE;}
  .st-3{background:#FBF5E3; color:#8A6A12; border-color:#EEE3BF;}
  .st-4{background:#EDF6E0; color:#25652F; border-color:#CDE2D5;}
  .st-cancel{background:#FAEDEB; color:#A63C2F; border-color:#EDCFC9;}

  /* Stepper */
  .step .sdot{background:#fff; border-color:var(--borde); color:var(--texto-suave);}
  .step.done .sdot{background:var(--verde); color:#fff; border-color:var(--verde); box-shadow:none;}
  .step.done .slabel{color:var(--texto);}
  .step::before{background:var(--borde);}
  .step.done::before{background:var(--verde);}

  /* Auth */
  .auth-wrap::before{background:radial-gradient(circle, rgba(46,125,62,.07) 0%, transparent 70%); opacity:1;}
  .auth-wrap::after{background:radial-gradient(circle, rgba(103,183,90,.06) 0%, transparent 70%); opacity:1;}
  .auth-card{box-shadow:var(--sombra-fuerte);}
  .auth-tabs{background:var(--crema-2);}
  .auth-tabs button{color:var(--texto-suave);}
  .auth-tabs button.active{background:var(--texto); color:#fff;}
  .auth-error{background:#FAEDEB; color:#A63C2F; border-color:#EDCFC9;}
  .loading-dots span{background:var(--verde);}

  /* Toast */
  .toast{background:var(--texto); color:#fff; font-weight:600; box-shadow:var(--sombra-fuerte);}

  /* Varios */
  .cart-box{border-color:#CDE2D5;}
  .cart-line{border-bottom-color:var(--borde);}
  .cart-line button{color:var(--rojo);}
  .product-visual .badge-cat{background:rgba(255,255,255,.92); color:var(--texto-suave); border:1px solid var(--borde);}
  .empty-state, .empty-hint, .order-meta, .product-info .origin, .product-stock,
  .kanban-card .kc-client, .bar-col .bar-label, .auth-card .auth-sub, .auth-hint, .loading-state{color:var(--texto-suave);}
  .bar-col .bar{box-shadow:none;}
  .qr-mini{background:var(--texto); border:1px solid var(--borde);}
  .qr-mini div{background:#fff;}

  /* ============================================================
     ANIMACIONES (adaptadas al tema claro)
     ============================================================ */
  .scroll-progress{
    position:fixed; top:0; left:0; height:2px; width:100%; transform:scaleX(0); transform-origin:0 50%;
    background:var(--verde); z-index:2000; box-shadow:none;
  }
  .particles{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
  .particles i{
    position:absolute; display:block; border-radius:50%;
    background:var(--verde); box-shadow:none; animation:riseUp linear infinite;
  }
  @keyframes riseUp{
    0%{transform:translateY(0) translateX(0); opacity:0;}
    12%{opacity:.22;}
    88%{opacity:.14;}
    100%{transform:translateY(-110vh) translateX(26px); opacity:0;}
  }
  .kpi-card, .order-card, .product-card, .kanban-card, .chart-card{position:relative;}
  .kpi-card::after, .order-card::after, .product-card::after{
    content:''; position:absolute; inset:-1px; border-radius:inherit; padding:1px; pointer-events:none;
    background:linear-gradient(130deg, transparent 20%, rgba(46,125,62,.5), rgba(103,183,90,.35), transparent 80%);
    background-size:220% 220%;
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:0; transition:opacity .35s;
  }
  .kpi-card:hover::after, .order-card:hover::after, .product-card:hover::after{
    opacity:1; animation:borderFlow 3s linear infinite;
  }
  @keyframes borderFlow{0%{background-position:0% 50%;}100%{background-position:220% 50%;}}
  .tilt{transform-style:preserve-3d; will-change:transform;}

  .bar-col .bar{position:relative; overflow:hidden;}
  .bar-col .bar::after{
    content:''; position:absolute; left:0; right:0; height:40%;
    background:linear-gradient(180deg, rgba(255,255,255,.45), transparent);
    animation:barSweep 2.8s ease-in-out infinite;
  }
  @keyframes barSweep{0%{top:-40%;}55%,100%{top:110%;}}

  .step.done .sdot{position:relative;}
  .step.done .sdot::after{
    content:''; position:absolute; inset:-2px; border-radius:50%;
    border:1px solid var(--verde); animation:ring 2.6s ease-out infinite;
  }
  @keyframes ring{0%{transform:scale(1); opacity:.45;} 100%{transform:scale(1.8); opacity:0;}}

  .btn-primary::after{
    content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    box-shadow:0 0 0 0 rgba(46,125,62,.4);
  }
  .btn-primary:hover:not(:disabled)::after{animation:energyPulse 1.2s ease-out infinite;}
  @keyframes energyPulse{
    0%{box-shadow:0 0 0 0 rgba(46,125,62,.35);}
    100%{box-shadow:0 0 0 12px rgba(46,125,62,0);}
  }

  .auth-wrap .scanline{
    position:absolute; left:0; right:0; height:200px; pointer-events:none; z-index:0;
    background:linear-gradient(180deg, transparent, rgba(46,125,62,.045) 50%, transparent);
    animation:scanMove 8s linear infinite;
  }
  @keyframes scanMove{0%{top:-200px;}100%{top:100%;}}
  .auth-card{filter:blur(6px); opacity:0; animation:authIn .7s var(--easing) .05s forwards;}
  @keyframes authIn{to{filter:blur(0); opacity:1;}}

  .panel{animation:panelIn .45s var(--easing);}
  @keyframes panelIn{from{opacity:0; transform:translateY(10px); filter:blur(5px);} to{opacity:1; transform:translateY(0); filter:blur(0);}}

  .subnav button .badge{animation:badgePop .35s var(--easing);}
  @keyframes badgePop{from{transform:scale(.5); opacity:0;} to{transform:scale(1); opacity:1;}}

  @media(prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }

  /* ============================================================
     ACENTOS LIMÓN — identidad cítrica
     ============================================================ */
  /* Franja de color limón bajo el header */
  header{border-bottom:1px solid var(--borde); box-shadow:0 2px 0 rgba(242,194,48,.55);}
  .brand .sub{color:var(--verde); background:var(--limon-claro); padding:2px 9px; border-radius:20px; margin-left:8px;}
  .live-pill{background:#FEF6DC; border-color:#F3DFA0; color:#7A6420;}
  .live-pill .dotpulse{background:var(--limon);}

  /* Banner con degradado limón */
  .info-banner{background:linear-gradient(90deg, #FEF7DD, #FBFCEF); border-bottom:1px solid #F1E2B4;}

  /* Badges y contadores en limón */
  .subnav button .badge{background:var(--limon); color:#3D3208;}
  .subnav button.active .badge{background:var(--limon); color:#3D3208;}
  .acc-pill .acc-role{background:var(--limon-claro); color:#6B5710;}

  /* Título de panel con subrayado limón */
  .panel-head h2::after{
    content:''; display:block; width:44px; height:3px; margin-top:9px; border-radius:3px;
    background:linear-gradient(90deg, var(--limon), var(--verde-claro));
  }

  /* KPIs: barra superior limón */
  .kpi-card{border-top:3px solid var(--limon);}
  .kpi-card .kpi-value{color:var(--texto);}
  .kpi-card .kpi-sub{color:var(--verde);}

  /* Botón primario con brillo limón al pasar */
  .btn-primary:hover{background:#25652F; box-shadow:0 8px 20px rgba(46,125,62,.26);}
  .btn-primary::before{background:linear-gradient(120deg, transparent, rgba(251,227,138,.75), transparent);}
  .btn-primary::after{box-shadow:0 0 0 0 rgba(242,194,48,.6);}
  .btn-primary:hover:not(:disabled)::after{animation:energyPulse 1.2s ease-out infinite;}
  @keyframes energyPulse{
    0%{box-shadow:0 0 0 0 rgba(242,194,48,.55);}
    100%{box-shadow:0 0 0 12px rgba(242,194,48,0);}
  }
  .btn-ghost:hover{background:#FEF9E6; border-color:#EBD68F;}

  /* Filtros y subnav activos: verde hoja, hover limón */
  .subnav button:hover, .filter-btn:hover{background:#FEF9E6; border-color:#EBD68F; color:var(--texto);}
  .subnav button.active, .filter-btn.active{background:var(--verde); color:#fff; border-color:var(--verde);}

  /* Tabla con encabezado cálido */
  table.simple th{background:#FBF3D8; color:#6B5710; border-bottom:1px solid #F0E1B0;}
  table.simple tr:hover td{background:#FEFBEF;}

  /* Carrito destacado en limón */
  .cart-box{border-color:#EBD68F; background:linear-gradient(180deg,#FFFDF3,#fff);}
  .cart-total b{color:var(--verde);}

  /* Foco de formularios en limón */
  .form-row input:focus, .form-row select:focus, .auth-field input:focus, .auth-field select:focus{
    border-color:var(--limon); box-shadow:var(--glow);
  }
  .qty-stepper button:hover{background:var(--limon); color:#3D3208;}

  /* Login con halos limón */
  .auth-wrap::before{background:radial-gradient(circle, rgba(242,194,48,.30) 0%, transparent 70%);}
  .auth-wrap::after{background:radial-gradient(circle, rgba(103,183,90,.20) 0%, transparent 70%);}
  .auth-wrap .scanline{background:linear-gradient(180deg, transparent, rgba(242,194,48,.10) 50%, transparent);}
  .auth-tabs button.active{background:var(--verde); color:#fff;}

  /* Partículas: mezcla limón + hoja */
  .particles i{background:var(--limon);}
  .particles i:nth-child(3n){background:var(--verde-claro);}
  .particles i:nth-child(4n){background:var(--naranja);}

  /* Barra de progreso cítrica */
  .scroll-progress{background:linear-gradient(90deg, var(--limon), var(--verde));}

  /* Borde animado de tarjetas en limón */
  .kpi-card::after, .order-card::after, .product-card::after{
    background:linear-gradient(130deg, transparent 20%, rgba(242,194,48,.85), rgba(46,125,62,.5), transparent 80%);
    background-size:220% 220%;
  }

  /* Estado entregado en verde hoja, pendiente en limón */
  .st-0{background:#FDF3D6; color:#7A6420; border-color:#F0E1B0;}
  .st-4{background:#EDF6E0; color:#25652F; border-color:#D3E7B4;}

  /* Toast verde hoja */
  .toast{background:var(--verde); color:#fff;}
</style>
</head>
<body>

<div class="scroll-progress" id="scrollProgress"></div>
<div class="particles" id="particles" aria-hidden="true"></div>

/* ============================================================
   HELPERS
   ============================================================ */
function money(n){ return '$' + Math.round(n).toLocaleString('es-AR'); }
function lotById(id){ return S.lots.find(function(l){ return l.id === id; }); }
function fruitSVG(color){
  return '<svg viewBox="0 0 64 64" width="46" height="46"><circle cx="32" cy="36" r="20" fill="'+color+'"/><path d="M32 16c5 3 6 7 3 12" stroke="#1F6B3D" stroke-width="4" fill="none" stroke-linecap="round"/></svg>';
}
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3200);
}
/* Unidad de un pedido: la guardada al crearlo, o la del lote, o kg por compatibilidad */
function unitOf(o){
  if(o && o.unit) return o.unit;
  const p = o ? lotById(o.lotId) : null;
  return (p && p.unit) ? p.unit : 'kg';
}
function traceStatusIdx(traceIdx){
  if(traceIdx <= 0) return 1;
  if(traceIdx <= 2) return 2;
  if(traceIdx === 3) return 3;
  return 4;
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function mapAuthError(code){
  const m = {
    'auth/email-already-in-use':'Ese correo ya está registrado. Iniciá sesión en su lugar.',
    'auth/invalid-email':'El correo ingresado no es válido.',
    'auth/weak-password':'La contraseña debe tener al menos 6 caracteres.',
    'auth/user-not-found':'No existe una cuenta con ese correo.',
    'auth/wrong-password':'Contraseña incorrecta.',
    'auth/invalid-credential':'Correo o contraseña incorrectos.',
    'auth/too-many-requests':'Demasiados intentos. Probá de nuevo en unos minutos.',
  };
  return m[code] || ('Ocurrió un error: ' + code);
}
function nextOrderNumber(){
  const ref = db.collection('meta').doc('contadorPedidos');
  return db.runTransaction(function(tx){
    return tx.get(ref).then(function(snap){
      const actual = (snap.exists && snap.data().valor) ? snap.data().valor : 8840;
      const next = actual + 1;
      tx.set(ref, { valor: next }, { merge:true });
      return next;
    });
  });
}
function genInvoice(order){
  const cae = Array.from({length:14}, function(){ return Math.floor(Math.random()*10); }).join('');
  return { cae: cae, fecha: new Date().toLocaleDateString('es-AR'), monto: order.qty * order.price };
}

/* ============================================================
   COMPROBANTES DESCARGABLES (PDF) — pedido realizado / entregado
   ============================================================ */
function descargarComprobante(orderId, tipo){
  const o = S.orders.find(function(x){ return x.id === orderId; });
  if(!o){ showToast('No se encontró el pedido'); return; }
  if(typeof window.jspdf === 'undefined'){ showToast('No se pudo cargar el generador de PDF'); return; }
  const p = lotById(o.lotId);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });

  doc.setFillColor(18, 53, 36);
  doc.rect(0, 0, 210, 30, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.text('CitrusCode', 15, 17);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  doc.text(tipo === 'entrega' ? 'Comprobante de entrega' : 'Comprobante de pedido', 15, 24);

  let y = 42;
  doc.setTextColor(21, 32, 24);
  function fila(label, valor){
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
    doc.text(label, 15, y);
    doc.setFont('helvetica', 'normal');
    doc.text(String(valor == null || valor === '' ? '—' : valor), 75, y);
    y += 8;
  }
  function separador(){
    doc.setDrawColor(228, 225, 213);
    doc.line(15, y, 195, y);
    y += 8;
  }

  fila('N° de pedido:', 'CC-' + o.numero);
  fila('Fecha de emisión:', new Date().toLocaleDateString('es-AR') + ' ' + new Date().toLocaleTimeString('es-AR'));
  fila('Estado actual:', STATUSES[o.statusIdx]);
  fila('Emitido para la cuenta:', currentUser.email);
  separador();

  fila('Producto:', p ? p.name : '(producto ya no disponible)');
  fila('Cantidad:', o.qty.toLocaleString('es-AR') + ' ' + unitOf(o));
  fila('Precio unitario:', money(o.price));
  fila('Monto total:', money(o.qty * o.price));
  separador();

  fila('Mayorista:', o.mayoristaNombre);
  fila('Productor:', p ? p.productorNombre : '—');

  if(tipo === 'entrega' && o.invoice){
    separador();
    fila('Fecha de entrega:', o.invoice.fecha);
    fila('CAE (simulado):', o.invoice.cae);
    fila('Monto facturado:', money(o.invoice.monto));
  } else if(tipo === 'entrega' && !o.invoice){
    separador();
    doc.setFont('helvetica', 'italic'); doc.setFontSize(10);
    doc.text('Este pedido todavía no llegó al estado "Entregado".', 15, y);
    y += 8;
  }

  y += 8;
  doc.setDrawColor(232, 135, 30);
  doc.setLineWidth(0.8);
  doc.line(15, y, 195, y);
  y += 8;
  doc.setFont('helvetica', 'italic');
  doc.setFontSize(8);
  doc.setTextColor(91, 107, 96);
  doc.text('Documento generado automáticamente por el sistema CitrusCode con fines de demostración académica.', 15, y);
  doc.text('No constituye un comprobante fiscal válido.', 15, y + 5);

  const nombreArchivo = 'CitrusCode_' + (tipo === 'entrega' ? 'ComprobanteEntrega' : 'ComprobantePedido') + '_CC-' + o.numero + '.pdf';
  doc.save(nombreArchivo);
  showToast('Comprobante descargado');
}

function renderAuthScreen(){
  const roleLabel = { mayorista:'Nombre de tu empresa / distribuidora', productor:'Nombre de tu finca o cooperativa', admin:'Área / cargo dentro de CitrusCode' };
  const body = document.getElementById('appBody');
  const isLogin = authMode === 'login';
  body.innerHTML =
    '<div class="auth-wrap"><div class="scanline"></div><div class="auth-card">'+
      '<h2>'+(isLogin ? 'Ingresar al sistema' : 'Crear una cuenta')+'</h2>'+
      '<p class="auth-sub">'+(isLogin ? 'Accedé con tu correo y contraseña.' : 'Registrate eligiendo tu rol dentro del marketplace.')+'</p>'+
      '<div class="auth-tabs">'+
        '<button data-mode="login" class="'+(isLogin?'active':'')+'">Iniciar sesión</button>'+
        '<button data-mode="register" class="'+(!isLogin?'active':'')+'">Registrarme</button>'+
      '</div>'+
      '<div class="auth-error" id="authError"></div>'+
      '<form id="authForm">'+
        (isLogin ? '' :
          '<div class="auth-field"><label>Nombre y apellido</label><input type="text" id="fNombre" required></div>'+
          '<div class="auth-field"><label>Rol en el sistema</label><select id="fRol">'+
            '<option value="mayorista">Mayorista</option>'+
            '<option value="productor">Productor</option>'+
            '<option value="admin">Administración CitrusCode</option>'+
          '</select></div>'+
          '<div class="auth-field" id="fEntidadWrap"><label id="fEntidadLabel">'+roleLabel.mayorista+'</label><input type="text" id="fEntidad" required></div>'+
          '<div class="auth-field" id="fAdminCodeWrap" style="display:none;"><label>Código de administración</label><input type="text" id="fAdminCode"></div>'
        )+
        '<div class="auth-field"><label>Correo electrónico</label><input type="email" id="fEmail" required></div>'+
        '<div class="auth-field"><label>Contraseña</label><input type="password" id="fPass" minlength="6" required></div>'+
        '<button type="submit" class="btn btn-primary auth-submit" id="authSubmitBtn">'+(isLogin ? 'Ingresar' : 'Crear cuenta')+'</button>'+
      '</form>'+
    '</div></div>';

  body.querySelectorAll('.auth-tabs button').forEach(function(b){
    b.addEventListener('click', function(){ authMode = b.dataset.mode; renderAuthScreen(); });
  });

  const rolSel = document.getElementById('fRol');
  if(rolSel){
    rolSel.addEventListener('change', function(){
      document.getElementById('fEntidadLabel').textContent = roleLabel[rolSel.value];
      document.getElementById('fAdminCodeWrap').style.display = rolSel.value === 'admin' ? 'block' : 'none';
    });
  }

  document.getElementById('authForm').addEventListener('submit', function(e){
    e.preventDefault();
    const errBox = document.getElementById('authError');
    errBox.classList.remove('show');
    const email = document.getElementById('fEmail').value.trim();
    const pass = document.getElementById('fPass').value;
    const btn = document.getElementById('authSubmitBtn');
    btn.disabled = true;

    if(isLogin){
      auth.signInWithEmailAndPassword(email, pass).catch(function(err){
        errBox.textContent = mapAuthError(err.code);
        errBox.classList.add('show');
        btn.disabled = false;
      });
    } else {
      const nombre = document.getElementById('fNombre').value.trim();
      const rol = document.getElementById('fRol').value;
      const entidad = document.getElementById('fEntidad').value.trim();
      const adminCode = document.getElementById('fAdminCode') ? document.getElementById('fAdminCode').value.trim() : '';
      if(rol === 'admin' && adminCode !== ADMIN_CODE){
        errBox.textContent = 'El código de administración no es correcto.';
        errBox.classList.add('show');
        btn.disabled = false;
        return;
      }
      auth.createUserWithEmailAndPassword(email, pass).then(function(cred){
        return db.collection('usuarios').doc(cred.user.uid).set({
          nombre: nombre, email: email, rol: rol, entidad: entidad,
          createdAt: FieldValue.serverTimestamp()
        });
      }).catch(function(err){
        errBox.textContent = mapAuthError(err.code);
        errBox.classList.add('show');
        btn.disabled = false;
      });
    }
  });
}

/* ============================================================
   CARGA DE DATOS EN VIVO (FIRESTORE)
   ============================================================ */
function subscribeData(){
  unsubLotes = db.collection('lotes').orderBy('createdAt','desc').onSnapshot(function(snap){
    S.lots = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    renderMain();
  }, function(err){ showToast('Error leyendo productos: ' + err.message); });

  unsubPedidos = db.collection('pedidos').orderBy('createdAt','desc').onSnapshot(function(snap){
    S.orders = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    renderSubnav(); renderMain();
  }, function(err){ showToast('Error leyendo pedidos: ' + err.message); });

  if(currentUser.rol === 'admin'){
    unsubProyectos = db.collection('proyectos').orderBy('createdAt','desc').onSnapshot(function(snap){
      S.projects = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      renderMain();
    }, function(err){ showToast('Error leyendo proyectos: ' + err.message); });
  }
}
function unsubscribeData(){
  if(unsubLotes) unsubLotes();
  if(unsubPedidos) unsubPedidos();
  if(unsubProyectos) unsubProyectos();
  unsubLotes = unsubPedidos = unsubProyectos = null;
  S = { lots: [], orders: [], projects: [], cart: {} };
}

/* ============================================================
   RENDER RAIZ DE LA APP (usuario logueado)
   ============================================================ */
let view = { mayorista:'catalogo', productor:'publicaciones', admin:'dashboard' };

function renderApp(){
  const body = document.getElementById('appBody');
  body.innerHTML =
    '<div class="info-banner" id="infoBanner">'+
      '<p><strong>Sesión de '+esc(currentUser.rol)+':</strong> los pedidos, publicaciones y proyectos se guardan en la base de datos compartida de CitrusCode — cualquier otro usuario registrado ve los mismos datos en tiempo real.</p>'+
      '<button id="closeBanner">Entendido</button>'+
    '</div>'+
    '<div class="subnav" id="subnav"></div>'+
    '<main id="main"></main>';
  document.getElementById('closeBanner').addEventListener('click', function(){
    document.getElementById('infoBanner').style.display = 'none';
  });
  renderSubnav();
  renderMain();
}

function renderSubnav(){
  const nav = document.getElementById('subnav');
  if(!nav) return;
  const pendCount = S.orders.filter(function(o){ return o.statusIdx === 0 && !o.cancelado && !o.ocultoProductor && o.productorUid === currentUser.uid; }).length;
  let tabs = [];
  if(currentUser.rol === 'mayorista'){
    tabs = [
      {k:'catalogo', label:'Catálogo y nuevo pedido'},
      {k:'pedidos', label:'Mis pedidos', badge: S.orders.filter(function(o){return o.mayoristaUid===currentUser.uid && !o.cancelado && !o.ocultoMayorista;}).length || null},
      {k:'facturas', label:'Facturas'},
    ];
  } else if(currentUser.rol === 'productor'){
    tabs = [
      {k:'publicaciones', label:'Mis publicaciones'},
      {k:'recibidos', label:'Pedidos recibidos', badge: pendCount || null},
      {k:'trazabilidad', label:'Trazabilidad de lotes'},
    ];
  } else {
    tabs = [
      {k:'dashboard', label:'Dashboard'},
      {k:'pedidos', label:'Todos los pedidos'},
      {k:'medida', label:'Software a medida'},
    ];
  }
  nav.innerHTML = tabs.map(function(t){
    const active = view[currentUser.rol] === t.k ? ' active' : '';
    const badge = t.badge ? '<span class="badge">'+t.badge+'</span>' : '';
    return '<button class="'+active.trim()+'" data-view="'+t.k+'">'+t.label+badge+'</button>';
  }).join('');
  nav.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ view[currentUser.rol] = b.dataset.view; renderSubnav(); renderMain(); });
  });
}

function renderMain(){
  const main = document.getElementById('main');
  if(!main || !currentUser) return;
  if(currentUser.rol === 'mayorista'){
    if(view.mayorista === 'catalogo') main.innerHTML = viewMayoristaCatalogo();
    else if(view.mayorista === 'pedidos') main.innerHTML = viewMayoristaPedidos();
    else main.innerHTML = viewMayoristaFacturas();
  } else if(currentUser.rol === 'productor'){
    if(view.productor === 'publicaciones') main.innerHTML = viewProductorPublicaciones();
    else if(view.productor === 'recibidos') main.innerHTML = viewProductorRecibidos();
    else main.innerHTML = viewProductorTrazabilidad();
  } else {
    if(view.admin === 'dashboard') main.innerHTML = viewAdminDashboard();
    else if(view.admin === 'pedidos') main.innerHTML = viewAdminPedidos();
    else main.innerHTML = viewAdminMedida();
  }
  bindMainEvents();
}

/* ============================================================
   VISTA MAYORISTA — CATALOGO
   ============================================================ */
function viewMayoristaCatalogo(){
  const cats = ['todos','limon','naranja','mandarina','pomelo','subproductos'];
  const disponibles = S.lots.filter(function(l){ return !l.archivado; });
  const list = catFilter === 'todos' ? disponibles : disponibles.filter(function(l){ return l.cat === catFilter; });
  const filters = cats.map(function(c){
    return '<button class="filter-btn'+(c===catFilter?' active':'')+'" data-cat="'+c+'">'+(c==='todos'?'Todos':c.charAt(0).toUpperCase()+c.slice(1))+'</button>';
  }).join('');
  const cards = list.length ? list.map(function(p){
    const qty = S.cart[p.id] || p.min;
    return '<div class="product-card">'+

  '</div>';
}

  const activeStatus = order.statusIdx;
  return '<div class="stepper">' + STATUSES.map(function(s, i){
    return '<div class="step'+(i<=activeStatus?' done':'')+'"><div class="sdot">'+(i<activeStatus? '✓' : (i+1))+'</div><div class="slabel">'+s+'</div></div>';
  }).join('') + '</div>';
}

/* ============================================================
   VISTA ADMIN — DASHBOARD
   ============================================================ */
function viewAdminDashboard(){
  const canceladosCount = S.orders.filter(function(o){ return o.cancelado; }).length;
  const ordersActivas = S.orders.filter(function(o){ return !o.cancelado; });
  const totalOrders = ordersActivas.length;
  const gmv = ordersActivas.reduce(function(a,o){ return a + o.qty*o.price; }, 0);
  const entregados = ordersActivas.filter(function(o){ return o.statusIdx===4; }).length;
  const pctTraza = totalOrders ? Math.round(entregados/totalOrders*100) : 0;
  const productores = new Set(S.lots.map(function(l){ return l.productorUid; })).size;

  const counts = STATUSES.map(function(s, i){ return ordersActivas.filter(function(o){ return o.statusIdx===i; }).length; });
  const maxC = Math.max.apply(null, counts.concat([1]));
  const colors = ['#C2761C','#2F6FA8','#7A5EA8','#B08A1E','#2E7D3E'];
  const bars = counts.map(function(c, i){
    const h = Math.max(6, Math.round((c/maxC)*130));
    return '<div class="bar-col"><div class="bar-val">'+c+'</div><div class="bar" style="height:'+h+'px; background:'+colors[i]+';"></div><div class="bar-label">'+STATUSES[i]+'</div></div>';
  }).join('');

  return '<div class="panel">'+
    '<div class="panel-head"><h2>Dashboard de operaciones</h2><p>Vista consolidada del marketplace: pedidos, volumen comercializado y trazabilidad.</p></div>'+
    '<div class="kpi-grid">'+
      '<div class="kpi-card"><div class="kpi-label">GMV total</div><div class="kpi-value">'+money(gmv)+'</div><div class="kpi-sub">'+totalOrders+' pedidos totales</div></div>'+
      '<div class="kpi-card"><div class="kpi-label">Pedidos activos</div><div class="kpi-value">'+(totalOrders-entregados)+'</div><div class="kpi-sub">'+(canceladosCount ? canceladosCount + ' cancelado(s) no incluido(s)' : 'en curso ahora mismo')+'</div></div>'+
      '<div class="kpi-card"><div class="kpi-label">Trazabilidad completa</div><div class="kpi-value">'+pctTraza+'%</div><div class="kpi-sub">'+entregados+' de '+totalOrders+' entregados</div></div>'+
      '<div class="kpi-card"><div class="kpi-label">Productores activos</div><div class="kpi-value">'+productores+'</div><div class="kpi-sub">publicando en el marketplace</div></div>'+
    '</div>'+
    '<div class="chart-card"><h4>Pedidos por estado</h4><div class="bar-chart">'+bars+'</div></div>'+
  '</div>';
}

/* ============================================================
   EVENTOS DE LA APP (delegados en #main)
   ============================================================ */
function bindMainEvents(){
  const main = document.getElementById('main');

  main.querySelectorAll('.filter-btn').forEach(function(b){
    b.addEventListener('click', function(){ catFilter = b.dataset.cat; renderMain(); });
  });

  main.querySelectorAll('.qty-plus, .qty-minus, .add-btn').forEach(function(b){
    b.addEventListener('click', function(){
      const id = b.dataset.id;
      const p = lotById(id);
      const input = main.querySelector('.qty-input[data-id="'+id+'"]');
      if(b.classList.contains('qty-plus')){
        input.value = parseInt(input.value) + QTY_STEP;
      } else if(b.classList.contains('qty-minus')){
        const v = parseInt(input.value) - QTY_STEP;
        input.value = v >= p.min ? v : p.min;
      } else {
        S.cart[id] = parseInt(input.value);
        b.textContent = 'Agregado ✓';
        b.classList.add('added');
        showToast(p.name + ' agregado al pedido');
        setTimeout(function(){ renderMain(); }, 500);
      }
    });
  });

  main.querySelectorAll('[data-remove]').forEach(function(b){
    b.addEventListener('click', function(){ delete S.cart[b.dataset.remove]; renderMain(); });
  });

  const placeBtn = document.getElementById('placeOrderBtn');
  if(placeBtn){
    placeBtn.addEventListener('click', function(){
      placeBtn.disabled = true;
      placeBtn.textContent = 'Enviando pedido…';
      const ids = Object.keys(S.cart).filter(function(id){ return lotById(id); });
      let chain = Promise.resolve();
      ids.forEach(function(id){
        chain = chain.then(function(){
          const p = lotById(id);
          return nextOrderNumber().then(function(numero){
            return db.collection('pedidos').add({
              numero: numero, lotId: p.id,
              productorUid: p.productorUid,
              mayoristaUid: currentUser.uid, mayoristaNombre: currentUser.entidad || currentUser.nombre,
              qty: S.cart[id], price: p.price, unit: p.unit || 'kg', statusIdx:0, traceIdx:-1, invoice:null,
              createdAt: FieldValue.serverTimestamp()
            });
          });
        });
      });
      chain.then(function(){
        S.cart = {};
        view.mayorista = 'pedidos';
        showToast('Pedido mayorista enviado a los productores');
        renderSubnav(); renderMain();
      }).catch(function(err){
        showToast('No se pudo enviar el pedido: ' + err.message);
        placeBtn.disabled = false; placeBtn.textContent = 'Solicitar pedido mayorista';
      });
    });
  }

  const addLotBtn = document.getElementById('addLotBtn');
  if(addLotBtn){
    addLotBtn.addEventListener('click', function(){
      const name = document.getElementById('newLotName').value.trim();
      const cat = document.getElementById('newLotCat').value;
      const unit = document.getElementById('newLotUnit').value;
      const price = parseFloat(document.getElementById('newLotPrice').value);
      const stock = parseFloat(document.getElementById('newLotStock').value);
      const minInput = parseFloat(document.getElementById('newLotMin').value);
      if(!name || !price || !stock){ showToast('Completá todos los campos para publicar'); return; }
      const min = (minInput && minInput > 0) ? Math.min(minInput, stock) : Math.min(300, stock);
      const palette = {limon:'#E8C547', naranja:'#F0A03C', mandarina:'#F5B25C', pomelo:'#E88C86', subproductos:'#B7C93C'};
      addLotBtn.disabled = true;
      db.collection('lotes').add({
        name: name, productorUid: currentUser.uid, productorNombre: currentUser.entidad || currentUser.nombre,
        cat: cat, price: price, unit: unit, stock: stock, min: min, color: palette[cat] || '#8A5FB0',
        archivado: false, createdAt: FieldValue.serverTimestamp()
      }).then(function(){
        showToast('Producto publicado en el marketplace');
      }).catch(function(err){
        showToast('No se pudo publicar: ' + err.message);
      }).finally(function(){ addLotBtn.disabled = false; });
    });
  }

  main.querySelectorAll('[data-delete-lot]').forEach(function(b){
    b.addEventListener('click', function(){
      if(!window.confirm('¿Eliminar esta publicación? Dejará de verse en el catálogo. Los pedidos ya realizados sobre este producto se conservan.')) return;
      b.disabled = true;
      db.collection('lotes').doc(b.dataset.deleteLot).update({ archivado: true })
        .then(function(){ showToast('Publicación eliminada'); })
        .catch(function(err){ showToast('Error: ' + err.message); b.disabled = false; });
    });
  });

  const addProjBtn = document.getElementById('addProjBtn');
  if(addProjBtn){
    addProjBtn.addEventListener('click', function(){
      const name = document.getElementById('newProjName').value.trim();
      const cliente = document.getElementById('newProjClient').value.trim();
      if(!name || !cliente){ showToast('Completá nombre y cliente del proyecto'); return; }
      addProjBtn.disabled = true;
      db.collection('proyectos').add({ name: name, cliente: cliente, stageIdx: 0, createdAt: FieldValue.serverTimestamp() })
        .then(function(){ showToast('Proyecto creado'); })
        .catch(function(err){ showToast('No se pudo crear: ' + err.message); })
        .finally(function(){ addProjBtn.disabled = false; });
    });
  }

  main.querySelectorAll('[data-confirm]').forEach(function(b){
    b.addEventListener('click', function(){
      b.disabled = true;
      db.collection('pedidos').doc(b.dataset.confirm).update({ statusIdx: 1 })
        .then(function(){ showToast('Pedido confirmado'); })
        .catch(function(err){ showToast('Error: ' + err.message); b.disabled = false; });
    });
  });

  main.querySelectorAll('[data-advance]').forEach(function(b){
    b.addEventListener('click', function(){
      const o = S.orders.find(function(x){ return x.id === b.dataset.advance; });
      if(!o) return;
      b.disabled = true;
      const traceIdx = o.traceIdx + 1;
      const statusIdx = traceStatusIdx(traceIdx);
      const update = { traceIdx: traceIdx, statusIdx: statusIdx };
      if(statusIdx === 4 && !o.invoice){ update.invoice = genInvoice(o); }
      db.collection('pedidos').doc(o.id).update(update).then(function(){
        showToast(statusIdx === 4 ? 'Pedido entregado — factura generada automáticamente' : 'Trazabilidad actualizada: ' + TRACE_LABELS[traceIdx]);
      }).catch(function(err){ showToast('Error: ' + err.message); b.disabled = false; });
    });
  });

  main.querySelectorAll('[data-cancel-order]').forEach(function(b){
    b.addEventListener('click', function(){
      if(!window.confirm('¿Seguro que querés cancelar este pedido? Esta acción no se puede deshacer.')) return;
      b.disabled = true;
      db.collection('pedidos').doc(b.dataset.cancelOrder).update({ cancelado: true })
        .then(function(){ showToast('Pedido cancelado'); })
        .catch(function(err){ showToast('Error: ' + err.message); b.disabled = false; });
    });
  });

  main.querySelectorAll('[data-hide-order]').forEach(function(b){
    b.addEventListener('click', function(){
      if(!window.confirm('¿Quitar este pedido de tu lista? Solo se oculta de tu vista, el registro sigue guardado en el sistema.')) return;
      b.disabled = true;
      db.collection('pedidos').doc(b.dataset.hideOrder).update({ ocultoMayorista: true })
        .then(function(){ showToast('Pedido quitado de la lista'); })
        .catch(function(err){ showToast('Error: ' + err.message); b.disabled = false; });
    });
  });

  const clearMayBtn = main.querySelector('#clearMayoristaPedidos');
  if(clearMayBtn){
    clearMayBtn.addEventListener('click', function(){
      const ids = S.orders.filter(function(o){
        return o.mayoristaUid === currentUser.uid && !o.ocultoMayorista && (o.cancelado || o.statusIdx === STATUSES.length - 1);
      }).map(function(o){ return o.id; });
      if(!ids.length) return;
      if(!window.confirm('¿Vaciar '+ids.length+' pedido(s) cancelado(s)/entregado(s) de tu lista? Solo se ocultan de tu vista, quedan guardados en el sistema.')) return;
      clearMayBtn.disabled = true;
      const batch = db.batch();
      ids.forEach(function(id){ batch.update(db.collection('pedidos').doc(id), { ocultoMayorista: true }); });
      batch.commit()
        .then(function(){ showToast('Lista de pedidos vaciada'); })
        .catch(function(err){ showToast('Error: ' + err.message); clearMayBtn.disabled = false; });
    });
  }

  const clearProdBtn = main.querySelector('#clearProductorPedidos');
  if(clearProdBtn){
    clearProdBtn.addEventListener('click', function(){
      const ids = S.orders.filter(function(o){
        return o.productorUid === currentUser.uid && !o.ocultoProductor && (o.cancelado || o.statusIdx === STATUSES.length - 1);
      }).map(function(o){ return o.id; });
      if(!ids.length) return;
      if(!window.confirm('¿Vaciar '+ids.length+' pedido(s) cancelado(s)/entregado(s) de tu lista? Solo se ocultan de tu vista, quedan guardados en el sistema.')) return;
      clearProdBtn.disabled = true;
      const batch = db.batch();
      ids.forEach(function(id){ batch.update(db.collection('pedidos').doc(id), { ocultoProductor: true }); });
      batch.commit()
        .then(function(){ showToast('Lista de pedidos vaciada'); })
        .catch(function(err){ showToast('Error: ' + err.message); clearProdBtn.disabled = false; });
    });
  }

  main.querySelectorAll('[data-hide-order-productor]').forEach(function(b){
    b.addEventListener('click', function(){
      if(!window.confirm('¿Quitar este pedido de tu lista? Solo se oculta de tu vista, el registro sigue guardado en el sistema.')) return;
      b.disabled = true;
      db.collection('pedidos').doc(b.dataset.hideOrderProductor).update({ ocultoProductor: true })
        .then(function(){ showToast('Pedido quitado de la lista'); })
        .catch(function(err){ showToast('Error: ' + err.message); b.disabled = false; });
    });
  });

  main.querySelectorAll('[data-comprobante-pedido]').forEach(function(b){
    b.addEventListener('click', function(){ descargarComprobante(b.dataset.comprobantePedido, 'pedido'); });
  });

  main.querySelectorAll('[data-comprobante-entrega]').forEach(function(b){
    b.addEventListener('click', function(){ descargarComprobante(b.dataset.comprobanteEntrega, 'entrega'); });
  });

  main.querySelectorAll('[data-project-advance]').forEach(function(b){
    b.addEventListener('click', function(){
      const pr = S.projects.find(function(x){ return x.id === b.dataset.projectAdvance; });
      if(!pr) return;
      b.disabled = true;
      db.collection('proyectos').doc(pr.id).update({ stageIdx: pr.stageIdx + 1 })
        .then(function(){ showToast(pr.name + ' avanzó de etapa'); })
        .catch(function(err){ showToast('Error: ' + err.message); b.disabled = false; });
    });
  });
}

/* ============================================================
   ESTADO DE AUTENTICACIÓN
   ============================================================ */
auth.onAuthStateChanged(function(user){
  if(user){
    db.collection('usuarios').doc(user.uid).get().then(function(doc){
      if(!doc.exists){
        auth.signOut();
        return;
      }
      const data = doc.data();
      currentUser = { uid: user.uid, email: data.email, nombre: data.nombre, rol: data.rol, entidad: data.entidad };
      renderHeaderRight();
      renderApp();
      subscribeData();
    }).catch(function(err){
      document.getElementById('appBody').innerHTML = '<div class="loading-state">Error cargando tu cuenta: '+esc(err.message)+'</div>';
    });
  } else {
    currentUser = null;
    unsubscribeData();
    renderHeaderRight();
    renderAuthScreen();
  }
});

/* ============ CAPA FUTURISTA (decorativa, no toca la lógica del sistema) ============ */
(function(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  /* Barra de progreso de scroll */
  const progressBar = document.getElementById('scrollProgress');
  function updateProgress(){
    if(!progressBar) return;
    const h = document.documentElement.scrollHeight - window.innerHeight;
    const p = h > 0 ? window.scrollY / h : 0;
    progressBar.style.transform = 'scaleX(' + p + ')';
  }
  window.addEventListener('scroll', updateProgress, {passive:true});
  window.addEventListener('resize', updateProgress);
  updateProgress();

  /* Partículas flotantes */
  const pc = document.getElementById('particles');
  if(pc && !reduceMotion){
    const total = window.innerWidth < 700 ? 12 : 22;
    let frag = '';
    for(let i=0; i<total; i++){
      const left = Math.random()*100;
      const dur = 16 + Math.random()*16;
      const delay = -Math.random()*dur;
      const size = 2 + Math.random()*2;
      const op = .18 + Math.random()*.3;
      frag += '<i style="left:'+left.toFixed(2)+'%; bottom:-10px; width:'+size.toFixed(1)+'px; height:'+size.toFixed(1)+'px;'+
              ' opacity:'+op.toFixed(2)+'; animation-duration:'+dur.toFixed(1)+'s; animation-delay:'+delay.toFixed(1)+'s;"></i>';
    }
    pc.innerHTML = frag;
  }

  /* Tilt 3D en tarjetas (se re-aplica porque el sistema re-renderiza) */
  if(finePointer && !reduceMotion){
    function onMove(e){
      const card = e.target.closest ? e.target.closest('.kpi-card, .product-card, .kanban-card') : null;
      if(!card) return;
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - .5;
      const py = (e.clientY - r.top) / r.height - .5;
      card.style.transform = 'perspective(900px) rotateX(' + (-py*5).toFixed(2) + 'deg) rotateY(' + (px*7).toFixed(2) + 'deg) translateY(-5px)';
    }
    function onLeave(e){
      const card = e.target.closest ? e.target.closest('.kpi-card, .product-card, .kanban-card') : null;
      if(card) card.style.transform = '';
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseout', onLeave);
  }
})();
</script>
