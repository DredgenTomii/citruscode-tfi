  @keyframes starPop{0%{transform:scale(.3) rotate(-30deg);} 60%{transform:scale(1.35) rotate(8deg);} 100%{transform:none;}}
  @keyframes crown{0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);}}
  @media(max-width:640px){
    .podio{grid-template-columns:1fr;}
    .podio-card.p1, .podio-card.p2, .podio-card.p3{order:0;}
    .rk-row{grid-template-columns:34px minmax(0,1fr) 56px; }
    .rk-row .stars, .rk-row .rk-n, .rk-row.head span:nth-child(3), .rk-row.head span:nth-child(5){display:none;}
    .rep-card{grid-template-columns:1fr;}
  }

  /* ============================================================
     FOTOS GENERADAS CON IA
     ============================================================ */
  .product-photo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 28%; opacity:0; transition:opacity .7s var(--easing), transform .8s var(--easing);}
  .product-photo.ok{opacity:1;}
  .product-card:hover .product-photo{transform:scale(1.07);}
  .product-visual .badge-cat, .product-visual .badge-stock{z-index:2;}
  .ia-chip{position:absolute; left:10px; bottom:10px; z-index:2; font-size:.58rem; font-weight:700; letter-spacing:.04em; padding:3px 8px; border-radius:20px; background:rgba(16,23,14,.62); color:#FBE38A; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); opacity:0; transition:opacity .4s;}
  .product-photo.ok ~ .ia-chip{opacity:1;}
  .lot-thumb{width:34px; height:34px; border-radius:9px; object-fit:cover; object-position:center 28%; vertical-align:middle; margin-right:10px; background:var(--surface-3); border:1px solid var(--borde);}
  .foto-edit{display:flex; gap:14px; align-items:center; margin-bottom:16px; padding:12px; border-radius:14px; background:var(--surface-2); border:1px solid var(--borde);}
  .foto-edit .fe-img{width:120px; height:84px; border-radius:10px; overflow:hidden; position:relative; flex-shrink:0; background:var(--surface-3); display:grid; place-items:center;}
  .foto-edit .fe-img img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 28%;}
  .foto-edit p{font-size:.76rem; color:var(--texto-suave); margin-bottom:8px;}

  /* ============================================================
     EVOLUCIÓN DE PRECIOS
     ============================================================ */
  .trend{display:inline-flex; align-items:center; gap:2px; font-size:.66rem; font-weight:800; padding:2px 7px; border-radius:10px; margin-left:6px; vertical-align:3px; font-family:'Inter',sans-serif;}
  .trend.up{background:var(--limon-bg); color:var(--c-naranja); border:1px solid var(--limon-borde);}
  .trend.down{background:var(--acento-bg); color:var(--acento); border:1px solid var(--acento-borde);}
  .precio-chart{width:100%; height:auto; display:block; overflow:visible;}
  .precio-chart .grid-l{stroke:var(--borde); stroke-width:1; stroke-dasharray:3 5;}
  .precio-chart .eje{fill:var(--texto-suave); font-size:11px; font-family:'Inter',sans-serif;}
  .precio-chart .linea{fill:none; stroke:var(--c-verde-claro); stroke-width:3; stroke-linecap:round; stroke-linejoin:round;}
  .precio-chart .punto{fill:var(--surface); stroke:var(--c-limon); stroke-width:3; transition:r .2s;}
  .precio-chart .punto:hover{r:7;}
  .precio-chart .punto.pedido{stroke:var(--c-verde);}
  main.animar .precio-chart .linea{stroke-dasharray:2000; stroke-dashoffset:2000; animation:dibujar 1.6s var(--easing) .2s forwards;}
  main.animar .precio-chart .area{animation:fadeIn 1s ease .6s backwards;}
  main.animar .precio-chart .punto{animation:popIn .4s var(--spring) backwards; animation-delay:1s;}
  .precio-leyenda{display:flex; gap:16px; flex-wrap:wrap; font-size:.74rem; color:var(--texto-suave); margin-top:10px;}
  .precio-leyenda i{display:inline-block; width:10px; height:10px; border-radius:50%; border:3px solid var(--c-limon); margin-right:6px; vertical-align:-1px;}
  .precio-leyenda i.pedido{border-color:var(--c-verde);}
  .spark{width:96px; height:28px; display:block;}
  table.simple tr.sel td{background:var(--acento-bg);}
  table.simple tr.fila-suspendida td{opacity:.72;}
  .motivo-susp{font-size:.72rem; color:var(--rojo); margin-top:2px;}
  .susp-resumen{font-size:.82rem; color:var(--rojo); font-weight:600; margin:-8px 0 12px;}
  .spark path{fill:none; stroke:var(--c-verde-claro); stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

  /* ============================================================
     MENSAJES DEL PEDIDO
     ============================================================ */
  .chat-box{margin-top:14px; border:1px solid var(--borde); border-radius:16px; overflow:hidden; background:var(--surface-2); animation:slideDown .35s var(--easing);}
  .chat-msgs{max-height:300px; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; scroll-behavior:smooth;}
  .chat-vacio{font-size:.8rem; color:var(--texto-suave); text-align:center; padding:18px 10px;}
  .msg{max-width:78%; padding:9px 13px; border-radius:14px 14px 14px 4px; background:var(--surface); border:1px solid var(--borde); font-size:.84rem; align-self:flex-start; animation:msgIn .3s var(--spring) backwards; word-wrap:break-word;}
  .msg.mio{align-self:flex-end; background:linear-gradient(135deg, var(--c-verde), #25652F); color:#fff; border-color:transparent; border-radius:14px 14px 4px 14px;}
  .msg .msg-meta{display:block; font-size:.64rem; opacity:.7; margin-bottom:2px; font-weight:600;}
  .chat-form{display:flex; gap:8px; padding:10px; border-top:1px solid var(--borde); background:var(--surface);}
  .chat-form input{flex:1; min-width:0; padding:10px 13px; border:1px solid var(--borde); border-radius:22px; background:var(--input-bg); color:var(--texto); font-size:.84rem; font-family:inherit;}
  .chat-form input:focus{outline:none; border-color:var(--c-limon); box-shadow:var(--glow);}
  .chat-aviso{font-size:.78rem; color:var(--texto-suave); padding:14px; text-align:center;}
  [data-chat].abierto{background:var(--limon-bg); border-color:var(--limon-borde);}

  /* ============================================================
     CHATS ENTRE MAYORISTAS Y PRODUCTORES
     ============================================================ */
  .chats{display:grid; grid-template-columns:300px 1fr; border:1px solid var(--borde); border-radius:18px; overflow:hidden; background:var(--surface); min-height:520px;}
  .chats-lista{display:flex; flex-direction:column; border-right:1px solid var(--borde); background:var(--surface-2); min-width:0; overflow:hidden;}
  .chats-nuevo{padding:12px; border-bottom:1px solid var(--borde);}
  .chats-nuevo select{width:100%;}
  .chats-convs{flex:1; overflow-y:auto; overflow-x:hidden; max-height:500px;}
  .conv-item{display:flex; gap:10px; align-items:center; width:100%; min-width:0; overflow:hidden; padding:12px 14px; border:none; border-bottom:1px solid var(--borde); background:transparent; color:var(--texto); text-align:left; font-family:inherit; transition:background .2s;}
  .conv-item:hover{background:var(--acento-bg);}
  .conv-item.activa{background:var(--limon-bg);}
  .conv-av{flex:none; width:38px; height:38px; border-radius:12px; display:grid; place-items:center; font-family:'Poppins',sans-serif; font-weight:800; font-size:.85rem; color:#22301E; background:linear-gradient(135deg,var(--c-limon),var(--c-verde-claro));}
  .conv-txt{display:block; flex:1; min-width:0;}
  .conv-top{display:flex; justify-content:space-between; gap:8px; align-items:baseline;}
  .conv-nom{font-weight:700; font-size:.86rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .conv-hora{flex:none; font-size:.66rem; color:var(--texto-suave);}
  .conv-prev{display:block; font-size:.76rem; color:var(--texto-suave); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px;}
  .conv-item.nueva .conv-nom, .conv-item.nueva .conv-prev{color:var(--texto); font-weight:800;}
  .conv-dot{flex:none; width:9px; height:9px; border-radius:50%; background:var(--c-naranja);}
  .chats-vacio{font-size:.8rem; color:var(--texto-suave); text-align:center; padding:28px 16px;}
  .chats-panel{display:flex; flex-direction:column; min-width:0;}
  .chats-head{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--borde);}
  .chats-head b{display:block; font-size:.92rem;}
  .chats-head small{display:block; font-size:.72rem; color:var(--texto-suave);}
  .chats-volver{display:none;}
  .chats-panel .chat-msgs{flex:1; max-height:none; min-height:300px; height:380px; background:var(--surface-2);}
  .chats-panel .chat-form{border-top:1px solid var(--borde);}
  .chats-elegir .ic{width:34px; height:34px; color:var(--acento); opacity:.7;}
  .chats-elegir{flex:1; display:grid; place-items:center; text-align:center; padding:30px; color:var(--texto-suave); font-size:.88rem;}
  .btn-contactar{margin-left:auto; flex:none; border:1px solid var(--borde); background:var(--surface); color:var(--texto-suave); border-radius:20px; font-size:.7rem; font-weight:600; padding:3px 9px; transition:.2s;}
  .btn-contactar:hover{border-color:var(--c-verde-claro); color:var(--acento);}
  @media(max-width:640px){
    .chats{grid-template-columns:1fr; min-height:0;}
    .chats-lista{border-right:none;}
    .chats.con-abierta .chats-lista{display:none;}
    .chats:not(.con-abierta) .chats-panel{display:none;}
    .chats-volver{display:inline-flex;}
    .chats-panel .chat-msgs{height:58vh;}
  }

  /* ============================================================
     COTIZACIONES, CALENDARIO DE COSECHA, ALERTAS Y BITÁCORA
     ============================================================ */
  .chats-seguir{margin-left:auto;}
  .cot-zona{border-bottom:1px solid var(--borde); padding:10px 14px; background:var(--surface); max-height:260px; overflow-y:auto;}
  .cot-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .cot-cuenta{font-size:.72rem; color:var(--texto-suave);}
  .cot-form{display:grid; grid-template-columns:2fr 1fr; gap:10px; align-items:end; margin-top:10px; padding:12px; border:1px dashed var(--borde-fuerte); border-radius:14px; background:var(--surface-2);}
  .cot-form .form-row{margin:0;}
  .cot-form > .btn, .cot-form .order-actions{grid-column:1/-1; justify-self:start;}
  .cot-vacio{grid-column:1/-1; font-size:.8rem; color:var(--texto-suave); margin:0;}
  .cot-lista{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .cot-card{border:1px solid var(--borde); border-left:4px solid var(--c-limon); border-radius:0 12px 12px 0; padding:9px 12px; background:var(--surface-2); font-size:.8rem;}
  .cot-card.est-cotizada{border-left-color:var(--c-naranja);}
  .cot-card.est-aceptada{border-left-color:var(--c-verde-claro);}
  .cot-card.est-rechazada, .cot-card.est-cancelada{border-left-color:var(--borde-fuerte); opacity:.7;}
  .cot-top{display:flex; justify-content:space-between; gap:10px; align-items:baseline;}
  .cot-tit{font-weight:700;}
  .cot-estado{flex:none; font-size:.66rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--texto-suave);}
  .cot-nota{color:var(--texto-suave); font-style:italic; margin-top:3px;}
  .cot-precio{margin-top:5px;}
  .cot-card.est-contraoferta{border-left-color:#7A5EA8;}
  .cot-acuerdo{margin-top:5px; color:var(--acento); font-weight:600;}
  .cot-antes{color:var(--texto-suave); text-decoration:line-through;}
  .cot-hist{margin-top:7px; color:var(--texto-suave);}
  .cot-hist summary{cursor:pointer; font-weight:600;}
  .cot-hist ol{margin:6px 0 0 18px; display:grid; gap:3px;}
  .cot-hist li span{color:var(--texto-suave); font-size:.74rem;}
  .cot-acc{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:7px; color:var(--texto-suave);}
  .cot-acc input{width:150px; padding:7px 10px; border:1px solid var(--borde); border-radius:10px; background:var(--input-bg); color:var(--texto); font-family:inherit;}
  .btn-fav{flex:none; border:1px solid var(--borde); background:var(--surface); color:var(--texto-suave); border-radius:20px; font-size:.8rem; line-height:1; padding:3px 8px; transition:.2s;}
  .btn-fav:hover, .btn-fav.on{border-color:#E06A6A; color:#E06A6A;}
  .tabla-scroll{overflow-x:auto;}
  .cal-tabla th, .cal-tabla td{text-align:center; padding:8px 4px;}
  .cal-tabla .cal-prod{text-align:left; min-width:190px; padding-left:12px;}
  .cal-tabla .cal-prod small{display:block; font-size:.7rem; color:var(--texto-suave); margin-top:2px;}
  .cal-tabla .cal-nota{font-style:italic;}
  .cal-tabla th.hoy, .cal-tabla td.hoy{background:var(--limon-bg);}
  .cal-tabla td.on span{display:block; height:14px; border-radius:7px; background:linear-gradient(90deg,var(--c-limon),var(--c-verde-claro));}
  .cal-tabla .cal-acc{white-space:nowrap; padding-right:10px;}
  .cal-reserva td{background:var(--surface-2); text-align:left !important; padding:10px 12px !important;}
  .cal-ley{font-size:.74rem; color:var(--texto-suave); margin-top:10px;}
  .cal-dot{display:inline-block; width:22px; height:10px; border-radius:5px; background:linear-gradient(90deg,var(--c-limon),var(--c-verde-claro)); vertical-align:-1px; margin-right:4px;}
  .al-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:10px;}
  .al-item{display:flex; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--borde); font-size:.84rem;}
  .al-ic{font-size:1.2rem;}
  .al-txt{flex:1; min-width:0;}
  .al-txt small{display:block; font-size:.7rem; color:var(--texto-suave); margin-top:2px;}
  .al-prods{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:10px;}
  .al-prod{display:flex; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--borde); border-radius:14px; background:var(--surface-2);}
  .al-prod b{display:block; font-size:.86rem;}
  .al-prod small{display:block; font-size:.72rem; color:var(--texto-suave);}
  .bit-accion{display:inline-block; font-size:.72rem; font-weight:700; padding:2px 8px; border-radius:10px; background:var(--acento-bg); color:var(--acento); border:1px solid var(--acento-borde); white-space:nowrap;}
  @media(max-width:640px){
    .cot-form{grid-template-columns:1fr;}
    .chats-seguir{padding:6px 10px;}
  }

  /* ============================================================
     AVISO DE STOCK BAJO
     ============================================================ */
  .alerta-stock{display:flex; gap:14px; align-items:flex-start; background:linear-gradient(90deg, var(--limon-bg), transparent 130%); border:1px solid var(--limon-borde); border-left:4px solid var(--c-naranja); border-radius:0 16px 16px 0; padding:14px 18px; margin-bottom:20px; animation:slideDown .5s var(--easing);}
  .alerta-stock .ic{color:var(--c-naranja); width:22px; height:22px; margin-top:2px; animation:wiggle 2.4s ease-in-out infinite;}
  .alerta-stock b{display:block; font-size:.9rem; margin-bottom:6px;}
  .alerta-lista{display:flex; flex-wrap:wrap; gap:8px;}
  .alerta-lista button{display:inline-flex; align-items:center; gap:6px; font-size:.74rem; font-weight:600; padding:5px 11px; border-radius:20px; border:1px solid var(--limon-borde); background:var(--surface); color:var(--texto); transition:.2s;}
  .alerta-lista button:hover{border-color:var(--c-naranja); color:var(--c-naranja);}
  .alerta-lista button em{font-style:normal; font-weight:800; color:var(--c-naranja);}
  .alerta-nota{margin:8px 0 0; font-size:.74rem; color:var(--texto-suave); line-height:1.45;}

  /* ============================================================
     MAPA DE RECORRIDO
     ============================================================ */
  .trace-map{grid-column:1/-1; height:320px; border-radius:14px; overflow:hidden; border:1px solid var(--borde); background:var(--surface-2); position:relative; z-index:0; animation:fadeIn .4s ease;}
  .map-cargando{display:grid; place-items:center; height:100%; color:var(--texto-suave); font-size:.82rem;}
  .map-pin{font-size:22px; line-height:34px; text-align:center; background:var(--surface); border:2px solid var(--c-verde); border-radius:50%; box-shadow:0 4px 12px rgba(0,0,0,.25);}
  .map-pin.destino{border-color:var(--c-limon);}
  /* Leaflet ubica los íconos con transform: la animación va en un elemento interno. */
  .map-truck span{display:block; font-size:24px; line-height:38px; text-align:center; background:var(--c-limon); border-radius:50%; box-shadow:0 0 0 6px rgba(242,194,48,.3), 0 6px 14px rgba(0,0,0,.3); animation:bob 2s ease-in-out infinite;}
  .leaflet-container{font-family:'Inter',sans-serif; background:var(--surface-2);}
  .trace-map .leaflet-tile-pane{filter:saturate(.75) sepia(.12);}
  [data-theme="dark"] .trace-map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.5);}
  .leaflet-tooltip{font-family:'Inter',sans-serif; font-size:.76rem; font-weight:600;}
  [data-theme="dark"] .leaflet-bar a{background:var(--surface); color:var(--texto); border-color:var(--borde);}
  [data-theme="dark"] .leaflet-control-attribution{background:rgba(16,23,14,.75) !important; color:var(--texto-suave);}
  [data-theme="dark"] .leaflet-control-attribution a{color:var(--acento);}
  /* ============================================================
     MAPA DE PRODUCTORES (CATÁLOGO)
     ============================================================ */
  .cat-meta-acc{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .cat-meta-acc .btn .ic{width:15px; height:15px;}
  .btn.on{border-color:var(--acento); color:var(--acento); background:var(--limon-bg);}
  .cat-mapa-wrap{margin-bottom:22px;}
  .trace-map.cat-map{height:380px;}
  .map-pin.prod{position:relative;}
  .map-pin.prod .mp-n{position:absolute; top:-7px; right:-9px; min-width:20px; height:20px; padding:0 5px; border-radius:10px; background:var(--c-verde); color:#fff; font:700 .68rem/20px Inter,sans-serif; box-shadow:0 2px 6px rgba(0,0,0,.25);}
  .map-pin.prod.sel{border-color:var(--c-naranja); box-shadow:0 0 0 5px rgba(232,137,43,.35), 0 4px 12px rgba(0,0,0,.25);}
  .map-pin.prod.sel .mp-n{background:var(--c-naranja);}
  .mp-pop{display:grid; gap:4px; font-family:'Inter',sans-serif; font-size:.8rem; min-width:190px;}
  .mp-pop b{font-size:.92rem;}
  .mp-pop .mp-lugar, .mp-pop .mp-rate{color:#5d6b57; font-size:.74rem;}
  .mp-pop ul{margin:4px 0; padding-left:16px;}
  .mp-pop li em{font-style:normal; font-weight:700; color:#2f7a35;}
  .mp-pop button{margin-top:4px; padding:7px 10px; border-radius:9px; border:0; background:#2f7a35; color:#fff; font:600 .78rem Inter,sans-serif; cursor:pointer;}
  .mp-pop button:focus-visible{outline:2px solid #E8892B; outline-offset:2px;}

  /* ============================================================
     PEDIDOS PROGRAMADOS
     ============================================================ */
  .prog-box{border:1px solid var(--borde); background:var(--surface-2); border-radius:16px; padding:16px 18px; margin-bottom:20px; display:grid; gap:10px;}
  .prog-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .prog-head h4{display:flex; align-items:center; gap:8px; font-size:.95rem; margin:0;}
  .prog-head h4 .ic{width:18px; height:18px; color:var(--acento);}
  .prog-n{font-size:.72rem; font-weight:700; color:var(--acento); background:var(--limon-bg); border:1px solid var(--limon-borde); border-radius:20px; padding:3px 10px;}
  .prog-item{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 14px; border-radius:12px; background:var(--surface); border:1px solid var(--borde);}
  .prog-item.pausado{opacity:.7;}
  .prog-info{display:grid; gap:2px; min-width:0;}
  .prog-info b{font-size:.88rem;}
  .prog-info span{font-size:.76rem; color:var(--texto-suave);}
  .prog-info .prog-prox b{font-size:inherit; color:var(--acento);}
  .prog-info .prog-ult{font-style:italic;}
  .prog-acc{display:flex; gap:6px; flex-wrap:wrap;}
  .prog-hint{margin:0; font-size:.76rem; color:var(--texto-suave); line-height:1.45;}
  .prog-form{margin-top:12px; padding:14px 16px; border-radius:14px; border:1px dashed var(--limon-borde); background:var(--limon-bg); display:grid; gap:10px;}
  .prog-form h5{margin:0; font-size:.86rem;}
  .chip-prog{display:inline-block; vertical-align:middle; margin-left:6px; font-size:.66rem; font-weight:700; padding:2px 8px; border-radius:20px; background:var(--limon-bg); border:1px solid var(--limon-borde); color:var(--texto);}
  .map-leyenda{display:flex; gap:14px; flex-wrap:wrap; font-size:.74rem; color:var(--texto-suave); margin-top:8px;}

  /* ============================================================
     APP INSTALABLE
     ============================================================ */
  .hero-apps{margin-top:26px; max-width:520px; animation:fadeUp .7s var(--easing) .65s backwards;}
  .hero-apps-tit{display:block; font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--c-limon-claro); margin-bottom:10px;}
  .hero-apps-btns{display:flex; gap:10px; flex-wrap:wrap;}
  .app-dl{display:flex; align-items:center; gap:11px; flex:1 1 200px; padding:11px 14px; border-radius:14px; background:#fff; color:#173423; text-decoration:none; box-shadow:0 10px 24px rgba(0,0,0,.18); transition:transform .25s var(--easing), box-shadow .25s;}
  .app-dl:hover{transform:translateY(-3px); box-shadow:0 14px 30px rgba(0,0,0,.26);}
  .app-dl .ic{width:26px; height:26px; color:#2E7D3E; flex-shrink:0;}
  .app-dl b{display:block; font-size:.9rem; line-height:1.2;}
  .app-dl small{display:block; font-size:.72rem; color:#4b5f52;}
  .app-dl.sugerida{outline:3px solid var(--c-limon); outline-offset:2px;}
  .hero-apps-nota{margin-top:9px; font-size:.72rem; color:rgba(255,255,255,.68);}
  .side-apps{border:1px solid var(--borde); background:var(--surface); border-radius:16px; padding:12px 14px; display:grid; gap:8px;}
  .side-apps-tit{font-size:.72rem; font-weight:700; color:var(--texto-suave); text-transform:uppercase; letter-spacing:.06em;}
  .side-apps a{display:flex; align-items:center; gap:9px; font-size:.8rem; font-weight:600; color:var(--texto); text-decoration:none; padding:7px 9px; border-radius:10px; transition:background .2s;}
  .side-apps a:hover{background:var(--acento-bg); color:var(--acento);}
  .side-apps .ic{width:17px; height:17px; color:var(--acento);}
  .install-btn{display:flex; align-items:center; gap:10px; width:100%; padding:12px 14px; border-radius:16px; border:1px solid var(--acento-borde); background:var(--acento-bg); color:var(--acento); font-weight:700; font-size:.82rem; transition:.25s var(--easing); text-align:left;}
  .install-btn:hover{transform:translateY(-2px); box-shadow:var(--sombra-sm);}
  .install-btn small{display:block; font-weight:500; color:var(--texto-suave); font-size:.7rem;}
  @keyframes dibujar{to{stroke-dashoffset:0;}}
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  @keyframes msgIn{from{opacity:0; transform:translateY(8px) scale(.96);} to{opacity:1; transform:none;}}
  @keyframes wiggle{0%,80%,100%{transform:rotate(0);} 85%{transform:rotate(-12deg);} 90%{transform:rotate(10deg);} 95%{transform:rotate(-6deg);}}
  @media(max-width:640px){
    .trace-map{height:260px;}
    .msg{max-width:90%;}
    .spark{display:none;}
  }

  ::view-transition-old(root), ::view-transition-new(root){animation:none; mix-blend-mode:normal;}

  /* ============================================================
     KEYFRAMES
     ============================================================ */
  @keyframes fadeUp{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;}}
  @keyframes panelIn{from{opacity:0; transform:translateY(10px); filter:blur(4px);} to{opacity:1; transform:none; filter:none;}}
  @keyframes fadeInRow{from{opacity:0; transform:translateX(-8px);} to{opacity:1; transform:none;}}
  @keyframes slideDown{from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:none;}}
  @keyframes slideInLeft{from{opacity:0; transform:translateX(-22px);} to{opacity:1; transform:none;}}
  @keyframes growX{from{transform:scaleX(0);} to{transform:scaleX(1);}}
  @keyframes growY{from{transform:scaleY(0);} to{transform:scaleY(1);}}
  @keyframes popIn{from{transform:scale(0); opacity:0;} to{transform:scale(1); opacity:1;}}
  @keyframes iconPop{0%{transform:scale(.6) rotate(-20deg);} 100%{transform:none;}}
  @keyframes badgePop{from{transform:scale(.4); opacity:0;} to{transform:scale(1); opacity:1;}}
  @keyframes addedPop{0%{transform:scale(1);} 40%{transform:scale(1.08);} 100%{transform:scale(1);}}
  @keyframes bump{0%{transform:scale(1);} 35%{transform:scale(1.14) rotate(-3deg);} 100%{transform:scale(1);}}
  @keyframes bob{0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);}}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(0);} 50%{transform:translateY(-16px) rotate(8deg);}}
  @keyframes floatDrift{0%,100%{transform:translate(0,0);} 50%{transform:translate(-18px,22px);}}
  @keyframes shine{to{background-position:200% center;}}
  @keyframes shake{0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-6px);} 40%,80%{transform:translateX(6px);}}
  @keyframes authIn{from{opacity:0; transform:translateY(18px) scale(.98); filter:blur(6px);} to{opacity:1; transform:none; filter:none;}}
  @keyframes ping{75%,100%{transform:scale(2.6); opacity:0;}}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.45;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes loadBounce{0%,80%,100%{transform:scale(.6); opacity:.4;} 40%{transform:scale(1); opacity:1;}}
  @keyframes stockPulse{0%{transform:scale(1);} 40%{transform:scale(1.28);} 100%{transform:scale(1);}}
  @keyframes ring{0%{transform:scale(1); opacity:.6;} 100%{transform:scale(1.7); opacity:0;}}

  @keyframes borderFlow{0%{background-position:0% 50%;} 100%{background-position:220% 50%;}}

  .pf-galeria .gal-add{display:grid; place-items:center; text-align:center; font-size:.78rem; color:var(--texto-suave); cursor:pointer; border-style:dashed;}
  .btn-ficha{border:0; background:none; padding:0; color:inherit; font:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:5px; text-decoration:underline dotted; text-underline-offset:3px;}

  .campana-btn .ic{width:18px; height:18px;}
  .campana-n{position:absolute; top:-4px; right:-4px; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:#d9381e; color:#fff; font-size:.65rem; font-weight:700; display:grid; place-items:center;}
  .campana-panel{position:absolute; right:0; top:46px; z-index:250; width:300px; max-width:calc(100vw - 24px); background:var(--surface); border:1px solid var(--borde); border-radius:16px; box-shadow:var(--sombra-fuerte); padding:8px;}

  .campana-vacia{padding:14px 8px; font-size:.8rem; color:var(--texto-suave);}
  .flete-box, .listas-box{margin-top:14px; padding-top:12px; border-top:1px dashed var(--borde); font-size:.8rem;}
  .flete-box h5, .listas-box h5{margin:0 0 6px; font-size:.82rem;}

  .listas-fila{display:flex; gap:6px; margin-top:6px;}

  .btn-denunciar{flex:none; border:1px solid var(--borde); background:var(--surface); color:var(--texto-suave); border-radius:20px; font-size:.7rem; padding:3px 8px; cursor:pointer;}
  .btn-denunciar:hover{color:#d9381e; border-color:#d9381e;}
  .meta-box{background:var(--surface); border:1px solid var(--borde); border-radius:16px; padding:16px 18px; margin:16px 0;}
  .meta-box h4{margin:0 0 8px;}
  .meta-barra{height:12px; border-radius:6px; background:var(--surface-2); overflow:hidden; margin:8px 0;}
  .meta-barra span{display:block; height:100%; background:linear-gradient(90deg,var(--c-limon),var(--c-verde-claro)); border-radius:6px; transition:width .6s var(--easing);}

  .meta-fila input{width:160px; padding:7px 10px; border:1px solid var(--borde); border-radius:10px; background:var(--input-bg); color:var(--texto);}
  @media (max-width:700px){ .oferta-box .form-grid{grid-template-columns:1fr 1fr;} .clima{grid-template-columns:repeat(4,1fr);} }
</style>

const firebaseConfig = {

const auth = firebase.auth();
const db = firebase.firestore();
const FieldValue = firebase.firestore.FieldValue;

/* ---------- Modo sin conexión (offline-first) ----------
   Firestore guarda en el dispositivo una copia de los datos que ya se vieron y
   anota los cambios hechos sin señal; cuando vuelve la conexión los manda solo.
   Así el productor puede cargar datos en la finca y se sincronizan después.
   Tiene que activarse antes de cualquier lectura o escritura. */
let cacheLocal = true;
db.enablePersistence({ synchronizeTabs: true }).catch(function(err){
  // failed-precondition: otra pestaña vieja la tiene tomada; unimplemented: navegador sin IndexedDB.
  cacheLocal = false;

let cambiosSinSincronizar = 0;
/* Envuelve una escritura de Firestore. Con conexión espera la confirmación del
   servidor como siempre; sin conexión (o con señal muy débil) da el cambio por
   guardado en el dispositivo enseguida, para no dejar la pantalla esperando,
   y avisa si después el servidor lo rechaza. */
function guardar(promesa){
  let resueltaSinRed = false;
  const real = Promise.resolve(promesa);
  const espera = new Promise(function(ok){
    setTimeout(function(){ resueltaSinRed = true; ok({ pendiente: true }); }, navigator.onLine ? 7000 : 250);
  });
  real.then(function(){
    if(resueltaSinRed){ cambiosSinSincronizar = Math.max(0, cambiosSinSincronizar - 1); actualizarBarraOffline(); }
  }, function(err){
    if(!resueltaSinRed) return;
    cambiosSinSincronizar = Math.max(0, cambiosSinSincronizar - 1); actualizarBarraOffline();
    showToast('Un cambio hecho sin conexión no se pudo sincronizar: ' + ((err && err.message) || 'error desconocido'));
  });
  return Promise.race([real, espera]).then(function(r){
    if(r && r.pendiente){
      cambiosSinSincronizar++;
      actualizarBarraOffline();
      setTimeout(function(){ showToast('Guardado en el dispositivo: se sincroniza cuando vuelva la señal'); }, 3400);
    }
    return r;
  });
}
function actualizarBarraOffline(){
  const pill = document.getElementById('livePill');
  if(pill){
    pill.classList.toggle('sin-red', !navigator.onLine);
    pill.lastChild.textContent = navigator.onLine ? 'Conectado' : 'Sin conexión';
  }
  const barra = document.getElementById('offlineBar');
  if(!barra) return;
  const sinRed = !navigator.onLine;
  barra.hidden = !sinRed && !cambiosSinSincronizar;
  barra.classList.toggle('sincronizando', !sinRed);
  const n = cambiosSinSincronizar;
  barra.querySelector('span').textContent = sinRed
    ? 'Sin conexión. Podés seguir trabajando: ' + (n ? n + (n === 1 ? ' cambio guardado' : ' cambios guardados') + ' en el dispositivo' : 'los cambios se guardan en el dispositivo') + ' y se sincronizan solos al volver la señal.'
    : 'Volvió la conexión. Sincronizando ' + n + (n === 1 ? ' cambio' : ' cambios') + '…';
}
window.addEventListener('offline', actualizarBarraOffline);
window.addEventListener('online', function(){
  const habia = cambiosSinSincronizar;

});

/* Reputación de cada productor a partir de las calificaciones.
   El orden usa un promedio bayesiano: suma C votos "promedio" a cada productor,
   así uno con una sola calificación de 5 no supera a otro con muchas altas. */
function reputacion(){
  const C = 3;
  const mapa = {};
  let sumaGlobal = 0, nGlobal = 0;
  // Todos los productores con publicaciones aparecen, aunque no tengan votos.
  S.lots.forEach(function(l){
    if(!mapa[l.productorUid]) mapa[l.productorUid] = { uid: l.productorUid, nombre: l.productorNombre, suma: 0, n: 0, dist: [0,0,0,0,0], opiniones: [] };
  });
  S.ratings.forEach(function(r){
    const e = parseInt(r.estrellas, 10);
    if(!(e >= 1 && e <= 5) || !r.productorUid) return;
    const m = mapa[r.productorUid] || (mapa[r.productorUid] = { uid: r.productorUid, nombre: r.productorNombre, suma: 0, n: 0, dist: [0,0,0,0,0], opiniones: [] });
    if(!m.nombre) m.nombre = r.productorNombre;
    m.suma += e; m.n++; m.dist[e-1]++;
    if(r.comentario) m.opiniones.push(r);
    sumaGlobal += e; nGlobal++;
  });
  const media = nGlobal ? sumaGlobal / nGlobal : 0;
  const lista = Object.keys(mapa).map(function(k){
    const m = mapa[k];
    m.nombre = m.nombre || 'Productor';
    m.prom = m.n ? m.suma / m.n : 0;
    m.puntaje = m.n ? (C * media + m.suma) / (C + m.n) : -1;
    return m;
  }).sort(function(a, b){ return (b.puntaje - a.puntaje) || (b.n - a.n) || a.nombre.localeCompare(b.nombre, 'es'); });
  const porUid = {};
  lista.forEach(function(m, i){ m.puesto = m.n ? i + 1 : null; porUid[m.uid] = m; });
  return { lista: lista, porUid: porUid, conVotos: lista.filter(function(m){ return m.n; }).length };
}

function semillaDe(txt){ let h = 7; for(let i = 0; i < txt.length; i++) h = (h * 31 + txt.charCodeAt(i)) >>> 0; return h % 1000000; }

/* Foto subida por el productor: se achica en el navegador (máx. ~900 px, JPEG)
   para que pese alrededor de 100 KB y entre cómodamente en el documento del lote. */
function procesarFoto(file, op){
  op = op || {};
  return new Promise(function(ok, mal){
    if(!file) return mal(new Error('No elegiste ninguna imagen'));
    if(!/^image\//.test(file.type)) return mal(new Error('El archivo no es una imagen'));
    if(file.size > 20 * 1024 * 1024) return mal(new Error('La imagen pesa más de 20 MB'));
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function(){
      URL.revokeObjectURL(url);
      const LIMITE = op.limite || 190000;   // caracteres del data URL (~140 KB)
      let data = '';
      // Con op.cuadrada se recorta al centro (foto de perfil o logo).
      const lado = Math.min(img.naturalWidth, img.naturalHeight);
      const sx = op.cuadrada ? (img.naturalWidth - lado) / 2 : 0, sy = op.cuadrada ? (img.naturalHeight - lado) / 2 : 0;
      const sw = op.cuadrada ? lado : img.naturalWidth, sh = op.cuadrada ? lado : img.naturalHeight;
      (op.tamanos || [900, 720, 560]).some(function(max){
        const esc = Math.min(1, max / Math.max(sw, sh));
        const w = Math.round(sw * esc), h = Math.round(sh * esc);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
        for(let q = 0.82; q >= 0.5; q -= 0.08){
          data = c.toDataURL('image/jpeg', q);
          if(data.length <= LIMITE) return true;
        }
        return false;
      });
      if(!data || data.length > LIMITE) return mal(new Error('No se pudo achicar la imagen lo suficiente'));
      ok(data);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); mal(new Error('No se pudo leer la imagen. Probá con una foto JPG o PNG.')); };
    img.src = url;
  });
}

/* Reintento en segundo plano: de a una foto por vez (el servicio gratuito
   limita cuántas genera seguidas). Cuando una queda lista, se muestra. */
let reintentandoFoto = false;

/* ---------- Historial de precios ----------
   Combina los cambios de precio guardados en el lote con el precio de cada
   pedido realizado sobre él, y termina en el precio de hoy. */
function puntosPrecio(l){
  const pts = [];
  (l.historialPrecios || []).forEach(function(h){ if(h && h.precio > 0 && h.fecha) pts.push({ t: h.fecha, precio: h.precio, tipo: 'cambio' }); });
  S.orders.forEach(function(o){
    if(o.lotId === l.id && !o.cancelado && o.price > 0 && o.createdAt && o.createdAt.toMillis) pts.push({ t: o.createdAt.toMillis(), precio: o.price, tipo: 'pedido', numero: o.numero });
  });
  if(!pts.length && l.createdAt && l.createdAt.toMillis) pts.push({ t: l.createdAt.toMillis(), precio: l.price, tipo: 'cambio' });
  pts.sort(function(a, b){ return a.t - b.t; });
  pts.push({ t: Date.now(), precio: l.price, tipo: 'hoy' });
  return pts;
}
/* Variación del precio actual contra el precio anterior distinto. */
function tendenciaPrecio(l){
  const pts = puntosPrecio(l);
  for(let i = pts.length - 2; i >= 0; i--){
    if(pts[i].precio !== l.price) return (l.price - pts[i].precio) / pts[i].precio * 100;
  }
  return 0;
}
function chipTendencia(v){
  if(!v || Math.abs(v) < 0.5) return '';
  const up = v > 0;
  return '<span class="trend '+(up ? 'up' : 'down')+'" title="Variación contra el precio anterior">'+(up ? '▲' : '▼')+' '+Math.abs(v).toFixed(0)+' %</span>';
}

/* ---------- Stock bajo (productor) ----------
   Cada lote avisa cuando su stock baja del límite que eligió el productor (o del
   25 % de lo publicado si no eligió ninguno) y también cuando, al ritmo de venta
   del último mes, se agotaría en una semana o menos. */
const DIAS_AVISO_AGOTAR = 7;
function umbralStock(l){
  if(l.alertaStock > 0) return l.alertaStock;
  const inicial = (l.stockInicial && l.stockInicial > 0) ? l.stockInicial : Math.max(l.stock, 1);
  return inicial * 0.25;
}
/* Unidades por día vendidas del lote, según los pedidos confirmados de los últimos 30 días. */
function ritmoVenta(l){
  const desde = Date.now() - 30 * 86400e3;
  let total = 0;
  S.orders.forEach(function(o){
    if(o.lotId === l.id && !o.cancelado && o.statusIdx >= 1 && msDe(o.createdAt) >= desde) total += Number(o.qty) || 0;
  });
  return total / 30;
}
/* Días que faltan para que se agote al ritmo actual, o null si no hubo ventas recientes. */
function diasParaAgotar(l){
  const r = ritmoVenta(l);
  if(!(r > 0) || !(l.stock > 0)) return null;
  return Math.max(1, Math.round(l.stock / r));
}
function textoDias(d){ return '~' + d + (d === 1 ? ' día' : ' días'); }
function motivoStockBajo(l){
  if(l.stock === 0) return 'agotado';
  const dias = diasParaAgotar(l);
  if(l.stock <= umbralStock(l)) return 'quedan ' + l.stock.toLocaleString('es-AR') + ' ' + l.unit + (dias !== null ? ' · ' + textoDias(dias) : '');
  if(dias !== null && dias <= DIAS_AVISO_AGOTAR) return 'se agota en ' + textoDias(dias);
  return null;
}
function lotesStockBajo(){
  return S.lots.filter(function(l){
    if(l.archivado || l.productorUid !== currentUser.uid) return false;
    return motivoStockBajo(l) !== null;
  });
}
function revisarStockBajo(){
  if(!currentUser || currentUser.rol !== 'productor') return;
  const bajos = lotesStockBajo();
  const nuevos = bajos.filter(function(l){ return !avisadosStock[l.id]; });
  Object.keys(avisadosStock).forEach(function(id){ if(!bajos.some(function(l){ return l.id === id; })) delete avisadosStock[id]; });
  nuevos.forEach(function(l){ avisadosStock[l.id] = true; });
  if(nuevos.length){
    showToast('⚠ Stock bajo: ' + nuevos.map(function(l){ return l.name + ' (' + motivoStockBajo(l) + ')'; }).join(', ') + '. Reponelo desde Mis publicaciones.');
  }
}

/* ---------- Mapa de recorrido (Leaflet, se carga solo al abrir un mapa) ---------- */
const COORDS_PROV = {
  'Buenos Aires':[-34.92,-57.95], 'CABA':[-34.60,-58.38], 'Catamarca':[-28.47,-65.78], 'Chaco':[-27.45,-58.99],
  'Chubut':[-43.30,-65.10], 'Córdoba':[-31.42,-64.18], 'Corrientes':[-27.47,-58.83], 'Entre Ríos':[-31.73,-60.53],
  'Formosa':[-26.18,-58.17], 'Jujuy':[-24.19,-65.30], 'La Pampa':[-36.62,-64.29], 'La Rioja':[-29.41,-66.86],
  'Mendoza':[-32.89,-68.83], 'Misiones':[-27.37,-55.90], 'Neuquén':[-38.95,-68.06], 'Río Negro':[-40.81,-63.00],
  'Salta':[-24.79,-65.41], 'San Juan':[-31.54,-68.53], 'San Luis':[-33.30,-66.34], 'Santa Cruz':[-51.62,-69.22],
  'Santa Fe':[-31.63,-60.70], 'Santiago del Estero':[-27.79,-64.26], 'Tierra del Fuego':[-54.80,-68.30], 'Tucumán':[-26.82,-65.22]
};
let leafletPromesa = null;
function cargarLeaflet(){
  if(window.L) return Promise.resolve();
  if(leafletPromesa) return leafletPromesa;
  function cargar(tag, attrs){
    return new Promise(function(ok, mal){
      const el = document.createElement(tag);
      Object.keys(attrs).forEach(function(k){ el[k] = attrs[k]; });
      el.onload = function(){ ok(); };
      el.onerror = function(){ mal(new Error('No se pudo cargar el mapa')); };
      document.head.appendChild(el);
    });
  }
  // Se espera también la hoja de estilos: sin ella el mapa se dibuja desarmado.
  leafletPromesa = Promise.all([
    cargar('link', { rel: 'stylesheet', href: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css' }),
    cargar('script', { src: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js' })
  ]).catch(function(err){ leafletPromesa = null; throw err; });
  return leafletPromesa;
}
function provinciaDeDireccion(dir){
  if(!dir) return null;
  const partes = String(dir).split(',');
  const ult = partes[partes.length - 1].trim();
  return COORDS_PROV[ult] ? ult : null;
}
/* Fracción del recorrido según el paso de trazabilidad. */
function avanceRecorrido(o){
  if(o.statusIdx >= 4) return 1;
  return { '-1':0, '0':0.04, '1':0.22, '2':0.62, '3':1 }[String(o.traceIdx)] || 0;
}
function curvaRuta(a, b, n){
  const dx = b[1] - a[1], dy = b[0] - a[0];
  const c = [(a[0] + b[0]) / 2 + dx * 0.18, (a[1] + b[1]) / 2 - dy * 0.18];
  const pts = [];
  for(let i = 0; i <= n; i++){
    const t = i / n, u = 1 - t;
    pts.push([u*u*a[0] + 2*u*t*c[0] + t*t*b[0], u*u*a[1] + 2*u*t*c[1] + t*t*b[1]]);
  }
  return pts;
}
/* Mosaicos de OpenStreetMap (gratis, con atribución). En modo oscuro se
   oscurecen con un filtro CSS sobre la capa, no hace falta otro proveedor. */
function tilesMapa(){
  return L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 18
  });
}
function dibujarMapa(o){
  // Origen: la finca (dirección del productor). Destino: la dirección de entrega
  // del pedido. Se usan coordenadas exactas cuando se conocen; si no, la capital provincial.
  const e = o.entrega || {};
  const coordsEntrega = (typeof e.lat === 'number' && typeof e.lng === 'number') ? [e.lat, e.lng] : null;
  Promise.all([
    cargarLeaflet(),
    usuarioPorUid(o.productorUid).then(function(u){ return ubicacionDe(u, null, null, 'Tucumán'); }),
    (coordsEntrega || e.direccion ? Promise.resolve(null) : usuarioPorUid(o.mayoristaUid))
      .then(function(u){ return ubicacionDe(u, e.direccion, coordsEntrega, 'Buenos Aires'); })
  ]).then(function(r){
    const el = document.getElementById('mapa-' + o.id);
    if(!el || el._mapa) return;
    const orig = r[1].p;
    let dest = r[2].p;
    const provO = r[1].etiqueta, provD = r[2].etiqueta;
    if(Math.abs(orig[0] - dest[0]) + Math.abs(orig[1] - dest[1]) < 0.02) dest = [orig[0] - 0.3, orig[1] + 0.4];   // mismo punto: se separan un poco
    el.innerHTML = '';
    const mapa = L.map(el, { scrollWheelZoom: false });
    el._mapa = mapa;
    el._tiles = tilesMapa().addTo(mapa);
    const ruta = curvaRuta(orig, dest, 60);
    L.polyline(ruta, { color: '#F2C230', weight: 4, opacity: .85, dashArray: '8 10' }).addTo(mapa);
    const hecho = L.polyline([], { color: '#67B75A', weight: 5, opacity: .95 }).addTo(mapa);
    L.marker(orig, { icon: L.divIcon({ className: 'map-pin', html: '🌿', iconSize: [36, 36] }) })
      .addTo(mapa).bindTooltip('Origen: finca · ' + esc(provO), { direction: 'top', offset: [0, -16] });
    L.marker(dest, { icon: L.divIcon({ className: 'map-pin destino', html: '🏬', iconSize: [36, 36] }) })
      .addTo(mapa).bindTooltip('Destino: depósito · ' + esc(provD), { direction: 'top', offset: [0, -16] });
    const camion = L.marker(ruta[0], { icon: L.divIcon({ className: 'map-truck', html: '<span>🚚</span>', iconSize: [40, 40] }), zIndexOffset: 1000 }).addTo(mapa);
    mapa.fitBounds(L.latLngBounds(ruta).pad(0.3));
    function ubicar(f){
      const i = Math.round(f * (ruta.length - 1));
      camion.setLatLng(ruta[i]);
      hecho.setLatLngs(ruta.slice(0, i + 1));
    }
    el._actualizar = function(ord){ ubicar(avanceRecorrido(ord)); };
    const meta = avanceRecorrido(o);
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(mapaAnimado === o.id || reduce){ ubicar(meta); return; }
    mapaAnimado = o.id;
    const t0 = performance.now(), dur = 1800;
    (function paso(ahora){
      const p = Math.min(1, (ahora - t0) / dur);
      ubicar(meta * (1 - Math.pow(1 - p, 3)));
      if(p < 1 && el.isConnected) requestAnimationFrame(paso);
    })(t0);
  }).catch(function(err){
    const el = document.getElementById('mapa-' + o.id);
    if(el) el.innerHTML = '<div class="map-cargando">No se pudo cargar el mapa: ' + esc(err.message) + '</div>';
  });
}

  const m = mapaAbierto && document.getElementById('mapa-' + mapaAbierto);

  mapaAbierto = null;

    const capa = L.layerGroup().addTo(mapa);
    let encuadrado = false, pedido = 0, firma = '';
    el._actualizar = function(){
      // Solo se redibujan las marcas si cambió lo que muestran (así no se cierra un popup abierto).
      const nueva = prodFilter + '|' + datosMapaCat.map(function(g){ return g.uid + ':' + g.lotes.map(function(l){ return l.id + '/' + l.price; }).join(','); }).join(';');
      if(nueva === firma) return;
      firma = nueva;
      const n = ++pedido;
      Promise.all(datosMapaCat.map(function(g){
        return ubicacionDe(contactoPorUid(g.uid), null, null, 'Tucumán').then(function(u){
          return Object.assign({}, g, { pos: u.p, lugar: u.etiqueta, exacta: u.exacta });
        });
      })).then(function(res){
        if(n !== pedido || !el._mapa) return;
        capa.clearLayers();
        // Fincas en el mismo punto (por ejemplo, ubicadas por la capital provincial) se separan un poco.
        const usados = [];
        res.forEach(function(g){
          let pos = g.pos.slice(), vuelta = 0;
          while(usados.some(function(u){ return Math.abs(u[0] - pos[0]) + Math.abs(u[1] - pos[1]) < 0.04; }) && vuelta < 12){
            vuelta++;
            pos = [g.pos[0] + Math.sin(vuelta * 2.1) * 0.07 * Math.ceil(vuelta / 6), g.pos[1] + Math.cos(vuelta * 2.1) * 0.07 * Math.ceil(vuelta / 6)];
          }
          usados.push(pos);
          const sel = prodFilter === g.uid;
          L.marker(pos, { icon: L.divIcon({ className: 'map-pin prod' + (sel ? ' sel' : ''), html: '🌿<span class="mp-n">' + g.lotes.length + '</span>', iconSize: [36, 36] }), zIndexOffset: sel ? 500 : 0 })
            .addTo(capa)
            .bindTooltip(esc(g.nombre), { direction: 'top', offset: [0, -16] })
            .bindPopup(popupProductor(g), { maxWidth: 260 });
        });
        if(!encuadrado && usados.length){
          encuadrado = true;
          if(usados.length === 1) mapa.setView(usados[0], 9);
          else mapa.fitBounds(L.latLngBounds(usados).pad(0.3), { maxZoom: 9 });
        }
      });
    };
    // Los popups de Leaflet frenan los clics, así que el botón se engancha al abrirse.
    mapa.on('popupopen', function(e){
      const b = e.popup.getElement() && e.popup.getElement().querySelector('[data-mapa-prod]');
      if(!b) return;
      b.addEventListener('click', function(){
        prodFilter = b.dataset.mapaProd; itemFilter = 'todos';
        mapa.closePopup();
        renderMain();
        const grid = document.getElementById('catGrid');
        if(grid) grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
    el._actualizar();
  }).catch(function(err){
    const el = document.getElementById('mapa-catalogo');
    if(el) el.innerHTML = '<div class="map-cargando">No se pudo cargar el mapa: ' + esc(err.message) + '</div>';
  });
}

function sinAcentos(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('alt');   // alterna la animación para que la barra de tiempo reinicie
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3200);
}
/* Anima un número entre dos valores, para que se vea el stock bajando. */
function animarNumero(el, desde, hasta, ms){
  if(!el) return;
  if(el._anim) cancelAnimationFrame(el._anim);
  if(desde === hasta){ el.textContent = hasta.toLocaleString('es-AR'); return; }
  const t0 = (window.performance && performance.now) ? performance.now() : Date.now();
  const dur = ms || 420;
  function paso(){
    const ahora = (window.performance && performance.now) ? performance.now() : Date.now();
    const p = Math.min(1, (ahora - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    const v = Math.round(desde + (hasta - desde) * eased);
    el.textContent = v.toLocaleString('es-AR');
    if(p < 1) el._anim = requestAnimationFrame(paso);
    else { el._anim = null; el.textContent = hasta.toLocaleString('es-AR'); }
  }
  el._anim = requestAnimationFrame(paso);
}

/* Muestra cuánto stock quedaría si se confirmara lo que el mayorista tiene en pantalla.
   Es una previsualización: el descuento real ocurre cuando el productor confirma. */
function previsualizarStock(lotId){
  const el = document.querySelector('.stock-num[data-stock-id="'+lotId+'"]');
  if(!el) return;
  const p = lotById(lotId);
  if(!p) return;
  const input = document.querySelector('.qty-input[data-id="'+lotId+'"]');
  const enCarrito = S.cart[lotId] || 0;
  const enPantalla = input ? parseInt(input.value, 10) || 0 : 0;
  const reservado = Math.max(enCarrito, enPantalla);
  const proyectado = Math.max(0, p.stock - reservado);
  const actual = parseInt((el.textContent || '0').replace(/\D/g,''), 10) || p.stock;
  animarNumero(el, actual, proyectado);
  el.classList.toggle('bajando', proyectado < p.stock);
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
}

/* Unidad de un pedido: la guardada al crearlo, o la del lote, o kg por compatibilidad */
function unitOf(o){
  if(o && o.unit) return o.unit;
  const p = o ? lotById(o.lotId) : null;
  return (p && p.unit) ? p.unit : 'kg';
}
function traceStatusIdx(traceIdx){
  if(traceIdx <= 0) return 1;
  if(traceIdx <= 2) return 2;
  if(traceIdx === 3) return 3;
  return 4;
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function mapAuthError(code){
  const m = {
    'auth/email-already-in-use':'Ese correo ya está registrado. Iniciá sesión en su lugar.',
    'auth/invalid-email':'El correo ingresado no es válido.',
    'auth/weak-password':'La contraseña debe tener al menos 6 caracteres.',
    'auth/user-not-found':'No existe una cuenta con ese correo.',
    'auth/wrong-password':'Contraseña incorrecta.',
    'auth/invalid-credential':'Correo o contraseña incorrectos.',
    'auth/too-many-requests':'Demasiados intentos. Probá de nuevo en unos minutos.',
    'auth/missing-email':'Escribí tu correo para poder enviarte el enlace.',
    'auth/invalid-continue-uri':'No se pudo enviar el correo de recuperación. Avisale al equipo de CitrusCode.',
    'permission-denied':'Tu correo no está habilitado para crear una cuenta de administración. Registrate como mayorista o productor, o pedile al responsable del proyecto que agregue tu correo.',

}
function nextOrderNumber(){
  const ref = db.collection('meta').doc('contadorPedidos');
  return db.runTransaction(function(tx){
    return tx.get(ref).then(function(snap){
      const actual = (snap.exists && snap.data().valor) ? snap.data().valor : 8840;
      const next = actual + 1;
      tx.set(ref, { valor: next }, { merge:true });
      return next;
    });
  });
}
function genInvoice(order){
  const cae = Array.from({length:14}, function(){ return Math.floor(Math.random()*10); }).join('');
  return { cae: cae, fecha: new Date().toLocaleDateString('es-AR'), monto: order.qty * order.price };
}

/* ============================================================
   COMPROBANTES DESCARGABLES (PDF) — pedido realizado / entregado
   ============================================================ */
function descargarComprobante(orderId, tipo){
  const o = S.orders.find(function(x){ return x.id === orderId; });
  if(!o){ showToast('No se encontró el pedido'); return; }
  if(typeof window.jspdf === 'undefined'){ showToast('No se pudo cargar el generador de PDF'); return; }
  const p = lotById(o.lotId);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });

  doc.setFillColor(18, 53, 36);
  doc.rect(0, 0, 210, 30, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.text('CitrusCode', 15, 17);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  doc.text(tipo === 'entrega' ? 'Comprobante de entrega' : 'Comprobante de pedido', 15, 24);

  let y = 42;
  doc.setTextColor(21, 32, 24);
  function fila(label, valor){
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
    doc.text(label, 15, y);
    doc.setFont('helvetica', 'normal');
    doc.text(String(valor == null || valor === '' ? '—' : valor), 75, y);
    y += 8;
  }
  function separador(){
    doc.setDrawColor(228, 225, 213);
    doc.line(15, y, 195, y);
    y += 8;
  }

  fila('N° de pedido:', 'CC-' + o.numero);
  fila('Fecha de emisión:', new Date().toLocaleDateString('es-AR') + ' ' + new Date().toLocaleTimeString('es-AR'));
  fila('Estado actual:', STATUSES[o.statusIdx]);
  fila('Emitido para la cuenta:', currentUser.email);
  separador();

  fila('Producto:', p ? p.name : '(producto ya no disponible)');
  fila('Cantidad:', o.qty.toLocaleString('es-AR') + ' ' + unitOf(o));
  fila('Precio unitario:', money(o.price));
  fila('Monto total:', money(o.qty * o.price));
  separador();

  fila('Mayorista:', o.mayoristaNombre);
  fila('Productor:', p ? p.productorNombre : '—');

  if(tipo === 'entrega' && o.invoice){
    separador();
    fila('Fecha de entrega:', o.invoice.fecha);
    fila('CAE (simulado):', o.invoice.cae);
    fila('Monto facturado:', money(o.invoice.monto));
  } else if(tipo === 'entrega' && !o.invoice){
    separador();
    doc.setFont('helvetica', 'italic'); doc.setFontSize(10);
    doc.text('Este pedido todavía no llegó al estado "Entregado".', 15, y);
    y += 8;
  }

  y += 8;
  doc.setDrawColor(232, 135, 30);
  doc.setLineWidth(0.8);
  doc.line(15, y, 195, y);
  y += 8;
  doc.setFont('helvetica', 'italic');
  doc.setFontSize(8);
  doc.setTextColor(91, 107, 96);
  doc.text('Documento generado automáticamente por el sistema CitrusCode con fines de demostración académica.', 15, y);
  doc.text('No constituye un comprobante fiscal válido.', 15, y + 5);

  const nombreArchivo = 'CitrusCode_' + (tipo === 'entrega' ? 'ComprobanteEntrega' : 'ComprobantePedido') + '_CC-' + o.numero + '.pdf';
  doc.save(nombreArchivo);
  showToast('Comprobante descargado');
}

          // con un correo que no está habilitado). Deshacemos la cuenta recién creada
          // para no dejar un usuario huérfano sin perfil.
          const u = cred.user;

        });
      }).catch(function(err){
        errBox.textContent = mapAuthError(err.code);

}

function subscribeData(){
  unsubLotes = db.collection('lotes').orderBy('createdAt','desc').onSnapshot(function(snap){
    S.lots = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    revisarStockBajo();
    generarProgramados();
    avisarNovedades();
    renderSubnav(); renderMain();
  }, function(err){ showToast('Error leyendo productos: ' + err.message); });

  unsubPedidos = db.collection('pedidos').orderBy('createdAt','desc').onSnapshot(function(snap){
    S.orders = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    revisarStockBajo();   // el pronóstico de "se agota en N días" depende de las ventas
    renderSubnav(); renderMain();
    revisarQRDeEnlace();
  }, function(err){ showToast('Error leyendo pedidos: ' + err.message); });

  // Calificaciones de 1 a 5 estrellas (ranking de proveedores). Si las reglas
  // nuevas todavía no se publicaron, el resto del sistema sigue funcionando.
  unsubCalif = db.collection('calificaciones').onSnapshot(function(snap){
    S.ratings = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    califDisponible = true;
    renderMain();
  }, function(err){
    console.warn('[CitrusCode] Calificaciones no disponibles:', err.message);
    califDisponible = false;
    renderMain();
  });

  if(currentUser.rol === 'admin'){
    // Padrón de usuarios: solo la administración lo necesita.
    unsubUsuarios = db.collection('usuarios').onSnapshot(function(snap){
      S.users = snap.docs.map(function(d){ return Object.assign({uid:d.id}, d.data()); });
      renderSubnav(); renderMain();
    }, function(err){ showToast('Error leyendo usuarios: ' + err.message); });

    // Denuncias de publicaciones para moderar.
    unsubDenuncias = db.collection('denuncias').onSnapshot(function(snap){
      S.denuncias = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data({ serverTimestamps:'estimate' })); })
        .sort(function(a, b){ return msDe(b.createdAt) - msDe(a.createdAt); });
      renderSubnav();
      if(view.admin === 'moderacion') renderMain();
    }, function(err){ console.warn('[CitrusCode] Denuncias no disponibles:', err.message); });

    // La administración ve todos los proyectos.
    unsubProyectos = db.collection('proyectos').orderBy('createdAt','desc').onSnapshot(function(snap){
      S.projects = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      renderSubnav(); renderMain();
    }, function(err){ showToast('Error leyendo proyectos: ' + err.message); });
  } else if(currentUser.rol === 'productor'){
    // El productor solo ve las solicitudes que él mismo envió.
    unsubProyectos = db.collection('proyectos').where('solicitanteUid','==',currentUser.uid)
      .onSnapshot(function(snap){
        S.projects = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        renderSubnav(); renderMain();
      }, function(err){ showToast('Error leyendo tus solicitudes: ' + err.message); });
  }

  if(currentUser.rol === 'mayorista' || currentUser.rol === 'productor') suscribirChats();
  suscribirExtras();

  // Si la administración suspende la cuenta mientras está abierta, se cierra la sesión.
  unsubYo = db.collection('usuarios').doc(currentUser.uid).onSnapshot(function(d){
    const datos = d.data();
    if(datos && datos.suspendido === true){
      avisoSuspension = textoSuspension(datos);
      auth.signOut();
    }
  }, function(){});
}

/* Cotizaciones, calendario de cosecha y (solo administración) bitácora. */
function suscribirExtras(){
  const enVista = function(v){ return view[currentUser.rol] === v || (v === 'chats' && view[currentUser.rol] === 'chats'); };
  const cot = currentUser.rol === 'admin'
    ? db.collection('cotizaciones')
    : db.collection('cotizaciones').where('participantes','array-contains',currentUser.uid);
  unsubCotiz = cot.onSnapshot(function(snap){
    S.cotizaciones = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data({ serverTimestamps:'estimate' })); });
    renderSubnav();
    if(enVista('chats')) renderMain();
  }, function(err){ console.warn('[CitrusCode] Cotizaciones no disponibles:', err.message); });

  // Pedidos programados del mayorista: al entrar se generan los que ya vencieron.
  if(currentUser.rol === 'mayorista'){
    unsubProgramados = db.collection('programados').where('mayoristaUid','==',currentUser.uid).onSnapshot(function(snap){
      S.programados = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      programadosDisponible = true;
      if(enVista('pedidos')) renderMain();
      generarProgramados();
    }, function(err){
      console.warn('[CitrusCode] Pedidos programados no disponibles:', err.message);
      programadosDisponible = false;
      if(enVista('pedidos')) renderMain();
    });
  }

  unsubCosechas = db.collection('cosechas').onSnapshot(function(snap){
    S.cosechas = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    cosechasDisponible = true;
    if(enVista('cosecha')) renderMain();
  }, function(err){
    console.warn('[CitrusCode] Calendario de cosecha no disponible:', err.message);
    cosechasDisponible = false;
    if(enVista('cosecha')) renderMain();
  });

  if(currentUser.rol === 'admin'){
    unsubBitacora = db.collection('bitacora').orderBy('fecha','desc').limit(500).onSnapshot(function(snap){
      S.bitacora = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data({ serverTimestamps:'estimate' })); });
      bitacoraDisponible = true;
      if(enVista('bitacora')) renderMain();
    }, function(err){
      console.warn('[CitrusCode] Bitácora no disponible:', err.message);
      bitacoraDisponible = false;
      if(enVista('bitacora')) renderMain();
    });
  }
}

/* Chats directos: las conversaciones propias y la lista de contactos del otro rol
   (el mayorista ve a los productores y el productor a los mayoristas). */
function suscribirChats(){
  const otroRol = currentUser.rol === 'mayorista' ? 'productor' : 'mayorista';
  unsubContactos = db.collection('usuarios').where('rol','==',otroRol).onSnapshot(function(snap){
    S.contactos = snap.docs.map(function(d){ return Object.assign({uid:d.id}, d.data()); })
      .filter(function(u){ return u.uid !== currentUser.uid; });
    if(view[currentUser.rol] === 'chats' || view[currentUser.rol] === 'catalogo') renderMain();
  }, function(err){ console.warn('[CitrusCode] Contactos no disponibles:', err.message); });

  unsubConvs = db.collection('conversaciones').where('participantes','array-contains',currentUser.uid).onSnapshot(function(snap){
    if(convsCargadas){
      snap.docChanges().forEach(function(ch){
        if(ch.type === 'removed' || ch.doc.metadata.hasPendingWrites) return;
        const c = ch.doc.data();
        if(c.ultimoAutorUid && c.ultimoAutorUid !== currentUser.uid && ch.doc.id !== convAbierta){
          showToast('💬 Nuevo mensaje de ' + nombreOtroEnConv(Object.assign({id: ch.doc.id}, c)));
        }
      });
    }
    convsCargadas = true;
    S.convs = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data({ serverTimestamps:'estimate' })); });
    S.convs.sort(function(a, b){ return msDe(b.actualizado) - msDe(a.actualizado); });
    chatsDisponible = true;
    const abierta = convAbierta && S.convs.find(function(c){ return c.id === convAbierta; });
    if(abierta) marcarVista(abierta);
    renderSubnav();
    if(view[currentUser.rol] === 'chats') renderMain();
  }, function(err){
    console.warn('[CitrusCode] Chats no disponibles:', err.message);
    chatsDisponible = false;
    if(view[currentUser.rol] === 'chats') renderMain();
  });
}

  if(unsubCalif) unsubCalif();
  cerrarChat();
  mapaAbierto = mapaAnimado = null; precioSel = null; fotoNueva = null;
  Object.keys(avisadosStock).forEach(function(k){ delete avisadosStock[k]; });
  unsubLotes = unsubPedidos = unsubProyectos = unsubUsuarios = unsubCalif = null;
  if(unsubYo){ unsubYo(); unsubYo = null; }
  if(unsubDenuncias){ unsubDenuncias(); unsubDenuncias = null; }
  campanaAbierta = false;
  editandoLote = null;
  catFilter = prodFilter = itemFilter = 'todos';
  catBusqueda = ''; catOrden = 'recientes';
  if(unsubConvs) unsubConvs();
  if(unsubContactos) unsubContactos();
  cerrarConversacion();
  unsubConvs = unsubContactos = null;
  convsCargadas = false; chatsDisponible = true;
  Object.keys(marcandoVista).forEach(function(k){ delete marcandoVista[k]; });
  if(unsubCotiz) unsubCotiz();
  if(unsubCosechas) unsubCosechas();
  if(unsubBitacora) unsubBitacora();
  unsubCotiz = unsubCosechas = unsubBitacora = null;
  if(unsubProgramados){ unsubProgramados(); unsubProgramados = null; }
  programarAbierto = null; generandoProgramados = false; programadosDisponible = true;
  catMapa = false; provFilter = 'todos';
  cotizFormAbierto = false; reservaAbierta = null; cosechaCat = 'todos'; novedadesAvisadas = false;
  bitFiltro = { rol: 'todos', accion: 'todas', q: '' };
  S = { lots: [], orders: [], projects: [], users: [], cart: {}, ratings: [], convs: [], contactos: [], cotizaciones: [], cosechas: [], bitacora: [], programados: [], denuncias: [] };
}

let ultimaVista = null;   // sección dibujada la última vez (para animar solo al cambiar)
let animTimer = null;
function renderMain(){
  const main = document.getElementById('main');
  if(!main || !currentUser) return;

  // Firestore redibuja la vista cuando llegan datos nuevos: si el usuario estaba
  // escribiendo, le devolvemos el foco y lo que había tipeado.
  const act = document.activeElement;
  let foco = null;
  if(act && act.id && main.contains(act)){
    foco = { id: act.id, tag: act.tagName, value: act.value, s: null, e: null };
    try { foco.s = act.selectionStart; foco.e = act.selectionEnd; } catch(_){}
  }

  // Los formularios marcados con data-keep conservan lo cargado entre redibujos
  // (llegan mensajes o datos nuevos mientras el usuario completa el formulario).
  const guardados = {};
  main.querySelectorAll('[data-keep] input[id]:not([type=file]), [data-keep] select[id], [data-keep] textarea[id]').forEach(function(el){ guardados[el.id] = el.type === 'checkbox' ? el.checked : el.value; });

  // Las animaciones de entrada corren solo al cambiar de sección.
  const clave = currentUser.rol + ':' + view[currentUser.rol];
  const mismaVista = clave === ultimaVista;
  if(clave !== ultimaVista){
    // Al cambiar de sección se cierran los mensajes, el chat y el mapa abiertos.
    cerrarChat();
    cerrarConversacion();
    cotizFormAbierto = false; reservaAbierta = null;
    liberarMapa();
    const primera = ultimaVista === null;
    ultimaVista = clave;
    main.classList.remove('animar');
    void main.offsetWidth;
    main.classList.add('animar');
    clearTimeout(animTimer);
    animTimer = setTimeout(function(){ main.classList.remove('animar'); }, 1500);
    if(!primera && window.scrollY > 120) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // El mapa abierto se conserva entre redibujos para no recargarlo con cada dato nuevo.
  let mapaVivo = null;
  if(mapaAbierto){
    const m = document.getElementById('mapa-' + mapaAbierto);
    if(m && m._mapa){ mapaVivo = m; m.remove(); }
  }

  // El perfil es común a los tres roles.
  if(view[currentUser.rol] === 'perfil'){
    main.innerHTML = viewPerfil();
  } else if(view[currentUser.rol] === 'ranking'){
    main.innerHTML = viewRanking();
  } else if(view[currentUser.rol] === 'precios'){
    main.innerHTML = viewPrecios();
  } else if(view[currentUser.rol] === 'chats' && currentUser.rol !== 'admin'){
    main.innerHTML = viewChats();
  } else if(view[currentUser.rol] === 'cosecha' && currentUser.rol !== 'admin'){
    main.innerHTML = viewCosecha();
  } else if(view[currentUser.rol] === 'alertas' && currentUser.rol === 'mayorista'){
    main.innerHTML = viewAlertas();
  } else if(view[currentUser.rol] === 'bitacora' && currentUser.rol === 'admin'){
    main.innerHTML = viewBitacora();
  } else if(currentUser.rol === 'mayorista'){
    if(view.mayorista === 'catalogo') main.innerHTML = viewMayoristaCatalogo();
    else if(view.mayorista === 'pedidos') main.innerHTML = viewMayoristaPedidos();
    else if(view.mayorista === 'trazabilidad') main.innerHTML = viewMayoristaTrazabilidad();
    else main.innerHTML = viewMayoristaFacturas();
  } else if(currentUser.rol === 'productor'){
    if(view.productor === 'publicaciones') main.innerHTML = viewProductorPublicaciones();
    else if(view.productor === 'recibidos') main.innerHTML = viewProductorRecibidos();
    else if(view.productor === 'ganancias') main.innerHTML = viewProductorDashboard();
    else if(view.productor === 'medida') main.innerHTML = viewProductorMedida();
    else main.innerHTML = viewProductorTrazabilidad();
  } else {
    if(view.admin === 'dashboard') main.innerHTML = viewAdminDashboard();
    else if(view.admin === 'pedidos') main.innerHTML = viewAdminPedidos();
    else if(view.admin === 'usuarios') main.innerHTML = viewAdminUsuarios();
    else if(view.admin === 'reportes') main.innerHTML = viewAdminReportes();
    else if(view.admin === 'moderacion') main.innerHTML = viewAdminModeracion();
    else main.innerHTML = viewAdminMedida();
  }
  if(mismaVista){
    main.querySelectorAll('[data-keep] input[id]:not([type=file]), [data-keep] select[id], [data-keep] textarea[id]').forEach(function(el){
      if(guardados[el.id] === undefined) return;
      if(el.type === 'checkbox'){ el.checked = guardados[el.id]; return; }
      if(el.tagName === 'SELECT' && !Array.prototype.some.call(el.options, function(o){ return o.value === guardados[el.id]; })) return;
      el.value = guardados[el.id];
    });
  }
  bindMainEvents();

  if(foco){
    const el = document.getElementById(foco.id);
    if(el && el.tagName === foco.tag){
      if((el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') && !el.readOnly && !el.disabled) el.value = foco.value;
      try { el.focus({ preventScroll: true }); } catch(_){ el.focus(); }
      try { if(foco.s != null) el.setSelectionRange(foco.s, foco.e); } catch(_){}
    }
  }
  if(main.classList.contains('animar')) animarKPIs(main);

  if(mapaAbierto){
    const lugar = document.getElementById('mapa-' + mapaAbierto);
    const esCatalogo = mapaAbierto === 'catalogo';
    const ord = esCatalogo ? null : S.orders.find(function(x){ return x.id === mapaAbierto; });
    if(mapaVivo && lugar){
      lugar.replaceWith(mapaVivo);
      mapaVivo._mapa.invalidateSize();
      if(esCatalogo){ if(mapaVivo._actualizar) mapaVivo._actualizar(); }
      else if(ord && mapaVivo._actualizar) mapaVivo._actualizar(ord);
    } else if(lugar && esCatalogo){
      dibujarMapaCatalogo();
    } else if(lugar && ord){
      dibujarMapa(ord);
    } else if(mapaVivo){
      mapaVivo._mapa.remove();
    }
  } else if(mapaVivo){
    mapaVivo._mapa.remove();
  }
  const cm = document.getElementById('chatMsgs');
  if(cm){ cm.style.scrollBehavior = 'auto'; cm.scrollTop = cm.scrollHeight; cm.style.scrollBehavior = ''; }
}

/* Cuenta ascendente de los números de los KPIs ($ 1.234.567, 45 %, 12). */
function animarKPIs(main){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  main.querySelectorAll('.kpi-value').forEach(function(el){
    const m = el.textContent.match(/^(\D*)([\d.]+)(\D*)$/);
    if(!m) return;
    const fin = parseInt(m[2].replace(/\./g, ''), 10);
    if(!fin) return;
    const t0 = performance.now(), dur = 900;
    function paso(ahora){
      const p = Math.min(1, (ahora - t0) / dur);
      const v = Math.round(fin * (1 - Math.pow(1 - p, 3)));
      el.textContent = m[1] + v.toLocaleString('es-AR') + m[3];
      if(p < 1 && el.isConnected) requestAnimationFrame(paso);
    }
    requestAnimationFrame(paso);
  });
}

/* Punto que "vuela" desde el botón Agregar hasta el carrito flotante. */
function volarAlCarrito(desde){
  if(!desde.animate || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  const a = desde.getBoundingClientRect();
  const fab = document.getElementById('cartFab');
  const destino = (fab && fab.classList.contains('show'))
    ? fab.getBoundingClientRect()
    : { left: window.innerWidth - 150, top: window.innerHeight - 70, width: 40, height: 40 };
  const x0 = a.left + a.width/2, y0 = a.top + a.height/2;
  const x1 = destino.left + 28, y1 = destino.top + destino.height/2;
  const dot = document.createElement('div');
  dot.className = 'fly-dot';
  dot.style.left = x0 + 'px'; dot.style.top = y0 + 'px';
  document.body.appendChild(dot);
  const dx = x1 - x0, dy = y1 - y0;
  dot.animate([
    { transform: 'translate(0,0) scale(1)' },
    { transform: 'translate('+(dx*0.5)+'px,'+(dy*0.5 - 140)+'px) scale(1.25)', offset: 0.45 },
    { transform: 'translate('+dx+'px,'+dy+'px) scale(.4)', opacity: .6 }
  ], { duration: 750, easing: 'cubic-bezier(.5,0,.3,1)' }).onfinish = function(){
    dot.remove();
    const f = document.getElementById('cartFab');
    if(f){ f.classList.remove('bump'); void f.offsetWidth; f.classList.add('bump'); }
  };
}

/* Descarga la tabla del panel como CSV (se abre bien en Excel en español). */
function exportarTablaCSV(boton, nombre){
  const panel = boton.closest('.panel');
  const tabla = panel ? panel.querySelector('table.simple') : null;
  if(!tabla){ showToast('No hay datos para exportar'); return; }
  const filas = Array.from(tabla.querySelectorAll('tr'));
  const titulos = Array.from(filas[0].children).map(function(c){ return c.textContent.trim(); });
  const celda = function(t){ return '"' + t.replace(/"/g, '""') + '"'; };
  const lineas = [];
  filas.forEach(function(tr, i){
    // Se saltean las filas de "todavía no hay…" y las columnas sin título (botones).
    if(tr.children.length !== titulos.length) return;
    const valores = Array.from(tr.children)
      .filter(function(_, j){ return titulos[j] !== ''; })
      .map(function(c){ return celda(c.textContent.replace(/\s+/g, ' ').trim()); });
    lineas.push(valores.join(';'));
  });
  if(lineas.length < 2){ showToast('No hay datos para exportar'); return; }
  const blob = new Blob(['\ufeff' + lineas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'CitrusCode_' + nombre + '_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
  showToast('Exportaste ' + (lineas.length - 1) + ' fila(s) a CSV');
}
/* Guarda (o actualiza) la calificación de un pedido entregado. Una por pedido. */
function guardarCalificacion(orderId, valor, caja){
  const o = S.orders.find(function(x){ return x.id === orderId; });
  if(!o || !(valor >= 1 && valor <= 5)) return;
  const lote = lotById(o.lotId) || S.lots.find(function(l){ return l.productorUid === o.productorUid; });
  const cmt = document.getElementById('cmt-' + orderId);
  const previa = S.ratings.find(function(r){ return r.id === orderId; });
  if(caja){
    // Respuesta visual inmediata, antes de que confirme Firestore.
    caja.querySelectorAll('button').forEach(function(btn){ btn.classList.toggle('on', parseInt(btn.dataset.val, 10) <= valor); });
    caja.classList.remove('pop'); void caja.offsetWidth; caja.classList.add('pop');
  }
  db.collection('calificaciones').doc(o.id).set({
    pedidoId: o.id,
    numero: o.numero || null,
    productorUid: o.productorUid,
    productorNombre: lote ? lote.productorNombre : 'Productor',
    producto: lote ? lote.name : '',
    mayoristaUid: currentUser.uid,
    mayoristaNombre: currentUser.entidad || currentUser.nombre,
    estrellas: valor,
    comentario: cmt ? cmt.value.trim().slice(0, 300) : '',
    fecha: FieldValue.serverTimestamp()
  }).then(function(){
    if(caja) registrar('Calificación', (lote ? lote.productorNombre : 'Productor') + ' · ' + valor + ' estrella' + (valor > 1 ? 's' : '') + ' · CC-' + o.numero);
    showToast(caja ? (previa ? 'Actualizaste tu calificación: ' : '¡Gracias! Calificaste con ') + valor + ' estrella' + (valor > 1 ? 's' : '') : 'Comentario guardado');
  }).catch(function(err){
    console.error('[CitrusCode] No se pudo guardar la calificación:', err);
    showToast(err.code === 'permission-denied'
      ? 'Firestore rechazó la calificación: falta publicar las reglas nuevas en la consola de Firebase.'
      : 'No se pudo guardar la calificación: ' + err.message);
    renderMain();
  });
}
function botonExportar(nombre){
  return '<button class="btn btn-ghost btn-sm" data-export="'+nombre+'">'+icono('descargar')+'Exportar CSV</button>';
}
